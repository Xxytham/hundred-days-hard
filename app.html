      case "finish-dismiss": S().finishDismissed = S().startDate; save("settings"); render(true); break;
      case "new-round": openNewRound(); break;
      case "round-len": document.getElementById("round-custom").value = el.dataset.v; document.querySelectorAll("[data-action=round-len]").forEach((b) => b.setAttribute("aria-pressed", String(b === el))); break;
      case "round-start": {
        const v = Math.round(+document.getElementById("round-custom").value);
        if (!(v >= 1 && v <= 1000)) { toast("Pick a length between 1 and 1000 days"); break; }
        const st = S();
        st.rounds = (st.rounds || []).concat([{ startDate: st.startDate, totalDays: TOTAL() }]);
        st.startDate = todayISO(); st.totalDays = v; st.finishDismissed = null;
        save("settings"); closeSheet(); view = "today"; viewDate = todayISO(); render(true); window.scrollTo(0, 0);
        toast("Day 1 of " + v + ". Let's go.");
        break;
      }
      case "su-task": { const id = el.dataset.id; draft.tasks = draft.tasks.includes(id) ? draft.tasks.filter((x) => x !== id) : draft.tasks.concat(id); render(true); break; }
      case "fab":
        if (fabWrap.classList.contains("open")) fabMenu(false);
        else if (peekDay(viewDate).workout) openWorkout();
        else fabMenu(true);
        break;
      case "fab-close": fabMenu(false); break;
      case "start-workout": fabMenu(false); startWorkout(el.dataset.type); break;
      case "open-workout": openWorkout(); break;
      case "ex-step": {
        const e = findEx(el.dataset.id), f = el.dataset.f, dir = +el.dataset.d;
        if (!e) break;
        const cs = ensureSets(e)[curIdx(e)];
        if (f === "w") cs.w = Math.max(0, half(cs.w + dir * stepFor(e.unit)));
        else cs.r = Math.max(0, (+cs.r || 0) + dir);
        syncEx(e); save(viewDate); drawWorkout(); break;
      }
      case "set-step": {
        // + moves to the next set, adding one (a copy of this set) after the last; − goes back a set.
        const e = findEx(el.dataset.id), dir = +el.dataset.d;
        if (!e) break;
        const l = ensureSets(e), ci = curIdx(e);
        if (dir > 0) { if (ci === l.length - 1) l.push({ ...l[ci] }); curSet[e.id] = ci + 1; }
        else curSet[e.id] = Math.max(0, ci - 1);
        syncEx(e); save(viewDate); drawWorkout(); break;
      }
      case "set-go": { const e = findEx(el.dataset.id); if (e) { curSet[e.id] = +el.dataset.k; drawWorkout(); } break; }
      case "set-del": {
        const e = findEx(el.dataset.id);
        if (!e) break;
        const l = ensureSets(e), ci = curIdx(e);
        if (l.length > 1) { l.splice(ci, 1); curSet[e.id] = Math.max(0, ci - 1); syncEx(e); save(viewDate); drawWorkout(); }
        break;
      }
      case "ex-unit": {
        const e = findEx(el.dataset.id), u = el.dataset.u;
        if (!e || e.unit === u) break;
        ensureSets(e).forEach((x) => (x.w = half(toUnit(x.w, e.unit, u))));
        e.unit = u; syncEx(e);
        save(viewDate); drawWorkout(); break;
      }
      case "ex-del": {
        const w = day().workout, i = w.exercises.findIndex((e) => e.id === el.dataset.id);
        if (i < 0) break;
        const [gone] = w.exercises.splice(i, 1);
        save(viewDate); drawWorkout(); render();
        toast("Removed " + gone.name, () => { const w2 = getDay(viewDate).workout; if (!w2) return; w2.exercises.splice(Math.min(i, w2.exercises.length), 0, gone); save(viewDate); render(); if (!sheet.hidden) drawWorkout(); });
        break;
      }
      case "ex-rename": {
        renaming = el.dataset.id; renameAsk = null; drawWorkout();
        const f = document.getElementById("ex-rename-in");
        if (f) { f.focus(); f.select(); }
        break;
      }
      case "rename-all": case "rename-one":
        if (renameAsk) { renameExercise(renameAsk.id, renameAsk.to, a === "rename-all"); renameAsk = null; render(); drawWorkout(); }
        break;
      case "rename-cancel": renameAsk = null; drawWorkout(); break;
      case "wadd-open": wAdding = true; wEdit = false; drawWorkout(); setTimeout(() => { const f = document.getElementById("wadd-name"); if (f) { f.focus(); fitTyping(); } }, 30); break;
      case "wadd-cancel": wAdding = false; drawWorkout(); break;
      case "w-edit": wEdit = !wEdit; wAdding = false; renaming = renameAsk = null; drawWorkout(); break;
      case "w-discard":
        if (!wConfirmDiscard) { wConfirmDiscard = true; drawWorkout(); break; }
        day().workout = null; save(viewDate); closeSheet(); render(true); toast("Workout discarded");
        break;
      case "w-save": {
        const d = day(), w = d.workout;
        if (!w || !w.exercises.length) break;
        const first = !w.saved;
        w.saved = true; w.savedAt = Date.now();
        autoMetricHabits(d, viewDate);
        save(viewDate); closeSheet(); render(true);
        buzz("confirm");
        toast(typeName(w.type) + " day " + (first ? "saved" : "updated"));
        break;
      }
      case "str-type": strType = strType === el.dataset.type ? null : el.dataset.type; strSel = null; render(true); break;
      case "str-sel": strSel = strSel === el.dataset.k ? null : el.dataset.k; render(true); break;
      case "close-sheet": closeSheet(); break;
      case "unit": S().unit = el.dataset.unit; save("settings"); render(true); break;
      case "del-habit": S().habits = S().habits.filter((h) => h.id !== el.dataset.id); save("settings"); render(true); break;
      case "toggle-step": {
        const g = findGoal(el.dataset.g), st = g && g.steps.find((x) => x.id === el.dataset.s);
        if (!st) break;
        st.done = !st.done;
        st.doneDay = st.done ? dayNum(todayISO()) : null;
        buzz(st.done ? "confirm" : "tick");
        save("goals"); render(true);
        if (st.done) toast(g.name + ": " + st.text + " reached");
        break;
      }
      case "goal-tick": {
        if (gsBusy || Date.now() - lastScroll < 300) break;
        const g = findGoal(el.dataset.g), st = g && g.steps.find((x) => x.id === el.dataset.s);
        if (!st || st.done) break;
        st.done = true; st.doneDay = dayNum(todayISO());
        buzz("confirm"); save("goals"); slideThenRender(g, 1);
        const gid = g.id, sid = st.id;
        toast(g.name + ": " + st.text + " reached", () => {
          const g2 = findGoal(gid), st2 = g2 && g2.steps.find((x) => x.id === sid);
          if (!st2 || !st2.done) return;
          st2.done = false; st2.doneDay = null;
          buzz("tick"); save("goals"); slideThenRender(g2, -1);
        });
        break;
      }
      case "toast-undo": { const f = toastUndo; hideToast(); if (f) f(); break; }
      case "stat-tab": statTab = el.dataset.k; render(true); break;
      case "watch-later": S().watchOffer = el.dataset.v; save("settings"); render(true); break;
      case "stat-sel": statSel[statTab] = statSel[statTab] === el.dataset.k ? "" : el.dataset.k; render(true); break;
      case "new-goal-toggle": newGoalOpen = !newGoalOpen; render(true); if (newGoalOpen) { const f = document.getElementById("new-goal"); if (f) f.focus(); } break;
      case "edit-goal": editingGoal = editingGoal === el.dataset.g ? null : el.dataset.g; openGoal = el.dataset.g; confirmDelete = null; render(true); break;
      case "open-goal": openGoal = openGoal === el.dataset.g ? null : el.dataset.g; if (editingGoal !== openGoal) editingGoal = null; confirmDelete = null; render(true); break;
      case "goal-group": { const g = findGoal(el.dataset.g); if (g) { g.group = el.dataset.v; save("goals"); render(true); } break; }
      case "del-step": { const g = findGoal(el.dataset.g); if (g) { g.steps = g.steps.filter((x) => x.id !== el.dataset.s); save("goals"); render(true); } break; }
      case "del-goal":
        if (confirmDelete !== el.dataset.g) { confirmDelete = el.dataset.g; render(true); break; }
        state.goals.list = state.goals.list.filter((g) => g.id !== el.dataset.g);
        confirmDelete = editingGoal = null; save("goals"); render(true); toast("Goal deleted");
        break;
      case "restore": startRestore(); break;
      case "save-backup": saveBackupFile(); break;
      case "health-connect": if (bridge) bridge.healthConnect(); break;
      case "health-settings": if (bridge) bridge.healthSettings(); break;
      case "health-sync": healthSync(); toast("Checking Samsung Health"); break;
      case "use-health": { const d = day(); d.kcalSrc = null; save(viewDate); healthSync(); render(true); break; }
    }
  });

  document.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const val = (id) => document.getElementById(id).value.trim();
    if (f.id === "wadd-form") {
      const name = val("wadd-name");
      if (!name) return;
      const w = getDay(viewDate).workout;
      const known = lastExercise(name, viewDate);
      const unit = known ? known.e.unit : S().unit;
      const ne = { id: uid(), name: known ? known.e.name : name, unit, setList: [{ w: half(+val("wadd-weight") || 0), r: Math.max(0, Math.round(+val("wadd-reps") || 0)) }] };
      syncEx(ne);
      w.exercises.push(ne);
      buzz("confirm");
      save(viewDate); render();
      drawWorkout();
      const n = document.getElementById("wadd-name");
      if (n) { n.focus(); fitTyping(); }
    } else if (f.id.indexOf("step-form-") === 0) {
      const g = findGoal(f.dataset.goal), text = val("step-in-" + f.dataset.goal);
      if (!g || !text) return;
      g.steps.push({ id: uid(), text, done: false, doneDay: null });
      save("goals"); render(true);
      document.getElementById("step-in-" + g.id).focus();
    } else if (f.id === "goal-form") {
      const name = val("new-goal");
      if (!name) return;
      const g = { id: uid(), name, focus: "", steps: [] };
      state.goals.list.push(g);
      editingGoal = openGoal = g.id;
      save("goals"); render(true);
      document.getElementById("step-in-" + g.id).focus();
    } else if (f.id === "su-task-form") {
      const name = val("su-task-new");
      if (!name) return;
      const t = { id: uid(), name };
      draft.custom.push(t); draft.tasks.push(t.id);
      render(true);
      document.getElementById("su-task-new").focus();
    } else if (f.id === "habit-form") {
      const name = val("new-habit");
      if (!name) return;
      S().habits = [...S().habits, { id: uid(), name }];
      save("settings"); render(true);
      document.getElementById("new-habit").focus();
    }
  });

  // Setup fields update the draft as you type, so tapping other controls never loses them.
  function setupDayHint() {
    const start = addDays(todayISO(), -(draft.day - 1)), last = addDays(start, draft.len - 1);
    const a = document.getElementById("su-last"), b = document.getElementById("su-last-n");
    if (a) a.textContent = fmtDate(last, { weekday: "long", month: "long", day: "numeric" });
    if (b) { const left = diffDays(todayISO(), last); b.textContent = "Day " + draft.len + (left === 0 ? " is today." : ", " + left + " day" + (left === 1 ? "" : "s") + " from now."); }
  }
  document.addEventListener("input", (ev) => {
    const t = ev.target, v = Math.round(+t.value);
    if (t.id === "su-day" && v >= 1 && v <= draft.len) { draft.day = v; setupDayHint(); }
    else if (t.id === "su-len" && v >= 1 && v <= 1000) { draft.len = v; draft.day = Math.min(draft.day, v); }
    else if (t.id === "su-kcal" && v > 0) draft.kcal = v;
    else if (t.id === "su-protein" && v >= 0 && t.value !== "") draft.protein = v;
    if (t.id === "su-kcal") { const r = document.getElementById("su-range"); if (r) r.textContent = "Your range: " + calText("lose", draft.kcal) + "."; }
    else if (["su-age", "su-hft", "su-hin", "su-hcm", "su-weight"].includes(t.id)) {
      draft[{ "su-age": "age", "su-hft": "heightFt", "su-hin": "heightIn", "su-hcm": "heightCm", "su-weight": "weight" }[t.id]] = t.value;
      const r = document.getElementById("su-result"); if (r) r.innerHTML = suggestionHTML();
    }
  });

  // Tapping a big number box in setup clears it, so you type a fresh value. Leaving it empty puts the old one back.
  document.addEventListener("focusin", (ev) => {
    const t = ev.target;
    if (t.classList && t.classList.contains("inline-num")) { t.dataset.was = t.value; t.value = ""; }
  });
  document.addEventListener("focusout", (ev) => {
    const t = ev.target;
    if (t.classList && t.classList.contains("inline-num") && t.value === "") { t.value = t.dataset.was || ""; t.dispatchEvent(new Event("input", { bubbles: true })); }
  });

  // Totals are saved when you leave the box; the bars then count up to the new number.
  function readTotal(id) { const v = document.getElementById(id).value.trim(); return v === "" ? null : Math.max(0, Math.round(+v)); }
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.id === "in-kcal" || t.id === "in-protein") {
      return; // the bars move once you leave the box (see animateFood)
    }
    if (t.id !== "wadd-name") return;
    // Picking an exercise you've done before fills in what you did last time.
    const k = lastExercise(t.value, viewDate);
    if (!k) return;
    document.getElementById("wadd-weight").value = k.e.weight || "";
    document.getElementById("wadd-unit").textContent = k.e.unit;
    document.getElementById("wadd-reps").value = k.e.reps;
  });

  // A change fires as you leave a box, before the next box you tapped has focus. Redrawing right then would
  // swap that box out from under your tap, so wait a moment: if you're now typing in another box, the redraw
  // waits until you leave it.
  const renderSoon = () => setTimeout(() => render(), 0);
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.id === "in-kcal" || t.id === "in-protein") {
      const d = getDay(viewDate);
      const k = readTotal("in-kcal"), p = readTotal("in-protein");
      if (k === d.kcal && p === d.protein) return;
      const hadGoal = d.protein != null && d.protein >= S().proteinGoal;
      d.kcal = k; d.protein = p; d.kcalSrc = "manual";
      if (!hadGoal) autoProteinHabit(d);
      save(viewDate); renderSoon(); toast("Saved");
    } else if (t.classList.contains("sval")) {
      const e = findEx(t.dataset.id), f = t.dataset.f, v = parseFloat(t.value);
      if (!e || !(v >= 0)) { drawWorkoutSoon(); return; }
      const cs = ensureSets(e)[curIdx(e)];
      if (f === "w") cs.w = half(v); else cs.r = Math.round(v);
      syncEx(e); save(viewDate); drawWorkoutSoon();
    } else if (t.id.indexOf("focus-") === 0) {
      const g = findGoal(t.dataset.goal);
      if (g) { g.focus = t.value.trim(); save("goals"); }
    } else if (t.id === "weight") {
      const w = parseFloat(t.value);
      getDay(viewDate).weight = w > 0 ? Math.round(w * 10) / 10 : null;
      save(viewDate); toast(w > 0 ? "Weight saved" : "Weight cleared");
    } else if (t.id === "set-day") {
      const n = Math.round(+t.value);
      if (n >= 1 && n <= TOTAL()) { S().startDate = addDays(todayISO(), -(n - 1)); save("settings"); toast("Today is now day " + n); renderSoon(); }
    } else if (t.id === "set-len") {
      const n = Math.round(+t.value);
      if (n >= 1 && n <= 1000) { S().totalDays = n; save("settings"); toast("Challenge length: " + n + " days"); renderSoon(); }
    } else if (t.id === "set-workouts") {
      const v = Math.round(+t.value);
      if (v >= 1 && v <= 5) { S().workoutsTarget = v; save("settings"); reTick(); renderSoon(); }
    } else if (t.id === "set-steps" || t.id === "set-sleep") {
      const v = +t.value, key = { "set-steps": "stepsTarget", "set-sleep": "sleepTarget" }[t.id];
      if (v > 0) { S()[key] = t.id === "set-steps" ? Math.round(v) : Math.round(v * 2) / 2; save("settings"); reTick(); renderSoon(); }
    } else if (t.id === "set-kcal") {
      const v = Math.round(+t.value); if (v > 0) { S().calorieGoal = v; save("settings"); renderSoon(); }
    } else if (t.id === "set-protein") {
      const v = Math.round(+t.value); if (v >= 0) { S().proteinGoal = v; save("settings"); }
    }
  });

  // Enter on the number keyboard moves from calories to protein, then closes the keyboard.
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && fabWrap.classList.contains("open")) fabMenu(false);
    if (ev.key === "Escape" && !sheet.hidden) closeSheet();
    // Adding an exercise: Next on the keyboard goes name → weight → reps, and the last one adds it.
    if (ev.key === "Enter" && ["wadd-name", "wadd-weight", "wadd-reps"].includes(ev.target.id)) {
      ev.preventDefault();
      if (ev.target.id === "wadd-name") { if (ev.target.value.trim()) document.getElementById("wadd-weight").focus(); }
      else if (ev.target.id === "wadd-weight") document.getElementById("wadd-reps").focus();
      else document.getElementById("wadd-form").requestSubmit();
    }
    if (ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("sval")) { ev.preventDefault(); ev.target.blur(); }
    if (ev.key === "Enter" && ev.target.id === "ex-rename-in") { ev.preventDefault(); ev.target.blur(); }
    if (ev.key === "Enter" && (ev.target.id === "in-kcal" || ev.target.id === "in-protein" || ev.target.id === "weight")) {
      ev.preventDefault();
      if (ev.target.id === "in-kcal") document.getElementById("in-protein").focus();
      else ev.target.blur();
    }
  });

  // Android back button (used by the installed app): close a sheet, then return to Today, then exit.
  window.__appBack = function () {
    if (fabWrap.classList.contains("open")) { fabMenu(false); return true; }
    if (!sheet.hidden) { closeSheet(); return true; }
    if (!S().setupDone && setupReady) {
      if (setupStep > 0) { setupStep--; render(true); return true; }
      return false;
    }
    if (view === "stats" && statSel[statTab]) { statSel[statTab] = ""; render(true); return true; }
    if (editingGoal || openGoal || strSel) { editingGoal = confirmDelete = openGoal = strSel = null; render(true); return true; }
    if (view !== "today" || viewDate !== todayISO()) { view = "today"; viewDate = todayISO(); render(true); window.scrollTo(0, 0); return true; }
    return false;
  };

  // Pull down at the top of Today to refresh from Samsung Health (installed app, once connected).
  const ptrEl = document.getElementById("ptr");
  let ptr = null, ptrBusy = false, ptrT = null;
  const PTR_AT = 64;
  function ptrDone(msg) {
    clearTimeout(ptrT); ptrBusy = false;
    ptrEl.classList.add("back"); ptrEl.classList.remove("busy", "armed");
    ptrEl.style.transform = ""; ptrEl.style.opacity = "";
    if (msg) toast(msg);
  }
  document.addEventListener("touchstart", (ev) => {
    ptr = null;
    if (view !== "today" || health !== "granted" || ptrBusy || !sheet.hidden || fabWrap.classList.contains("open") || ev.touches.length !== 1 || window.scrollY > 0) return;
    if (ev.target.closest("input")) return;
    ptr = { x0: ev.touches[0].clientX, y0: ev.touches[0].clientY, on: false, d: 0, armed: false };
  }, { passive: true });
  document.addEventListener("touchmove", (ev) => {
    if (!ptr || ev.touches.length !== 1) return;
    const dy = ev.touches[0].clientY - ptr.y0, dx = ev.touches[0].clientX - ptr.x0;
    if (!ptr.on) {
      if (dy > 8 && dy > Math.abs(dx) * 1.5 && window.scrollY <= 0) { ptr.on = true; ptrEl.classList.remove("back"); }
      else { if (dy < -4 || Math.abs(dx) > 12) ptr = null; return; }
    }
    ev.preventDefault();
    ptr.d = Math.min(120, Math.max(0, dy - 8) * 0.55);
    ptrEl.style.transform = "translateY(" + (ptr.d - 50).toFixed(1) + "px)";
    ptrEl.style.opacity = String(Math.min(1, ptr.d / 40));
    const armed = ptr.d >= PTR_AT;
    if (armed !== ptr.armed) { ptr.armed = armed; ptrEl.classList.toggle("armed", armed); if (armed) buzz("tick"); }
  }, { passive: false });
  const ptrEnd = () => {
    if (!ptr || !ptr.on) { ptr = null; return; }
    const go = ptr.armed;
    ptr = null;
    ptrEl.classList.add("back");
    if (!go) { ptrDone(); return; }
    ptrBusy = true;
    ptrEl.classList.remove("armed"); ptrEl.classList.add("busy");
    ptrEl.style.transform = "translateY(" + (PTR_AT - 50) + "px)"; ptrEl.style.opacity = "1";
    buzz("confirm");
    ptrT = setTimeout(() => ptrDone(), 8000); // never spin forever
    if (healthBusy) return; // a check is already on its way; its answer ends this one too
    healthSync();
  };
  document.addEventListener("touchend", ptrEnd);
  document.addEventListener("touchcancel", ptrEnd);

  // Long-press menus and text selection are for web pages; keep them only where you type.
  document.addEventListener("contextmenu", (ev) => { if (!ev.target.closest("input, textarea")) ev.preventDefault(); });

  // Opened from a home-screen shortcut ("Log Push day"): go to Today and start that workout, or open today's.
  window.__shortcut = function (type) {
    if (!TYPES.some((t) => t.id === type) || !S().setupDone) return;
    fabMenu(false);
    if (!sheet.hidden) closeSheet();
    view = "today"; viewDate = todayISO(); render(true); window.scrollTo(0, 0);
    if (peekDay(viewDate).workout) openWorkout(); else startWorkout(type);
  };

  // Roll over to the new day if the app stays open past midnight.
  let lastToday = todayISO();
  setInterval(() => { const t = todayISO(); if (t !== lastToday) { if (viewDate === lastToday) viewDate = t; lastToday = t; render(); } }, 60000);

  // Upgrade anything saved by the meal-by-meal version.
  if (Object.values(state.days).length) persistLocal();
  render(true);
  healthSync();
  scheduleFileBackup();
  connect().catch(() => { setupReady = true; render(); });
  checkForUpdate();
  try { const sc = bridge && bridge.takeShortcut ? bridge.takeShortcut() : ""; if (sc) window.__shortcut(sc); } catch (e) { /* ignore */ }
})();
</script>
