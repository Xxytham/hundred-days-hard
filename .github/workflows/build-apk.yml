# Whenever android/VERSION changes on main:
#   build  - signs the APK and publishes it as a GitHub Release (needs the KEYSTORE_B64 secret)
#   web    - publishes the iPhone home-screen app and the friends' download page to GitHub Pages
#            (needs Settings -> Pages -> Source: GitHub Actions; skipped quietly until that is on)
name: Build APK

on:
  push:
    branches: [main]
    paths: [android/VERSION, .github/workflows/build-apk.yml, web/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 secret is missing"; exit 1; fi
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/hundred-days-hard.jks

      - name: Build
        run: ANDROID_SDK="$RUNNER_TEMP/android-sdk" android/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(sed -n 's/^name=//p' android/VERSION)
          # Release notes: this version's section of CHANGELOG.md. A heading like "## v0.9 · Short description"
          # also names the release, and the app's update banner shows that description.
          HEAD=$(grep -m1 -E "^## v${NAME//./\\.}( |$)" CHANGELOG.md || true)
          ABOUT=$(printf '%s' "$HEAD" | sed -E 's/^## v[0-9.]+[[:space:]]*//; s/^(·|—|–|:|-)[[:space:]]*//')
          TITLE="100 Days Hard v$NAME"
          [ -n "$ABOUT" ] && TITLE="v$NAME · $ABOUT"
          awk -v v="## v$NAME" 'index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") {on=1; next} /^## v/{on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "100 Days Hard v$NAME" > notes.md
          {
            echo
            echo "**Install or update**"
            echo '- Android: download `100-days-hard.apk` below, open it, and tap Install (or Update). Your data stays.'
            echo "- iPhone: open https://xxytham.github.io/hundred-days-hard/get/ in Safari and follow the steps."
          } >> notes.md
          # Same file under a fixed name, so .../releases/latest/download/100-days-hard.apk always gets the newest
          cp "android/100-days-hard-v$NAME.apk" android/100-days-hard.apk
          if gh release view "v$NAME" >/dev/null 2>&1; then
            gh release upload "v$NAME" "android/100-days-hard-v$NAME.apk" android/100-days-hard.apk --clobber
          else
            gh release create "v$NAME" "android/100-days-hard-v$NAME.apk" android/100-days-hard.apk --title "$TITLE" --notes-file notes.md
          fi

  web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build web app
        run: web/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deploy
        uses: actions/deploy-pages@v4
