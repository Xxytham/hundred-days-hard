<title>100 Days Hard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14181D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Header with a weight-plate day counter in the corner,
   stacked sections per tab, fixed bottom tab bar. Colors borrow from bumper plates
   (25 kg red, 20 kg blue, 15 kg yellow, 10 kg green). */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --sunk: #E2E6EB;
  --ink: #14181D;
  --muted: #5B6570;
  --line: #D2D8DF;
  --red: #CF2539;
  --blue: #1D5BB8;
  --yellow: #E1A006;
  --green: #2A8653;
  --on-color: #FFFFFF;
  --backdrop: rgba(20, 24, 29, 0.45);
  --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1215; --surface: #191E24; --sunk: #232A31; --ink: #E8ECF0; --muted: #96A0AB;
    --line: #2B333C; --red: #FF5263; --blue: #5E9CFF; --yellow: #FFC23A; --green: #4CC489;
    --on-color: #0F1215; --backdrop: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1215; --surface: #191E24; --sunk: #232A31; --ink: #E8ECF0; --muted: #96A0AB;
  --line: #2B333C; --red: #FF5263; --blue: #5E9CFF; --yellow: #FFC23A; --green: #4CC489;
  --on-color: #0F1215; --backdrop: rgba(0, 0, 0, 0.6); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
#main { width: 100%; min-width: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top-text { min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; margin: 2px 0 0; letter-spacing: 0.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; margin: 0; letter-spacing: 0.02em; text-transform: uppercase; }
/* Day counter: a gauge with a gap at the bottom where the settings gear sits */
.plate { flex: none; width: 64px; height: 64px; border: 0; padding: 0; background: none; border-radius: 50%; }
.gauge { width: 100%; height: 100%; display: block; overflow: visible; }
.g-track, .g-fill { fill: none; stroke-width: 4; stroke-linecap: round; }
.g-track { stroke: var(--sunk); }
.g-fill { stroke: var(--red); }
.g-day { font-family: var(--font-display); font-weight: 800; font-size: 22px; fill: var(--ink); }
.g-of { font-family: var(--font-body); font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; fill: var(--muted); }
.g-gear { fill: var(--muted); transition: fill 0.15s ease; }
.plate:hover .g-gear, .plate:focus-visible .g-gear { fill: var(--ink); }
.setup-hero .plate { width: 96px; height: 96px; }

.coach { font-size: 14px; color: var(--muted); margin: 0; }
.coach strong { color: var(--ink); font-weight: 600; }

/* Day switcher */
.daybar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daybar .label { font-weight: 600; font-size: 14px; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; font-size: 18px; line-height: 1;
}
.iconbtn:disabled { opacity: 0.35; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 600; font-size: 14px; padding: 6px 4px; }

/* Panels */
.panel { background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel-head .meta { font-size: 13px; color: var(--muted); }

.bar { height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; background: var(--blue); transition: width 0.3s ease; }
.bar > span.over { background: var(--red); }
.bar > span.met { background: var(--green); }
.bar.cal { position: relative; }
.bar .band { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); opacity: 0.55; }

/* Push / Pull / Legs */
.ppl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ppl button {
  border: 0; border-radius: 12px; background: var(--ink); color: var(--bg);
  padding: 14px 6px 12px; display: grid; gap: 2px; justify-items: center;
}
.ppl b { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.ppl small { font-size: 12px; opacity: 0.75; font-weight: 600; }
.ppl button:active, .sbtn:active { transform: scale(0.97); }
.w-status { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.w-status.saved { color: var(--green); }
.w-status.draft { color: var(--yellow); }

/* Workout sheet */
.sheet.tall { max-height: 94vh; }
.ex { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ex-name { font-weight: 700; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.ex-tools { display: flex; gap: 4px; flex: none; }
.ex-tools .iconbtn { width: 36px; height: 36px; font-size: 15px; }
.stepper { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 6px; }
.stepper-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.sbtn { height: 44px; border-radius: 10px; border: 0; background: var(--sunk); font-size: 22px; font-weight: 700; line-height: 1; }
.sval-wrap { display: flex; align-items: baseline; justify-content: center; gap: 4px; min-width: 0; }
.sval {
  width: 100%; min-width: 0; text-align: center; border: 0; background: none; padding: 4px 0;
  font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1;
}
.sval-wrap .u { font-size: 13px; color: var(--muted); font-weight: 600; }
.sval-wrap:has(.u) .sval { width: 5ch; text-align: right; }
.ex-sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.seg.sm button { padding: 4px 10px; font-size: 13px; }
.sheet-foot { display: grid; gap: 8px; position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding-block: 10px 6px; }

.three { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
.three label { min-width: 0; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.form label > .seg { justify-self: start; }
.suffix { position: relative; display: block; }
.suffix .field { padding-right: 40px; }
.suffix .u {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-size: 12px; font-weight: 700; color: var(--ink); background: var(--sunk); padding: 3px 7px; border-radius: 6px; pointer-events: none;
}

/* Strength tickers */
.tickers { display: grid; }
.tick {
  display: grid; grid-template-columns: minmax(0, 1fr) 56px auto 64px; align-items: center; gap: 10px;
  width: 100%; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left;
}
.tickers > :first-child { border-top: 0; }
.tick-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.tick-name small, .tick-val small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.tick-val { text-align: right; font-weight: 700; white-space: nowrap; }
.chg { justify-self: end; font-size: 12px; font-weight: 700; padding: 4px 6px; border-radius: 6px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chg.up { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.chg.down { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.spark { width: 56px; height: 22px; display: block; }
.spark polyline { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.spark.up polyline { stroke: var(--green); }
.spark.down polyline { stroke: var(--red); }
.tick-detail { display: grid; gap: 10px; padding-bottom: 12px; }
.chart .slabel { fill: var(--ink); font-weight: 700; font-size: 10px; }
.chart .sreps { fill: var(--muted); font-size: 9px; }
.chart .sline { fill: none; stroke: var(--blue); stroke-width: 2; }
.chart .sdot { fill: var(--surface); stroke: var(--blue); stroke-width: 2; }
.sessions { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.sessions li { display: flex; justify-content: space-between; gap: 8px; }
.sessions .r { color: var(--muted); }
@media (max-width: 360px) { .tick { grid-template-columns: minmax(0, 1fr) auto 60px; } .tick .spark { display: none; } }

/* Streak strip */
.streak { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.streak-num { display: flex; align-items: baseline; gap: 6px; }
.streak-num b { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 0.9; color: var(--red); }
.streak-num span { font-family: var(--font-display); font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.week { display: flex; gap: 6px; }
.week span { display: grid; justify-items: center; gap: 3px; font-size: 10px; font-weight: 700; color: var(--muted); }
.week i { width: 18px; height: 18px; border-radius: 5px; background: var(--sunk); display: block; }
.week i.full { background: var(--red); }
.week i.partial { background: color-mix(in srgb, var(--blue) 55%, var(--sunk)); }
.week i.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--ink); }
.streak-note { margin: -6px 0 0; font-size: 13px; color: var(--muted); }

/* Backup status dot by the date */
.eyebrow { display: flex; align-items: center; gap: 8px; }
.bk-dot { width: 22px; height: 22px; margin: -6px 0; padding: 0; border: 0; background: none; display: grid; place-items: center; flex: none; }
.bk-dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.bk-dot.ok::before { background: var(--green); }
.bk-dot.warn::before { background: var(--yellow); }
.bk-dot.bad::before { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent); }

.inline-num {
  font: inherit; color: var(--red); background: var(--surface); border: 0; border-bottom: 4px solid var(--red); border-radius: 10px 10px 4px 4px;
  width: 3.4ch; padding: 0 0.12em; text-align: center; box-shadow: 0 2px 0 var(--line); margin: 0 0.06em;
}
#su-day.inline-num { width: 2.6ch; }
.inline-num:focus { outline: 3px solid var(--blue); outline-offset: 2px; }
.last-day { display: grid; gap: 2px; padding-top: 8px; }
.last-day b { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.05; }
.need { color: var(--red); font-weight: 600; }
.suggest { display: grid; gap: 4px; background: var(--surface); border-radius: 12px; padding: 14px; box-shadow: inset 0 0 0 2px var(--green); }
.suggest b { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1.05; }

/* Tasks with live numbers */
.habit-text { display: grid; gap: 1px; min-width: 0; }
.habit-sub { font-size: 12px; font-weight: 600; color: var(--muted); }
.habit.done .habit-sub { color: var(--green); }
.auto-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); vertical-align: 1px; }
.pick button[aria-pressed="true"] .auto-tag { background: color-mix(in srgb, var(--bg) 22%, transparent); color: var(--bg); }
.chart .b.met { fill: var(--green); }
.chart .range { fill: var(--green); opacity: 0.14; }

/* End of challenge */
.finish { background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 18px 16px; display: grid; gap: 12px; }
.finish .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.finish h2 { font-size: 34px; color: var(--bg); }
.finish-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 0; }
.finish-facts dt { font-size: 12px; color: color-mix(in srgb, var(--bg) 70%, transparent); }
.finish-facts dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.finish .btn { background: var(--bg); color: var(--ink); }
.finish .btn.secondary { background: transparent; color: var(--bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bg) 40%, transparent); }

/* Update banner */
.update { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 12px 14px; }
.update .btn { background: var(--bg); color: var(--ink); padding: 8px 14px; }

/* Share */
.share-qr { width: 168px; height: 168px; background: #FFFFFF; border-radius: 12px; padding: 10px; display: grid; place-items: center; }
.share-qr svg { width: 100%; height: 100%; display: block; }
.share-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.share-link { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; user-select: all; min-width: 0; }

/* First-time setup */
body.setup .nav, body.setup .top { display: none; }
.setup-wrap { display: grid; gap: 18px; padding-top: 8px; }
.setup-progress { display: flex; gap: 6px; }
.setup-progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--sunk); }
.setup-progress i.on { background: var(--red); }
.setup-hero { display: grid; gap: 14px; justify-items: start; padding-top: 24px; }
.setup-hero .plate { pointer-events: none; }
.setup-title { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.1; margin: 0; text-wrap: balance; }
.setup-lead { font-size: 16px; color: var(--muted); margin: 0; max-width: 34ch; }
.setup-actions { display: grid; gap: 8px; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
.pick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.big-field { font-family: var(--font-display); font-weight: 800; font-size: 40px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); width: 140px; }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 48px; }
.row:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--muted); }
.row-val { font-weight: 700; white-space: nowrap; }
.del { border: 0; background: none; color: var(--muted); font-size: 20px; width: 36px; height: 36px; border-radius: 50%; }
.del:hover { background: var(--sunk); }
.empty { font-size: 14px; color: var(--muted); margin: 0; }

/* Daily totals */
.totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.totals label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.big-input {
  font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1;
  padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; width: 100%; min-width: 0;
}
.big-input::placeholder { color: var(--line); }
#meters { display: grid; gap: 12px; }
.meter { display: grid; gap: 6px; }
.meter-label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.meter-label b { color: var(--ink); }
.bar.protein > span { background: var(--green); }
.source { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.source .linkbtn { padding-left: 0; }
.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; }
.btn.secondary { background: var(--sunk); color: var(--ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.steps b, .sync b { color: var(--ink); }

/* Goals ladders: hardest step at the top, like climbing */
.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ladder li { display: flex; align-items: center; gap: 4px; }
.step {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 44px;
  padding: 8px 10px; border: 0; border-radius: 10px; background: none; text-align: left;
}
.mark {
  flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line);
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--on-color);
}
.step-text { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.step-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.step.done .mark { background: var(--green); border-color: var(--green); }
.step.done .step-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.step.next { background: var(--bg); box-shadow: inset 0 0 0 2px var(--red); }
.step.next .mark { border-color: var(--red); }
.pill { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--red); white-space: nowrap; }
.focus { margin: 0; font-size: 13px; color: var(--muted); }
.focus b { color: var(--ink); }
.goal-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn.danger { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1px var(--line); }

/* Goals tab: summary, groups, collapsible rows */
.goals-sum { background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
.goals-sum-top { display: flex; align-items: baseline; gap: 8px; }
.goals-sum-top b { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 0.9; color: var(--green); }
.goals-sum-top span { font-weight: 600; color: var(--muted); }
.goals-sum .hint { margin: 0; }
.goal-list { display: grid; }
.goal { border-top: 1px solid var(--line); }
.goal:first-child { border-top: 0; }
.goal-row {
  width: 100%; border: 0; background: none; text-align: left; padding: 12px 0;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center;
}
.goal-main { display: grid; gap: 1px; min-width: 0; }
.goal-name { font-weight: 700; overflow-wrap: anywhere; }
.goal-next { font-size: 13px; color: var(--muted); }
.goal-next b { color: var(--ink); }
.goal-count { font-weight: 700; display: flex; align-items: center; gap: 6px; color: var(--muted); }
.chev { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; transition: transform 0.15s ease; }
.goal.open .chev { transform: rotate(180deg); }
.goal-bar { grid-column: 1 / -1; display: block; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.goal-bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.goal-bar.big { height: 10px; border-radius: 5px; }
.goal-open { display: grid; gap: 12px; padding-bottom: 14px; }
@media (prefers-reduced-motion: reduce) { .chev, .g-gear { transition: none; } }

/* Habits */
.habit { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 52px; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.habit:first-child { border-top: 0; }
.check {
  flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line);
  display: grid; place-items: center; color: var(--on-color); font-size: 16px; font-weight: 800;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.habit.done .check { background: var(--green); border-color: var(--green); }

<script>
(function () {
  "use strict";

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
  const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  const todayISO = () => iso(new Date());
  const fmtDate = (s, opts) => parseISO(s).toLocaleDateString(undefined, opts || { weekday: "short", month: "short", day: "numeric" });
  const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const fmtWhen = (ms) => {
    const d = iso(new Date(ms));
    return d === todayISO() ? "today at " + fmtTime(ms) : d === addDays(todayISO(), -1) ? "yesterday at " + fmtTime(ms) : fmtDate(d) + " at " + fmtTime(ms);
  };
  const fmt = (n) => Math.round(n).toLocaleString();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const KG_TO_LB = 2.20462;

  // ---------- state ----------
  const LOCAL_KEY = "hundred-days-hard.v1";
  const DEFAULT_HABITS = [
    { id: "workout", name: "Workout" },
    { id: "protein", name: "Hit protein goal" },
    { id: "water", name: "Drink 3 L of water" },
    { id: "steps", name: "10,000 steps" },
    { id: "sleep", name: "Get 9 hours of sleep" },
  ];
  // Shipped defaults are generic: friends install this same app, so nothing personal lives in code.
  const TASK_PRESETS = [
    ...DEFAULT_HABITS,
    { id: "read", name: "Read 10 pages" },
    { id: "photo", name: "Progress photo" },
    { id: "diet", name: "Stick to the diet" },
    { id: "noalcohol", name: "No alcohol" },
    { id: "stretch", name: "Stretch 10 minutes" },
  ];
  const defaultSettings = () => ({
    startDate: iso(new Date()),
    calorieGoal: 2500,
    proteinGoal: 150,
    totalDays: 100,
    stepsTarget: 10000,
    sleepTarget: 9,
    unit: "lb",
    habits: DEFAULT_HABITS.map((h) => ({ ...h })),
    updatedAt: 0,
  });
  // Ladders run easiest to hardest; the page shows the hardest step at the top.
  const ladder = (id, name, steps, focus) => ({
    id, name, focus: focus || "",
    steps: steps.map((st, i) => ({ id: "s" + i, text: typeof st === "string" ? st : st[0], done: Array.isArray(st), doneDay: null })),
  });
  const defaultGoals = () => ({ updatedAt: 0, list: [] });
  const GOAL_TEMPLATES = [
    ["Push-ups in one go", ["10", "20", "30", "40", "50"]],
    ["Pull-ups", ["1", "3", "5", "8", "10"]],
    ["Dips in one go", ["5", "10", "15", "20"]],
    ["Dead hang", ["0:30", "0:45", "1:00", "1:30"]],
    ["Plank", ["0:30", "1:00", "2:00", "3:00"]],
    ["Running", ["0.25 mi", "0.5 mi", "1 mi", "2 mi", "5K"]],
  ];
  const blankDay = () => ({ kcal: null, protein: null, kcalSrc: null, habits: {}, workout: null, weight: null, health: null, updatedAt: 0 });
  function normalizeDay(d) {
    const day = { ...blankDay(), ...d };
    // Older versions logged individual meals; fold them into the day's totals.
    if (day.kcal == null && Array.isArray(d.meals) && d.meals.length) {
      day.kcal = d.meals.reduce((a, m) => a + (+m.kcal || 0), 0);
      day.protein = d.meals.reduce((a, m) => a + (+m.protein || 0), 0);
    }
    delete day.meals;
    // Single exercise lists from v0.1/v0.2 become a saved workout.
    if (!day.workout && Array.isArray(d.exercises) && d.exercises.length) {
      day.workout = { type: "other", saved: true, savedAt: d.updatedAt || null,
        exercises: d.exercises.map((e) => ({ id: e.id || uid(), name: e.name, weight: +e.weight || 0, reps: +e.reps || 0, sets: +e.sets || 1, unit: "lb" })) };
    }
    delete day.exercises;
    return day;
  }

  const state = { settings: defaultSettings(), days: {}, goals: defaultGoals() };
  let editingGoal = null, confirmDelete = null;
  let view = "today";
  let viewDate = todayISO();

  try {
    const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null");
    if (saved && saved.settings) {
      state.settings = { ...defaultSettings(), ...saved.settings };
      Object.keys(saved.days || {}).forEach((k) => (state.days[k] = normalizeDay(saved.days[k])));
      if (saved.goals && Array.isArray(saved.goals.list)) state.goals = saved.goals;
      if (state.settings.setupDone === undefined) state.settings.setupDone = true; // already using the app before setup existed
    }
  } catch (e) { /* storage unavailable */ }

  const S = () => state.settings;
  const dayNum = (s) => diffDays(S().startDate, s) + 1;
  const peekDay = (d) => state.days[d] || blankDay();
  const getDay = (d) => (state.days[d] = state.days[d] || blankDay());
  // Fat loss: land within 100 kcal either side of the goal. Muscle: reach at least the goal.
  const calAim = () => (S().calorieAim === "build" ? "build" : "lose");
  const calRange = () => [S().calorieGoal - 100, S().calorieGoal + 100];
  function calStatus(k) {
    const g = S().calorieGoal;
    if (calAim() === "build") return k >= g ? { state: "met", short: "Goal hit", left: 0 } : { state: "under", short: fmt(g - k) + " kcal to go", left: g - k };
    const [lo, hi] = calRange();
    if (k > hi) return { state: "over", short: fmt(k - hi) + " kcal over your range", left: 0 };
    if (k >= lo) return { state: "met", short: "In your range", left: 0 };
    return { state: "under", short: fmt(lo - k) + " kcal until your range", left: lo - k };
  }
  const calGoalText = () => (calAim() === "lose" ? fmt(calRange()[0]) + "–" + fmt(calRange()[1]) : "at least " + fmt(S().calorieGoal));
  const TOTAL = () => Math.max(1, Math.round(+S().totalDays) || 100);
  // A task counts from the day it was added, so adding one never breaks past days or a streak.
  const tasksFor = (date) => S().habits.filter((h) => !h.addedOn || h.addedOn <= date);
  const doneOn = (date) => { const day = state.days[date]; return day ? tasksFor(date).filter((h) => day.habits && day.habits[h.id]).length : 0; };
  const fracOn = (date) => { const n = tasksFor(date).length; return n ? doneOn(date) / n : 0; };
  const fullOn = (date) => { const n = tasksFor(date).length; return n > 0 && doneOn(date) === n; };
  // Tasks Samsung Health can tick by itself. Names follow the targets in Settings.
  const fmtSleep = (min) => Math.floor(min / 60) + " h " + String(Math.round(min % 60)).padStart(2, "0") + " m";
  // Workouts today. With a target of 1, either a Push/Pull/Legs saved here or a cardio session counts.
  // With a target of N (2 or more) it takes one Push/Pull/Legs saved here plus N-1 cardio sessions from
  // Samsung Health. Lifting sessions logged in Samsung Health ("Other workout" and the like) never count on
  // their own; their minutes are shown next to the workout saved here.
  const workoutsTarget = () => Math.max(1, Math.round(+S().workoutsTarget) || 1);
  function workoutParts(day) {
    const ses = ((day && day.health && day.health.sessions) || []).filter((x) => x.min >= 10);
    const strength = ses.filter((x) => x.strength), cardio = ses.filter((x) => !x.strength && walkCounts(x));
    const app = day && day.workout && day.workout.saved ? 1 : 0, t = workoutsTarget();
    const count = t === 1 ? Math.min(1, app + cardio.length) : app + Math.min(cardio.length, t - 1);
    return { count, ses, strength, cardio, app };
  }
  // Walks count as cardio only from 1 mile. Without a recorded distance, about 2,000 steps make a mile.
  const walkMiles = (x) => (x.miles != null ? x.miles : x.steps ? x.steps / 2000 : null);
  const walkCounts = (x) => !x.walk || (walkMiles(x) || 0) >= 1;
  function workoutNames(day) {
    const p = workoutParts(day), names = [], t = workoutsTarget();
    if (p.app) names.push(typeName(day.workout.type) + " day" + (p.strength[0] ? " " + p.strength[0].min + " min" : ""));
    p.cardio.forEach((x) => names.push(x.name + " " + (x.walk ? (Math.round(walkMiles(x) * 10) / 10) + " mi" : x.min + " min")));
    if (t > 1 && p.count < t) {
      const cardioLeft = Math.max(0, t - 1 - p.cardio.length);
      const need = (p.app ? [] : ["Push, Pull or Legs"]).concat(cardioLeft ? [cardioLeft > 1 ? cardioLeft + " cardio" : "cardio"] : []);
      if (need.length) names.push("still need " + need.join(" + "));
    }
    return names;
  }
  const workoutRule = () => {
    const t = workoutsTarget();
    return t === 1 ? "Ticks itself when you save Push, Pull or Legs here, or Samsung Health records cardio."
      : t + " workouts means one Push, Pull or Legs saved here plus " + (t - 1) + " cardio session" + (t > 2 ? "s" : "") + " from Samsung Health (runs, rides, swims, sports, hikes, or walks of a mile or more).";
  };
  const METRICS = {
    steps: { label: (st) => (+st.stepsTarget).toLocaleString() + " steps", value: (d) => (d.health ? d.health.steps : null), target: (st) => st.stepsTarget, show: (v, st) => fmt(v) + " / " + fmt(st.stepsTarget) },
    sleep: { label: (st) => "Get " + st.sleepTarget + " hours of sleep", value: (d) => (d.health && d.health.sleepMin != null ? d.health.sleepMin / 60 : null), target: (st) => st.sleepTarget, show: (v) => fmtSleep(v * 60) + " last night" },
    workout: {
      label: () => (workoutsTarget() > 1 ? workoutsTarget() + " workouts" : "Workout"),
      value: (d) => workoutParts(d).count, target: () => workoutsTarget(),
      show: (v, st, d) => { const n = workoutNames(d), t = workoutsTarget(); return (t > 1 ? v + " / " + t + (n.length ? " · " : "") : "") + n.join(", "); },
    },
  };
  const taskName = (h) => (METRICS[h.id] ? METRICS[h.id].label(S()) : h.name);
  const AUTO_IDS = ["steps", "sleep"];
  const isLogged = (day) => !!day && (day.kcal != null || day.protein != null || !!day.workout || !!day.weight || Object.values(day.habits || {}).some(Boolean));
  const hasAnyData = () => Object.values(state.days).some(isLogged) || state.goals.updatedAt > 0;
  const docBody = (id) => (id === "settings" ? state.settings : id === "goals" ? state.goals : state.days[id]);

  // ---------- where data lives ----------
  // "claude": opened from the Claude link, saved to the account.
  // "apk": the installed Android app, saved on the phone with an automatic backup file.
  // "browser": anywhere else, saved in this browser only.
  const bridge = window.AndroidBridge || null;
  let mode = bridge ? "apk" : "browser";
  let col = null;
  let sync = "local"; // local | ok | err
  let downloads = null;
  // Opened from the public web address (iPhone home-screen app), not inside Claude or the Android app.
  const isWebApp = !bridge && !(window.claude && typeof window.claude.use === "function");
  let setupReady = !!bridge || isWebApp;
  if (isWebApp && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const timers = {}, pending = {}, inflight = {};

  function persistLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  function save(id, opts) {
    const body = docBody(id);
    if (body && !(opts && opts.keepStamp)) body.updatedAt = Date.now();
    persistLocal();
    scheduleFileBackup();
    if (!col) return;
    pending[id] = true;
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => flush(id), 500);
  }
  async function flush(id) {
    if (inflight[id] || !pending[id]) return;
    pending[id] = false;
    inflight[id] = true;
    const body = docBody(id);
    try {
      await col.doc(id).set(JSON.parse(JSON.stringify(body || blankDay())));
      setSync("ok");
    } catch (e) {
      if (e && e.code === "unavailable") { pending[id] = true; setTimeout(() => { inflight[id] = false; flush(id); }, 1500 + Math.random() * 1000); return; }
      setSync("err");
    }
    inflight[id] = false;
    if (pending[id]) flush(id);
  }
  function setSync(s) { if (sync !== s) { sync = s; if (view === "settings") render(); } }

  async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user, dl] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("downloads")]);
    downloads = dl;
    if (downloads && view === "settings") render();
    const id = db && user ? await user.id() : null;
    if (!id) { setupReady = true; render(); return; }
    col = db.collection("data/users/" + id);
    mode = "claude";
    let first = true;
    col.onSnapshot((snap) => {
      let gotSettings = false, gotGoals = false;
      snap.docs.forEach((doc) => {
        const busy = pending[doc.id] || inflight[doc.id];
        if (doc.id === "settings") {
          gotSettings = true;
          if (!busy) { state.settings = { ...defaultSettings(), ...doc.data() }; if (state.settings.setupDone === undefined) state.settings.setupDone = true; }
        }
        else if (doc.id === "goals") { gotGoals = true; const g = doc.data(); if (!busy && g && Array.isArray(g.list)) state.goals = g; }
        else if (/^\d{4}-\d\d-\d\d$/.test(doc.id) && !busy) state.days[doc.id] = normalizeDay(doc.data());
      });
      if (first) {
        first = false;
        // Move anything saved in this browser before the account store existed.
        if (!gotSettings) save("settings", { keepStamp: true });
        if (!gotGoals) save("goals", { keepStamp: true });
        const remote = new Set(snap.docs.map((d) => d.id));
        Object.keys(state.days).forEach((d) => { if (!remote.has(d) && isLogged(state.days[d])) save(d, { keepStamp: true }); });
      }
      sync = "ok";
      setupReady = true;
      persistLocal();
      render();
    }, () => { setupReady = true; setSync("err"); render(); });
  }

  // ---------- backup & restore ----------
  const exportData = () => JSON.stringify({ app: "100-days-hard", format: 1, exportedAt: new Date().toISOString(), settings: state.settings, goals: state.goals, days: state.days });
  const backupName = () => "100-days-hard-backup-" + todayISO() + ".json";

  let backupTimer = null, lastFileBackup = 0;
  function scheduleFileBackup() {
    if (!bridge || !hasAnyData()) return; // never overwrite a good backup with an empty fresh install
    clearTimeout(backupTimer);
    backupTimer = setTimeout(() => {
      try { bridge.saveBackup(exportData()); lastFileBackup = Date.now(); } catch (e) { /* ignore */ }
    }, 1500);
  }
  function apkBackupInfo() {
    try { return JSON.parse(bridge.backupInfo() || "{}"); } catch (e) { return {}; }
  }

  function restoreFrom(text) {
    let b;
    try { b = JSON.parse(text); } catch (e) { toast("That file isn't a 100 Days Hard backup"); return; }
    if (!b || b.app !== "100-days-hard" || typeof b.days !== "object") { toast("That file isn't a 100 Days Hard backup"); return; }
    let restored = 0;
    if (b.settings && (!S().updatedAt || (b.settings.updatedAt || 0) > S().updatedAt)) {
      state.settings = { ...defaultSettings(), ...b.settings };
      save("settings", { keepStamp: true });
    }
    if (b.goals && Array.isArray(b.goals.list) && (b.goals.updatedAt || 0) > (state.goals.updatedAt || 0)) {
      state.goals = b.goals;
      save("goals", { keepStamp: true });
      restored++;
    }
    // Merge: keep whichever copy of each day was changed most recently.
    Object.keys(b.days).forEach((d) => {

  // ---------- end of the challenge ----------
  function roundStats() {
    const N = TOTAL(), start = S().startDate, end = addDays(start, N - 1);
    let perfect = 0, workouts = 0, best = 0, run = 0;
    for (let i = 0; i < N; i++) {
      const d = addDays(start, i);
      if (fullOn(d)) { perfect++; run++; best = Math.max(best, run); } else run = 0;
      const w = state.days[d] && state.days[d].workout;
      if (w && w.saved) workouts++;
    }
    const ws = Object.keys(state.days).filter((d) => d >= start && d <= end && state.days[d].weight).sort();
    const wChange = ws.length > 1 ? state.days[ws[ws.length - 1]].weight - state.days[ws[0]].weight : null;
    let top = null;
    strengthData().forEach((m) => {
      const pts = m.pts.filter((p) => p.date >= start && p.date <= end);
      if (pts.length < 2 || !(pts[0].score > 0)) return;
      const g = ((pts[pts.length - 1].score - pts[0].score) / pts[0].score) * 100;
      if (!top || g > top.g) top = { name: m.name, g };
    });
    return { N, perfect, workouts, best, wChange, top };
  }

    const facts = [
      ["Perfect days", st.perfect + " / " + N],
      ["Best streak", st.best + (st.best === 1 ? " day" : " days")],

  }
  function openNewRound() {
    openSheet('<h2>Start another round</h2><p class="hint">Today becomes day 1. Your history, tasks, goals and workouts all stay.</p>' +
      '<div class="pick" id="round-len">' + [30, 75, 100].map((v) => '<button data-action="round-len" data-v="' + v + '" aria-pressed="' + (TOTAL() === v) + '">' + v + " days</button>").join("") + "</div>" +
      '<label class="form"><span class="hint">Or any number of days</span><input class="field num" id="round-custom" type="number" inputmode="numeric" min="1" max="1000" value="' + TOTAL() + '"></label>' +
      '<button class="btn wide" data-action="round-start">Start day 1</button>', null);
  }

  function lastWeightBefore(d) {
    const keys = Object.keys(state.days).filter((k) => k < d && state.days[k].weight).sort();
    const k = keys[keys.length - 1];
    return k ? { date: k, weight: state.days[k].weight } : null;
  }

  function renderProgress() {
    const t = todayISO(), tn = dayNum(t), N = TOTAL();
    let complete = 0, kcalSum = 0, kcalDays = 0, streak = 0;
    const cells = [];
    for (let i = 1; i <= N; i++) {
      const d = addDays(S().startDate, i - 1), day = state.days[d];
      const f = fracOn(d);
      if (f === 1) complete++;
      if (day && day.kcal != null) { kcalSum += day.kcal; kcalDays++; }
      let cls = "cell";
      if (i > tn) cls += " future";
      else if (f === 1) cls += " full";
      else if (f > 0) cls += " partial";
      if (i === tn) cls += " today";
      cells.push('<button class="' + cls + ' num" style="--f:' + f.toFixed(2) + '" ' + (i > tn ? 'disabled aria-label="Day ' + i + ', upcoming"' : 'data-action="open-day" data-date="' + d + '" aria-label="Day ' + i + ", " + Math.round(f * 100) + '% of tasks"') + ">" + i + "</button>");
    }
    const si = streakInfo();
    if (si) streak = si.cur;
    return (
      '<div class="stats">' +
        '<div class="stat"><b class="num">' + complete + "</b><span>Perfect days</span></div>" +
        '<div class="stat"><b class="num">' + streak + "</b><span>Day streak</span></div>" +
        '<div class="stat"><b class="num">' + (kcalDays ? fmt(kcalSum / kcalDays) : "–") + "</b><span>Avg kcal / day</span></div>" +
      "</div>" +
      '<section class="panel" aria-labelledby="h-g"><div class="panel-head"><h2 id="h-g">The ' + N + '</h2><span class="meta num">' + (tn >= N ? "Finished" : (N - tn) + " days to go") + "</span></div>" +
        '<div class="grid100">' + cells.join("") + "</div>" +
        '<div class="legend"><span><i style="background:var(--red)"></i>All tasks</span><span><i style="background:var(--blue)"></i>Some tasks</span><span><i style="background:var(--sunk)"></i>Nothing checked</span></div>' +
        '<p class="empty">Tap a day to view or edit it.</p>' +
      "</section>" +
      trendsPanel(t) +
      '<section class="panel" aria-labelledby="h-wt"><div class="panel-head"><h2 id="h-wt">Body weight</h2><span class="meta">' + S().unit + "</span></div>" + weightChart() + "</section>" +
      renderStrength()
    );
  }

  let strType = "push", strSel = null;
  function strengthData() {
    const map = {};
    savedSessions().forEach((d) => {
      const w = state.days[d].workout;
      w.exercises.forEach((e, i) => {
        const k = exKey(e.name);
        const m = map[k] || (map[k] = { k, name: e.name, type: w.type, order: i, pts: [] });
        m.name = e.name; m.type = w.type; m.order = i;
        const wt = Math.round(toUnit(+e.weight || 0, e.unit || S().unit, S().unit) * 10) / 10;
        m.pts.push({ date: d, n: dayNum(d), w: wt, r: +e.reps || 0, s: +e.sets || 0, rawW: +e.weight || 0, rawU: e.unit || S().unit, score: e1rm(wt, +e.reps || 0) });
      });
    });
    return Object.values(map);
  }
  const pctChange = (pts) => {
    if (pts.length < 2) return null;
    const a = pts[pts.length - 2].score, b = pts[pts.length - 1].score;
    return a > 0 ? ((b - a) / a) * 100 : null;
  };
  const chgClass = (c) => (c == null || Math.abs(c) < 0.05 ? "" : c > 0 ? "up" : "down");
  const chgText = (c) => (c == null ? "New" : Math.abs(c) < 0.05 ? "0%" : (c > 0 ? "▲ " : "▼ ") + Math.abs(c).toFixed(1) + "%");

  function sparkline(pts, cls) {
    const ys = pts.slice(-8).map((p) => p.score);
    if (ys.length < 2) return '<svg class="spark" viewBox="0 0 56 22" aria-hidden="true"></svg>';
    const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
    const pt = ys.map((v, i) => ((i / (ys.length - 1)) * 54 + 1).toFixed(1) + "," + (20 - ((v - lo) / span) * 18).toFixed(1)).join(" ");
    return '<svg class="spark ' + cls + '" viewBox="0 0 56 22" aria-hidden="true"><polyline points="' + pt + '"/></svg>';
  }

  function strengthChart(m) {
    const pts = m.pts.slice(-10), unit = S().unit, bw = pts.every((p) => p.w === 0);
    const W = 340, H = 180, L = 36, R = 16, T = 30, B = 22, pw = W - L - R, ph = H - T - B;
    const ys = pts.map((p) => p.score);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = Math.max((hi - lo) * 0.15, hi * 0.04, 1);
    lo = Math.max(0, lo - pad); hi = hi + pad;
    const x = (i) => L + (pts.length === 1 ? pw / 2 : (i / (pts.length - 1)) * pw);
    const y = (v) => T + ph * (1 - (v - lo) / (hi - lo));
    const label = (v) => (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10);
    let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(m.name) + ' strength by session">';
    [lo, (lo + hi) / 2, hi].forEach((v) => { s += '<line class="gridl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="num" x="' + (L - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + label(v) + "</text>"; });
    if (pts.length > 1) s += '<polyline class="sline" points="' + pts.map((p, i) => x(i).toFixed(1) + "," + y(p.score).toFixed(1)).join(" ") + '"/>';
    pts.forEach((p, i) => {
      const cx = x(i).toFixed(1), cy = y(p.score);
      s += '<circle class="sdot" cx="' + cx + '" cy="' + cy.toFixed(1) + '" r="4"><title>Day ' + p.n + ": " + (p.w ? fmtW(p.w) + " " + unit + " × " : "") + p.r + " reps</title></circle>";
      if (pts.length <= 7 || i === 0 || i === pts.length - 1) {
        const anchor = i === 0 && pts.length > 1 ? "start" : i === pts.length - 1 && pts.length > 1 ? "end" : "middle";
        s += '<text class="slabel num" x="' + cx + '" y="' + (cy - 16).toFixed(1) + '" text-anchor="' + anchor + '">' + (bw ? p.r : fmtW(p.w)) + "</text>";
        s += '<text class="sreps num" x="' + cx + '" y="' + (cy - 7).toFixed(1) + '" text-anchor="' + anchor + '">' + (bw ? "reps" : "×" + p.r) + "</text>";
        s += '<text class="num" x="' + cx + '" y="' + (H - 6) + '" text-anchor="' + anchor + '">day ' + p.n + "</text>";
      }
    });
    s += "</svg>";
    const rows = m.pts.slice(-6).map((p, i, arr) => {
      const idx = m.pts.length - arr.length + i;
      const c = idx > 0 && m.pts[idx - 1].score > 0 ? ((p.score - m.pts[idx - 1].score) / m.pts[idx - 1].score) * 100 : null;
      return '<li><span>Day ' + p.n + " · " + (p.w ? fmtW(p.w) + " " + unit + " × " + p.r : p.r + " reps") + " · " + p.s + ' sets</span><span class="r num">' + (bw ? "" : "est. " + Math.round(p.score) + " ") + '<span class="chg ' + chgClass(c) + '">' + (c == null ? "First" : chgText(c)) + "</span></span></li>";
    }).reverse().join("");
    return '<div class="tick-detail">' + s +
      '<p class="hint">' + (bw ? "Line shows reps per set." : "Line shows estimated one-rep max, which combines weight and reps. More weight for fewer reps can still count as a small drop.") + "</p>" +
      '<ul class="sessions">' + rows + "</ul></div>";
  }

  function renderStrength() {
    const all = strengthData();
    const list = all.filter((m) => m.type === strType).sort((a, b) => a.order - b.order);
    const changes = list.map((m) => pctChange(m.pts)).filter((c) => c != null);
    const avg = changes.length ? changes.reduce((a, c) => a + c, 0) / changes.length : null;
    const unit = S().unit;
    const rows = list.map((m) => {
      const last = m.pts[m.pts.length - 1], c = pctChange(m.pts), cls = chgClass(c), open = strSel === m.k;
      return '<button class="tick" data-action="str-sel" data-k="' + esc(m.k) + '" aria-expanded="' + open + '">' +
        '<span class="tick-name">' + esc(m.name) + "<small>" + m.pts.length + " session" + (m.pts.length === 1 ? "" : "s") + "</small></span>" +
        sparkline(m.pts, cls) +
        '<span class="tick-val num">' + (last.w > 0 ? fmtW(last.rawW) + " " + last.rawU : last.r + " reps") + "<small>" + (last.w > 0 ? "× " + last.r + " · " : "") + last.s + " sets</small></span>" +
        '<span class="chg ' + cls + '">' + chgText(c) + "</span></button>" + (open ? strengthChart(m) : "");
    }).join("");
    const summary = avg == null ? "" : '<p class="hint">' + typeName(strType) + " strength is <b class=\"num\">" + (Math.abs(avg) < 0.05 ? "flat" : (avg > 0 ? "up " : "down ") + Math.abs(avg).toFixed(1) + "%") + "</b> since last " + typeName(strType).toLowerCase() + " day, across " + changes.length + " exercise" + (changes.length === 1 ? "" : "s") + ".</p>";
    return '<section class="panel" aria-labelledby="h-st"><div class="panel-head"><h2 id="h-st">Strength</h2>' +
      '<span class="seg sm" role="group" aria-label="Workout type">' + TYPES.map((t) => '<button data-action="str-type" data-type="' + t.id + '" aria-pressed="' + (strType === t.id) + '">' + t.name + "</button>").join("") + "</span></div>" +
      summary +
      (list.length ? '<div class="tickers">' + rows + "</div>" : '<p class="empty">Save a ' + typeName(strType).toLowerCase() + " workout on the Today tab and its exercises show up here, with whether each one is going up or down.</p>") +
    "</section>";
  }

  // One bar chart, several measures. A chip only appears once that measure has data.
  const TRENDS = {
    kcal: { name: "Calories", val: (d) => d.kcal, goal: (st) => st.calorieGoal, step: 500, fmtv: (v) => fmt(v), unit: "kcal", cal: true },
    sleep: { name: "Sleep", val: (d) => (d.health && d.health.sleepMin != null ? d.health.sleepMin / 60 : null), goal: (st) => st.sleepTarget, step: 2, fmtv: (v) => (Math.round(v * 10) / 10).toString(), unit: "h" },
    steps: { name: "Steps", val: (d) => (d.health ? d.health.steps : null), goal: (st) => st.stepsTarget, step: 2000, fmtv: (v) => fmt(v), unit: "steps" },
  };
  let trendKey = "kcal";
  function trendsPanel(t) {
    const dates = [];
    for (let i = 13; i >= 0; i--) dates.push(addDays(t, -i));
    const has = Object.keys(TRENDS).filter((k) => k === "kcal" || dates.some((d) => { const v = TRENDS[k].val(peekDay(d)); return v != null && v > 0; }));
    if (!has.includes(trendKey)) trendKey = "kcal";
    const chips = has.length > 1 ? '<span class="seg sm" role="group" aria-label="Measure">' + has.map((k) => '<button data-action="trend" data-k="' + k + '" aria-pressed="' + (k === trendKey) + '">' + TRENDS[k].name + "</button>").join("") + "</span>" : "";
    return '<section class="panel" aria-labelledby="h-c"><div class="panel-head"><h2 id="h-c">Last 14 days</h2>' + chips + "</div>" + barChart(trendKey, dates) + "</section>";
  }
  function barChart(key, dates) {
    const tr = TRENDS[key], goal = tr.goal(S());
    const W = 340, H = 160, L = 38, R = 6, T = 10, B = 22, pw = W - L - R, ph = H - T - B;
    const vals = dates.map((d) => { const v = tr.val(peekDay(d)); return v != null && v > 0 ? v : 0; });
    const max = Math.ceil(Math.max(goal * 1.25, ...vals) / tr.step) * tr.step || tr.step;
    const y = (v) => T + ph * (1 - v / max);
    const slot = pw / 14, bw = slot * 0.62;
    let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + tr.name + ' for the last 14 days against your goal of ' + tr.fmtv(goal) + " " + tr.unit + '">';
    [0, max / 2, max].forEach((v) => { s += '<line class="gridl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="num" x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + tr.fmtv(v) + "</text>"; });
    vals.forEach((v, i) => {
      const x = L + slot * i + (slot - bw) / 2;
      const cs = tr.cal ? calStatus(v).state : v >= goal ? "met" : "under";
      const cls = cs === "over" ? " over" : cs === "met" ? " met" : "";
      if (v > 0) s += '<rect class="b' + cls + '" x="' + x.toFixed(1) + '" y="' + y(v).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y(0) - y(v)).toFixed(1) + '" rx="2"><title>Day ' + dayNum(dates[i]) + ": " + tr.fmtv(v) + " " + tr.unit + "</title></rect>";
      if (i % 2 === 1 || i === 13) s += '<text class="num" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + dayNum(dates[i]) + "</text>";
    });
    if (tr.cal && calAim() === "lose") {
      const [lo, hi] = calRange();
      s += '<rect class="range" x="' + L + '" y="' + y(hi).toFixed(1) + '" width="' + pw + '" height="' + (y(lo) - y(hi)).toFixed(1) + '"/>';
      s += '<text x="' + (W - R) + '" y="' + (y(hi) - 4) + '" text-anchor="end">range ' + fmt(lo) + "–" + fmt(hi) + "</text></svg>";
    } else {
      s += '<line class="goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(goal) + '" y2="' + y(goal) + '"/>';
      s += '<text x="' + (W - R) + '" y="' + (y(goal) - 4) + '" text-anchor="end">' + (tr.cal ? "at least " : "goal ") + tr.fmtv(goal) + "</text></svg>";
    }
    const logged = vals.filter((v) => v > 0);
    if (!logged.length) s += '<p class="empty">Enter your daily totals on the Today tab and they\'ll build up here. Numbers under the bars are challenge days.</p>';
    else {
      const avg = logged.reduce((a, v) => a + v, 0) / logged.length;
      const hit = logged.filter((v) => (tr.cal ? calStatus(v).state === "met" : v >= goal)).length;
      s += '<p class="hint num">Average ' + (key === "sleep" ? fmtSleep(avg * 60) : tr.fmtv(avg) + " " + tr.unit) + " · " + (tr.cal && calAim() === "lose" ? "in range" : "goal met") + " on " + hit + " of " + logged.length + " days.</p>";
    }
    return s;
  }

  function weightChart() {
    const pts = Object.keys(state.days).filter((d) => state.days[d].weight).sort().map((d) => ({ n: dayNum(d), w: +state.days[d].weight }));
    if (pts.length < 2) return '<p class="empty">Enter your weight on at least two days to see the trend.' + (pts.length ? " One entry so far: " + pts[0].w + " " + S().unit + " on day " + pts[0].n + "." : "") + "</p>";
    const W = 340, H = 140, L = 38, R = 10, T = 12, B = 22, pw = W - L - R, ph = H - T - B;
    let lo = Math.min(...pts.map((p) => p.w)), hi = Math.max(...pts.map((p) => p.w));
    if (hi - lo < 2) { lo -= 1; hi += 1; }
    lo = Math.floor(lo); hi = Math.ceil(hi);
    const n0 = pts[0].n, n1 = pts[pts.length - 1].n;
    const x = (n) => L + (n1 === n0 ? pw / 2 : ((n - n0) / (n1 - n0)) * pw);
    const y = (w) => T + ph * (1 - (w - lo) / (hi - lo));
    const line = pts.map((p, i) => (i ? "L" : "M") + x(p.n).toFixed(1) + " " + y(p.w).toFixed(1)).join(" ");
    let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Body weight from day ' + n0 + " to day " + n1 + '">';
    [lo, (lo + hi) / 2, hi].forEach((v) => { s += '<line class="gridl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="num" x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v.toFixed(v % 1 ? 1 : 0) + "</text>"; });
    s += '<path class="warea" d="' + line + " L" + x(n1).toFixed(1) + " " + y(lo) + " L" + x(n0).toFixed(1) + " " + y(lo) + ' Z"/><path class="wline" d="' + line + '"/>';
    const last = pts[pts.length - 1];
    s += '<circle class="wdot" cx="' + x(last.n) + '" cy="' + y(last.w) + '" r="4"/>';
    s += '<text x="' + L + '" y="' + (H - 6) + '">day ' + n0 + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">day ' + n1 + "</text></svg>";
    const d = last.w - pts[0].w;
    s += '<p class="hint num">' + (d > 0 ? "+" : "") + d.toFixed(1) + " " + S().unit + " since day " + n0 + ".</p>";
    return s;
  }

  function backupSection() {
    let status, dot, buttons = "", how = "";
    if (mode === "apk") {
      const info = apkBackupInfo();
      const at = info.at || lastFileBackup;
      dot = at ? "ok" : "";
      status = at
        ? "Automatic backup is on. Every change is copied to <b>" + esc(info.path || "Download/100 Days Hard") + "</b> on this phone. Last copied " + fmtWhen(at) + "."
        : "Automatic backup is on. A backup file appears in <b>Download/100 Days Hard</b> as soon as you log something.";
      buttons = '<button class="btn" data-action="save-backup">Send a copy to Drive or email</button><button class="btn secondary" data-action="restore">Restore from file</button>';
      how = "<ol class=\"steps\"><li>The backup file updates by itself and stays on your phone even if you uninstall the app.</li><li>Once a week or so, tap <b>Send a copy</b> and pick Google Drive, so your history is safe if you lose the phone.</li><li>On a new phone or after reinstalling, tap <b>Restore from file</b> and pick the newest backup.</li></ol>";
    } else if (mode === "claude") {
      dot = sync === "ok" ? "ok" : sync === "err" ? "err" : "";
      status = sync === "err"
        ? "Couldn't reach your account just now. Changes are kept in this browser and will sync when it reconnects."
        : "Automatic backup is on. Every change saves to your Claude account, so it's on any device where you open this link.";
      if (downloads) buttons += '<button class="btn" data-action="save-backup">Save a backup file</button>';
      buttons += '<button class="btn secondary" data-action="restore">Restore from file</button>';
      how = '<p class="hint">' + (S().lastExport ? "Last backup file saved " + fmtWhen(S().lastExport) + ". " : "") + "A backup file moves your history into the installed app, or back here from it.</p>";
    } else if (isWebApp) {
      const bk = backupState();
      dot = bk ? (bk.level === "ok" ? "ok" : bk.level === "bad" ? "err" : "") : "";
      status = "Saved on this phone. " + (S().lastExport ? "Last backup file saved " + fmtWhen(S().lastExport) + "." : "Save a backup file now and then, in case the phone clears its storage.");
      buttons = '<button class="btn" data-action="save-backup">Save a backup file</button><button class="btn secondary" data-action="restore">Restore from file</button>';
      how = '<p class="hint">On iPhone, choose <b>Save to Files</b> and keep it in iCloud Drive.</p>';
    } else {
      dot = "";
      status = "Saved in this browser only. Open the app from your Claude link to keep it in your account.";
      buttons = '<button class="btn secondary" data-action="restore">Restore from file</button>';
    }
    const bkState = backupState();
    if (bkState && mode !== "claude") how += '<p class="hint">The dot next to the date shows this: green means a copy was saved in the last week, yellow after a week, red after two weeks or if there\'s no copy yet.</p>';
    return '<section class="panel" aria-labelledby="h-bk"><h2 id="h-bk">Backup &amp; restore</h2>' +
      '<div class="sync"><span class="dot ' + dot + '"></span><span>' + status + "</span></div>" +
      '<div class="btn-row">' + buttons + "</div>" + how + "</section>";
  }

  function healthSection() {
    if (mode !== "apk" || health === "unavailable") return "";
    const on = health === "granted", missing = healthMissing();
    return '<section class="panel" aria-labelledby="h-sh"><h2 id="h-sh">Samsung Health</h2>' +
      '<div class="sync"><span class="dot ' + (on ? "ok" : "") + '"></span><span>' +
      (on ? "Connected. Food, weight, steps, sleep and workouts fill in by themselves each time you open the app." : "Not connected. Connect to fill in food, weight, steps, sleep and workouts automatically.") + "</span></div>" +
      (on && missing.length ? '<p class="hint">Not shared yet: ' + missing.join(", ") + ".</p>" : "") +
      '<div class="btn-row">' + (on && !missing.length ? '<button class="btn secondary" data-action="health-sync">Check now</button>' : '<button class="btn" data-action="health-connect">' + (on ? "Allow the rest" : "Connect Samsung Health") + "</button>") +
      '<button class="btn secondary" data-action="health-settings">Health Connect settings</button></div>' +
      '<ol class="steps"><li>In Samsung Health, open <b>Settings → Health Connect</b> and let Samsung Health share <b>Nutrition</b>, <b>Weight</b>, <b>Steps</b>, <b>Sleep</b> and <b>Exercise</b>.</li><li>Here, tap <b>Connect</b> and allow them.</li><li>Numbers you type in yourself always win over synced ones.</li></ol></section>';
  }

  function renderSettings() {
    const s = S();
    return (
      backupSection() +
      updateSection() +
      healthSection() +
      shareSection() +
      testingSection() +
      '<section class="panel" aria-labelledby="h-ch"><h2 id="h-ch">Challenge</h2><div class="form">' +
        '<div class="two"><label>Length (days)<input class="field num" id="set-len" type="number" inputmode="numeric" min="1" max="1000" value="' + TOTAL() + '"></label>' +
        '<label>Today is day<input class="field num" id="set-day" type="number" inputmode="numeric" min="1" max="' + TOTAL() + '" value="' + Math.min(dayNum(todayISO()), TOTAL()) + '"></label></div>' +
        '<p class="hint">Day 1 was ' + fmtDate(s.startDate, { weekday: "long", month: "long", day: "numeric", year: "numeric" }) + ". Day " + TOTAL() + " lands on " + fmtDate(addDays(s.startDate, TOTAL() - 1), { weekday: "long", month: "long", day: "numeric" }) + ".</p>" +

        (bridge && health !== "unavailable" ? '<p class="hint">' + esc(workoutRule()) + "</p>" : "") +
        '<label>Weight unit<span class="seg" role="group"><button data-action="unit" data-unit="lb" aria-pressed="' + (s.unit === "lb") + '">lb</button><button data-action="unit" data-unit="kg" aria-pressed="' + (s.unit === "kg") + '">kg</button></span></label>' +

        '<form class="inline" id="habit-form"><input class="field" id="new-habit" placeholder="Add a task, e.g. 10k steps" maxlength="60" autocomplete="off"><button class="btn" type="submit">Add</button></form>' +
        '<p class="hint">"Hit protein goal" ticks itself at ' + fmt(s.proteinGoal) + ' g, and "Workout" when you save a workout. A new task counts from the day you add it.</p>' +
      "</section>"

  }

  // ---------- exercise sheet ----------
  const sheet = document.getElementById("sheet"), backdrop = document.getElementById("backdrop");
  function openSheet(html, focusId) {
    sheet.innerHTML = '<div class="sheet-inner"><div class="grab"></div>' + html + "</div>";
    sheet.hidden = backdrop.hidden = false;
    const f = focusId && document.getElementById(focusId);
    if (f) setTimeout(() => f.focus(), 60);
  }
  function closeSheet() { sheet.hidden = backdrop.hidden = true; sheet.innerHTML = ""; sheet.classList.remove("tall"); }

  // ---------- workouts: Push / Pull / Legs ----------
  const TYPES = [{ id: "push", name: "Push" }, { id: "pull", name: "Pull" }, { id: "legs", name: "Legs" }];
  const typeName = (t) => (TYPES.find((x) => x.id === t) || { name: "Workout" }).name;
  const exKey = (name) => String(name).trim().toLowerCase();
  const isCable = (name) => /cable/i.test(name);
  const toUnit = (w, from, to) => (from === to ? w : from === "kg" ? w * KG_TO_LB : w / KG_TO_LB);
  const half = (n) => Math.round(n * 2) / 2;
  const fmtW = (n) => (Math.round(n * 10) / 10).toLocaleString();
  const stepFor = (unit) => (unit === "kg" ? 2.5 : 5);
  // Estimated one-rep max (Epley). Lets 50 x 7 be compared fairly with 45 x 12.
  const e1rm = (w, r) => (w > 0 ? w * (1 + r / 30) : r);

  function savedSessions(type, before) {
    return Object.keys(state.days).sort().filter((d) => (!before || d < before) && state.days[d].workout && state.days[d].workout.saved && (!type || state.days[d].workout.type === type));
  }
  function lastSession(type, before) {
    const k = savedSessions(type, before).pop();
    return k ? { date: k, workout: state.days[k].workout } : null;
  }
  function lastExercise(name, before) {
    const ds = savedSessions(null, before);
    for (let i = ds.length - 1; i >= 0; i--) {
      const e = state.days[ds[i]].workout.exercises.find((x) => exKey(x.name) === exKey(name));
      if (e) return { date: ds[i], e };
    }
    return null;
  }
  function allExerciseNames() {
    const seen = {};
    savedSessions().forEach((d) => state.days[d].workout.exercises.forEach((e) => (seen[exKey(e.name)] = e.name)));
    return Object.values(seen).sort();
  }

  function workoutPanel(day) {
    const w = day.workout, unit = S().unit;
    let body;
    if (w) {
      const list = w.exercises.length
        ? '<ul class="list">' + w.exercises.map((e) =>
            '<li class="row"><div class="row-main"><div class="row-title">' + esc(e.name) + '</div><div class="row-sub num">' + e.sets + " sets × " + e.reps + " reps</div></div>" +
            '<div class="row-val num">' + (e.weight > 0 ? fmtW(e.weight) + " " + e.unit : "Bodyweight") + "</div></li>").join("") + "</ul>"
        : '<p class="empty">No exercises yet.</p>';
      body = list + '<button class="btn wide' + (w.saved ? " secondary" : "") + '" data-action="open-workout">' + (w.saved ? "Edit workout" : "Continue workout") + "</button>";
    } else {
      body = '<div class="ppl">' + TYPES.map((t) => {
        const last = lastSession(t.id, viewDate);
        return '<button data-action="start-workout" data-type="' + t.id + '"><b>' + t.name + "</b><small>" + (last ? "Last: day " + dayNum(last.date) : "Set up") + "</small></button>";
      }).join("") + "</div>";
    }
    const status = w ? '<span class="w-status ' + (w.saved ? "saved" : "draft") + '">' + (w.saved ? "Saved" : "In progress") + "</span>" : "";
    return '<section class="panel" aria-labelledby="h-ex"><div class="panel-head"><h2 id="h-ex">' + (w ? typeName(w.type) + " day" : "Workout") + "</h2>" + status + "</div>" + body + "</section>";
  }

  let wEdit = false, wAdding = false, wConfirmDiscard = false;
  function startWorkout(type) {
    const d = getDay(viewDate);
    if (!d.workout) {
      const prev = lastSession(type, viewDate);
      d.workout = { type, saved: false, savedAt: null, exercises: prev ? prev.workout.exercises.map((e) => ({ ...e, id: uid() })) : [] };
      save(viewDate);
      render(true);
    }
    openWorkout();
  }
  function openWorkout() {
    wEdit = false; wConfirmDiscard = false;
    wAdding = !peekDay(viewDate).workout.exercises.length;
    sheet.classList.add("tall");
    sheet.hidden = backdrop.hidden = false;
    drawWorkout();
    sheet.scrollTop = 0;
    if (wAdding) setTimeout(() => { const f = document.getElementById("wadd-name"); if (f) f.focus(); }, 60);
  }
  function stepper(label, e, field, unitLabel) {
    const v = field === "weight" ? fmtW(e.weight) : e[field];
    return '<div class="stepper-group"><div class="stepper-label">' + label + '</div><div class="stepper">' +
      '<button class="sbtn" data-action="ex-step" data-id="' + e.id + '" data-f="' + field + '" data-d="-1" aria-label="Less ' + label.toLowerCase() + '">−</button>' +
      '<div class="sval-wrap"><input class="sval num" id="ex-' + field + "-" + e.id + '" data-id="' + e.id + '" data-f="' + field + '" type="number" inputmode="decimal" step="any" min="0" value="' + String(v).replace(/,/g, "") + '" aria-label="' + label + '">' + (unitLabel ? '<span class="u">' + unitLabel + "</span>" : "") + "</div>" +
      '<button class="sbtn" data-action="ex-step" data-id="' + e.id + '" data-f="' + field + '" data-d="1" aria-label="More ' + label.toLowerCase() + '">+</button></div></div>';
  }
  function drawWorkout() {
    const w = peekDay(viewDate).workout;
    if (!w) { closeSheet(); return; }
    const scroll = sheet.scrollTop;
    const prev = lastSession(w.type, viewDate);
    const pm = {};
    if (prev) prev.workout.exercises.forEach((e) => (pm[exKey(e.name)] = e));
    const cards = w.exercises.map((e, i) => {
      const p = pm[exKey(e.name)];
      const conv = isCable(e.name) && e.weight > 0 ? "≈ " + fmtW(half(toUnit(e.weight, e.unit, e.unit === "kg" ? "lb" : "kg"))) + " " + (e.unit === "kg" ? "lb" : "kg") : "";
      const lastTxt = p ? "Last time: " + (p.weight > 0 ? fmtW(p.weight) + " " + p.unit : "bodyweight") + " × " + p.reps + " · " + p.sets + " sets" : "";
      const tools = wEdit
        ? '<span class="ex-tools"><button class="iconbtn" data-action="ex-move" data-id="' + e.id + '" data-d="-1" aria-label="Move up"' + (i === 0 ? " disabled" : "") + '>↑</button><button class="iconbtn" data-action="ex-move" data-id="' + e.id + '" data-d="1" aria-label="Move down"' + (i === w.exercises.length - 1 ? " disabled" : "") + '>↓</button><button class="del" data-action="ex-del" data-id="' + e.id + '" aria-label="Remove ' + esc(e.name) + '">×</button></span>'
        : isCable(e.name) ? '<span class="seg sm" role="group" aria-label="Cable weight unit"><button data-action="ex-unit" data-id="' + e.id + '" data-u="lb" aria-pressed="' + (e.unit === "lb") + '">lb</button><button data-action="ex-unit" data-id="' + e.id + '" data-u="kg" aria-pressed="' + (e.unit === "kg") + '">kg</button></span>' : "";
      return '<div class="ex"><div class="ex-head"><span class="ex-name">' + esc(e.name) + "</span>" + tools + "</div>" +
        (wEdit ? "" : stepper("Weight", e, "weight", e.unit) + '<div class="two">' + stepper("Reps", e, "reps") + stepper("Sets", e, "sets") + "</div>" +
        (conv || lastTxt ? '<div class="ex-sub num">' + (conv ? "<span>" + conv + "</span>" : "") + (lastTxt ? "<span>" + lastTxt + "</span>" : "") + "</div>" : "")) +
      "</div>";
    }).join("");
    const names = allExerciseNames().filter((n) => !w.exercises.some((e) => exKey(e.name) === exKey(n)));
    const addForm = wAdding
      ? '<form class="form ex" id="wadd-form">' +
          '<label>Exercise<input class="field" id="wadd-name" list="wadd-names" placeholder="' + ({ push: "Bench press", pull: "Cable row", legs: "Squat" }[w.type] || "Exercise") + '" maxlength="60" autocomplete="off" required></label>' +
          '<datalist id="wadd-names">' + names.map((n) => '<option value="' + esc(n) + '"></option>').join("") + "</datalist>" +
          '<div class="three"><label for="wadd-weight">Weight<span class="suffix"><input class="field num" id="wadd-weight" type="number" inputmode="decimal" min="0" step="any" placeholder="0"><span class="u" id="wadd-unit">' + S().unit + "</span></span></label>" +
          '<label for="wadd-reps">Reps<input class="field num" id="wadd-reps" type="number" inputmode="numeric" min="0" value="10"></label>' +
          '<label for="wadd-sets">Sets<input class="field num" id="wadd-sets" type="number" inputmode="numeric" min="1" value="3"></label></div>' +
          '<p class="hint">Leave weight at 0 for bodyweight moves like dips.</p>' +
          '<div class="btn-row"><button class="btn" type="submit">Add</button>' + (w.exercises.length ? '<button class="btn secondary" type="button" data-action="wadd-cancel">Cancel</button>' : "") + "</div>" +
        "</form>"
      : "";
    const intro = prev
      ? "Loaded from your last " + typeName(w.type).toLowerCase() + " day (day " + dayNum(prev.date) + "). Adjust what changed, then save."
      : w.exercises.length ? "" : "First " + typeName(w.type).toLowerCase() + " day. Add exercises in the order you do them. Next time they'll all be here, with your weights and sets.";
    sheet.innerHTML = '<div class="sheet-inner"><div class="grab"></div>' +
      '<div class="panel-head"><h2>' + typeName(w.type) + ' day</h2><span class="meta">' + (viewDate === todayISO() ? "Today" : "Day " + dayNum(viewDate)) + "</span></div>" +
      (intro ? '<p class="hint">' + intro + "</p>" : "") +
      cards + addForm +
      '<div class="btn-row">' + (wAdding ? "" : '<button class="btn secondary" data-action="wadd-open">+ Add exercise</button>') +
        (w.exercises.length ? '<button class="btn secondary" data-action="w-edit">' + (wEdit ? "Done" : "Reorder or remove") + "</button>" : "") +
        (!w.saved ? '<button class="btn danger" data-action="w-discard">' + (wConfirmDiscard ? "Tap again to discard" : "Not " + typeName(w.type).toLowerCase() + " day? Discard") + "</button>" : "") +
      "</div>" +
      '<div class="sheet-foot"><button class="btn wide" data-action="w-save"' + (w.exercises.length ? "" : " disabled") + ">" + (w.saved ? "Save changes" : "Save workout") + "</button></div>" +
      "</div>";
    sheet.scrollTop = scroll;
  }
  function findEx(id) { const w = peekDay(viewDate).workout; return w && w.exercises.find((e) => e.id === id); }

  // ---------- toast ----------
  const toastEl = document.getElementById("toast");
  let toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (toastEl.hidden = true), 2200); }

  // ---------- events ----------
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action;
    const day = () => getDay(viewDate);
    switch (a) {
      case "tab": view = el.dataset.tab; if (view === "today") viewDate = todayISO(); render(true); window.scrollTo(0, 0); break;
      case "go-today": view = "today"; viewDate = todayISO(); render(true); window.scrollTo(0, 0); break;
      case "prev-day": viewDate = addDays(viewDate, -1); render(true); break;
      case "next-day": if (viewDate < todayISO()) viewDate = addDays(viewDate, 1); render(true); break;
      case "open-day": viewDate = el.dataset.date; view = "today"; render(true); window.scrollTo(0, 0); break;
      case "toggle-habit": { const d = day(); d.habits = { ...d.habits, [el.dataset.id]: !d.habits[el.dataset.id] }; d.autoTicks = { ...d.autoTicks, [el.dataset.id]: false }; save(viewDate); render(true); break; }
      case "open-settings": view = "settings"; render(true); window.scrollTo(0, 0); checkForUpdate(); break;
      case "get-update": if (bridge && bridge.openUrl) bridge.openUrl(APK_URL); break;
      case "share-app": if (bridge && bridge.shareText) bridge.shareText("I'm tracking my 100-day gym challenge with this app. Get it here: " + SHARE_URL); break;
      case "copy-link": {
        const ok = () => toast("Link copied");
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("share-link")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Link selected. Copy it from the menu."); };
        try { navigator.clipboard.writeText(SHARE_URL).then(ok, fallback); } catch (e) { fallback(); }
        break;
      }
      case "add-template": {
        const tpl = GOAL_TEMPLATES.find(([name]) => name === el.dataset.name);
        if (!tpl) break;
        const ng = { id: uid(), name: tpl[0], focus: "", steps: tpl[1].map((t) => ({ id: uid(), text: t, done: false, doneDay: null })) };
        state.goals.list.push(ng); openGoal = ng.id;
        save("goals"); render(true); toast(tpl[0] + " added");
        break;
      }
      case "setup-next": {
        const key = setupSteps()[setupStep];
        if (key === "welcome") { const v = Math.round(+document.getElementById("su-len").value); draft.len = v >= 1 && v <= 1000 ? v : 100; }
        if (key === "day") { const v = Math.round(+document.getElementById("su-day").value); draft.day = v >= 1 && v <= draft.len ? v : 1; }
        if (key === "goals") {
          if (draft.mode === "suggest") {
            const t = suggestTargets();
            if (!t) { toast("Still need: " + suggestCheck().need.join(", ")); break; }
            draft.kcal = t.kcal; draft.protein = t.protein;
          } else {
            if (!AIMS[draft.aim]) { toast("Pick a calorie goal: Lose fat or Build muscle"); break; }
            draft.kcal = Math.max(0, Math.round(+document.getElementById("su-kcal").value) || 2500); draft.protein = Math.max(0, Math.round(+document.getElementById("su-protein").value) || 150);
          }
        }
        if (key === "done") { finishSetup(); break; }
        setupStep++; render(true); window.scrollTo(0, 0);
        break;
      }
      case "setup-back": setupStep = Math.max(0, setupStep - 1); render(true); break;
      case "su-unit": draft.unit = el.dataset.unit || el.dataset.v; render(true); break;
      case "su-bf": draft.bodyFat = el.dataset.v; render(true); break;
      case "cal-aim": S().calorieAim = el.dataset.v; save("settings"); render(true); break;
      case "preview-setup": previewSetup = true; setupStep = 0; Object.assign(draft, freshDraft()); render(true); window.scrollTo(0, 0); break;
      case "preview-exit": previewSetup = false; view = "settings"; render(true); window.scrollTo(0, 0); break;
      case "su-mode": draft.mode = el.dataset.v; render(true); break;
      case "su-sex": draft.sex = el.dataset.v; render(true); break;
      case "su-activity": draft.activity = el.dataset.v; render(true); break;
      case "su-aim": draft.aim = el.dataset.v; render(true); break;
      case "su-len": draft.len = +el.dataset.v; draft.day = Math.min(draft.day, draft.len); render(true); break;
      case "trend": trendKey = el.dataset.k; render(true); break;
      case "offer-add": {
        const add = AUTO_IDS.filter((id) => !S().habits.some((h) => h.id === id));
        S().habits = S().habits.concat(add.map((id) => ({ id, name: METRICS[id].label(S()), addedOn: todayISO() })));
        S().autoOffered = true; save("settings"); reTick(); render(true);
        if (bridge && healthMissing().length) bridge.healthConnect();
        toast("Added. They tick themselves from Samsung Health.");
        break;
      }
      case "offer-skip": S().autoOffered = true; save("settings"); render(true); break;
      case "wo-n": woChoice = +el.dataset.v; render(true); break;
      case "wo-on":
        S().workoutsTarget = woChoice || workoutsTarget(); S().workoutOffered = true; save("settings"); reTick(); render(true);
        if (bridge && healthMissing().includes("workouts")) bridge.healthConnect(); else healthSync();
        toast("Workouts a day: " + workoutsTarget());
        break;
      case "wo-skip": S().workoutOffered = true; save("settings"); render(true); break;
      case "finish-dismiss": S().finishDismissed = S().startDate; save("settings"); render(true); break;
      case "new-round": openNewRound(); break;
      case "round-len": document.getElementById("round-custom").value = el.dataset.v; document.querySelectorAll("[data-action=round-len]").forEach((b) => b.setAttribute("aria-pressed", String(b === el))); break;
      case "round-start": {
        const v = Math.round(+document.getElementById("round-custom").value);
        if (!(v >= 1 && v <= 1000)) { toast("Pick a length between 1 and 1000 days"); break; }
        const st = S();
        st.rounds = (st.rounds || []).concat([{ startDate: st.startDate, totalDays: TOTAL() }]);
        st.startDate = todayISO(); st.totalDays = v; st.finishDismissed = null;
        save("settings"); closeSheet(); view = "today"; viewDate = todayISO(); render(true); window.scrollTo(0, 0);
        toast("Day 1 of " + v + ". Let's go.");
        break;
      }
      case "su-task": { const id = el.dataset.id; draft.tasks = draft.tasks.includes(id) ? draft.tasks.filter((x) => x !== id) : draft.tasks.concat(id); render(true); break; }
      case "start-workout": startWorkout(el.dataset.type); break;
      case "open-workout": openWorkout(); break;
      case "ex-step": {
        const e = findEx(el.dataset.id), f = el.dataset.f, dir = +el.dataset.d;
        if (!e) break;
        if (f === "weight") e.weight = Math.max(0, half(e.weight + dir * stepFor(e.unit)));

      }
      case "ex-unit": {
        const e = findEx(el.dataset.id), u = el.dataset.u;

      }
      case "ex-move": {
        const w = day().workout, i = w.exercises.findIndex((e) => e.id === el.dataset.id), j = i + +el.dataset.d;

        save(viewDate); drawWorkout(); break;
      }
      case "ex-del": { const w = day().workout; w.exercises = w.exercises.filter((e) => e.id !== el.dataset.id); save(viewDate); drawWorkout(); render(); break; }
      case "wadd-open": wAdding = true; wEdit = false; drawWorkout(); setTimeout(() => { const f = document.getElementById("wadd-name"); if (f) { f.focus(); f.scrollIntoView({ block: "center" }); } }, 30); break;
