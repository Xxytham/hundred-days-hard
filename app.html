<title>100 Days Hard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14181D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Header with a weight-plate day counter in the corner,
   stacked sections per tab, fixed bottom tab bar. Colors borrow from bumper plates
   (25 kg red, 20 kg blue, 15 kg yellow, 10 kg green). */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --sunk: #E2E6EB;
  --ink: #14181D;
  --muted: #5B6570;
  --line: #D2D8DF;
  --red: #CF2539;
  --blue: #1D5BB8;
  --yellow: #E1A006;
  --green: #2A8653;
  --on-color: #FFFFFF;
  --backdrop: rgba(20, 24, 29, 0.45);
  --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
  --radius: 14px;
  /* Motion: short, small, only on a tap, and only transform/opacity (see CLAUDE.md, Design) */
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t: 200ms;
  --fade-floor: 85%; /* how dim a food bar starts; it brightens to full color at the goal */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1215; --surface: #191E24; --sunk: #232A31; --ink: #E8ECF0; --muted: #96A0AB;
    --line: #2B333C; --red: #FF5263; --blue: #5E9CFF; --yellow: #FFC23A; --green: #4CC489;
    --on-color: #0F1215; --backdrop: rgba(0, 0, 0, 0.6); color-scheme: dark; --fade-floor: 55%;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1215; --surface: #191E24; --sunk: #232A31; --ink: #E8ECF0; --muted: #96A0AB;
  --line: #2B333C; --red: #FF5263; --blue: #5E9CFF; --yellow: #FFC23A; --green: #4CC489;
  --on-color: #0F1215; --backdrop: rgba(0, 0, 0, 0.6); color-scheme: dark; --fade-floor: 55%;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
  -webkit-tap-highlight-color: transparent;
  /* An app, not a page: no text selection or long-press menus, except where you type */
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
input, textarea, .share-link { -webkit-user-select: text; user-select: text; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
#main { width: 100%; min-width: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top-text { min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; margin: 2px 0 0; letter-spacing: 0.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; margin: 0; letter-spacing: 0.02em; text-transform: uppercase; }
/* Day counter: a gauge with a gap at the bottom where the settings gear sits */
.plate { flex: none; width: 64px; height: 64px; border: 0; padding: 0; background: none; border-radius: 50%; }
.gauge { width: 100%; height: 100%; display: block; overflow: visible; }
.g-track, .g-fill { fill: none; stroke-width: 4; stroke-linecap: round; }
.g-track { stroke: var(--sunk); }
.g-fill { stroke: var(--red); }
.g-day { font-family: var(--font-display); font-weight: 800; font-size: 22px; fill: var(--ink); }
.g-of { font-family: var(--font-body); font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; fill: var(--muted); }
.g-gear { fill: var(--muted); transition: fill 0.15s ease; }
.plate:hover .g-gear, .plate:focus-visible .g-gear { fill: var(--ink); }
.setup-hero .plate { width: 96px; height: 96px; }

.coach { font-size: 14px; color: var(--muted); margin: 0; }
.coach strong { color: var(--ink); font-weight: 600; }

/* Day switcher */
.daybar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daybar .label { font-weight: 600; font-size: 14px; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; font-size: 18px; line-height: 1;
}
.iconbtn:disabled { opacity: 0.35; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 600; font-size: 14px; padding: 6px 4px; }

/* Panels */
.panel { background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel-head .meta { font-size: 13px; color: var(--muted); }


/* Workout button: a + in the bottom corner of Today that opens Push / Pull / Legs */
.sbtn:active { transform: scale(0.97); }
body.fab-on { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 96px); }
.fab-wrap { display: none; }
body.fab-on .fab-wrap { display: block; }
body.kb .fab-wrap { display: none; }
.fab, .fab-menu { position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px), calc((100vw - 560px) / 2)); }
.fab {
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px);
  width: 58px; height: 58px; border: 0; border-radius: 50%; padding: 0;
  background: var(--red); color: var(--on-color); display: grid; place-items: center;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
}
.fab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; transition: transform var(--t) var(--ease); }
.fab:active { transform: scale(0.95); }
.fab-wrap.open .fab svg { transform: rotate(45deg); }
.fab-menu {
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 86px);
  display: grid; gap: 8px; justify-items: end; visibility: hidden; transition: visibility 0s linear 120ms;
}
.fab-wrap.open .fab-menu { visibility: visible; transition-delay: 0s; }
.fab-menu button {
  min-width: 196px; border: 0; border-radius: 14px; padding: 12px 16px; background: var(--ink); color: var(--bg);
  display: flex; align-items: baseline; justify-content: space-between; gap: 14px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
  opacity: 0; transform: translateY(10px) scale(0.96); transform-origin: right bottom;
  transition: opacity 120ms ease, transform 120ms ease;
}
.fab-menu b { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.fab-menu small { font-size: 12px; font-weight: 600; opacity: 0.75; }
.fab-wrap.open .fab-menu button { opacity: 1; transform: none; transition-duration: var(--t); transition-timing-function: var(--ease); }
.fab-wrap.open .fab-menu button:nth-child(2) { transition-delay: 30ms; }
.fab-wrap.open .fab-menu button:nth-child(1) { transition-delay: 60ms; }
.fab-scrim { position: fixed; inset: 0; z-index: 24; background: var(--backdrop); opacity: 0; pointer-events: none; transition: opacity 120ms ease; }
.fab-wrap.open .fab-scrim { opacity: 1; pointer-events: auto; transition-duration: var(--t); }
.w-status { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.w-status.saved { color: var(--green); }
.w-status.draft { color: var(--yellow); }

/* Workout sheet */
.sheet.tall { max-height: 94vh; }
.ex { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ex-name { font-weight: 700; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
/* Reorder / rename / remove: hold a row (or grab its dots) and drag; tap the name to rename */
.ex-edit {
  display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 0; background: var(--surface);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y;
  transition: transform 160ms var(--ease), box-shadow 160ms ease;
}
.grip { flex: none; width: 40px; height: 44px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; }
.grip svg { width: 10px; height: 18px; fill: currentColor; }
.ex-rename {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 4px;
  text-align: left; font-weight: 700; font-size: 16px; overflow-wrap: anywhere;
}
.ex-rename svg { flex: none; width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-edit.lifted { transition: none; position: relative; z-index: 3; scale: 1.02; border-color: var(--muted); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35); }
.ex-edit.renaming { padding: 8px; }
.ex-ask { display: grid; gap: 10px; }
.ex-ask p { margin: 0; display: grid; gap: 2px; }
.ex-ask .btn-row { align-items: center; }
.stepper { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 6px; }
.stepper-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.sbtn { height: 44px; border-radius: 10px; border: 0; background: var(--sunk); font-size: 22px; font-weight: 700; line-height: 1; }
.sval-wrap { display: flex; align-items: baseline; justify-content: center; gap: 4px; min-width: 0; }
.sval {
  width: 100%; min-width: 0; text-align: center; border: 0; background: none; padding: 4px 0;
  font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1;
}
.sval-wrap .u { font-size: 13px; color: var(--muted); font-weight: 600; }
.sval-wrap:has(.u) .sval { width: 5ch; text-align: right; }
.ex-sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.seg.sm button { padding: 4px 10px; font-size: 13px; }
.sval-wrap:has(.u) .set-now { display: block; width: auto; text-align: center; }
.sval-wrap .u { white-space: nowrap; }
.set-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.set-chips button[data-action="set-go"] { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 600; }
.set-chips button[data-action="set-go"] span { color: var(--muted); font-weight: 700; }
.set-chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.set-chips button[aria-pressed="true"] span { color: var(--bg); opacity: 0.7; }
.sbtn:disabled { opacity: 0.35; }
.sheet-foot { display: grid; gap: 8px; position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding-block: 10px 6px; }
.sheet.typing .sheet-foot { display: none; }

.three { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
.three label { min-width: 0; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.form label > .seg { justify-self: start; }
.suffix { position: relative; display: block; }
.suffix .field { padding-right: 40px; }
.suffix .u {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-size: 12px; font-weight: 700; color: var(--ink); background: var(--sunk); padding: 3px 7px; border-radius: 6px; pointer-events: none;
}

/* Strength tickers */
.tickers { display: grid; }
.tick {
  display: grid; grid-template-columns: minmax(0, 1fr) 56px auto 64px; align-items: center; gap: 10px;
  width: 100%; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left;
}
.tickers > :first-child { border-top: 0; }
.tick-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.tick-name small, .tick-val small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.tick-val { text-align: right; font-weight: 700; white-space: nowrap; }
.chg { justify-self: end; font-size: 12px; font-weight: 700; padding: 4px 6px; border-radius: 6px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chg.up { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.chg.down { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.spark { width: 56px; height: 22px; display: block; }
.spark polyline { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.spark.up polyline { stroke: var(--green); }
.spark.down polyline { stroke: var(--red); }
.tick-detail { display: grid; gap: 10px; padding-bottom: 12px; }
/* The open exercise: outlined and softly tinted in its direction's color */
.tick-focus {
  --fc: var(--green); margin: 4px -10px; padding: 0 10px; border-radius: 14px;
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--fc) 75%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--fc) 15%, transparent), color-mix(in srgb, var(--fc) 4%, transparent) 70%);
  animation: focus-in var(--t) var(--ease);
}
.tick-focus.down { --fc: var(--red); }
.tick-focus .tick { border-top: 0; }
.tick-focus + .tick { border-top: 0; }
@keyframes focus-in { from { opacity: 0.4; } to { opacity: 1; } }
.chart .slabel { fill: var(--ink); font-weight: 700; font-size: 10px; }
.chart .sreps { fill: var(--muted); font-size: 9px; }
.chart .sline { fill: none; stroke: var(--green); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .sline.down { stroke: var(--red); }
.chart .sdot { fill: var(--surface); stroke: var(--green); stroke-width: 2.5; }
.chart .sdot.down { stroke: var(--red); }
.str-note { margin: 0; font-size: 14px; color: var(--muted); }
.str-note b { color: var(--ink); }
.str-what { display: inline-block; margin-right: 8px; padding: 2px 6px; border-radius: 5px; background: var(--sunk); color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.chart .g-up stop { stop-color: var(--green); }
.chart .g-down stop { stop-color: var(--red); }
.sessions { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.sessions li { display: flex; justify-content: space-between; gap: 8px; }
.sessions .r { color: var(--muted); }
@media (max-width: 360px) { .tick { grid-template-columns: minmax(0, 1fr) auto 60px; } .tick .spark { display: none; } }

/* Streak strip */
.streak { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.streak-num { display: flex; align-items: baseline; gap: 6px; }
.streak-num b { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 0.9; color: var(--red); }
.streak-num span { font-family: var(--font-display); font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.week { display: flex; gap: 6px; }
.week span { display: grid; justify-items: center; gap: 3px; font-size: 10px; font-weight: 700; color: var(--muted); }
.week i { width: 18px; height: 18px; border-radius: 5px; background: var(--sunk); display: block; }
.week i.full { background: var(--red); }
.week i.partial { background: color-mix(in srgb, var(--blue) 55%, var(--sunk)); }
.week i.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--ink); }
.streak-note { margin: -6px 0 0; font-size: 13px; color: var(--muted); }

/* Backup status dot by the date */
.eyebrow { display: flex; align-items: center; gap: 8px; }
.bk-dot { width: 22px; height: 22px; margin: -6px 0; padding: 0; border: 0; background: none; display: grid; place-items: center; flex: none; }
.bk-dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.bk-dot.ok::before { background: var(--green); }
.bk-dot.warn::before { background: var(--yellow); }
.bk-dot.bad::before { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent); }

.inline-num {
  font: inherit; color: var(--red); background: var(--surface); border: 0; border-bottom: 4px solid var(--red); border-radius: 10px 10px 4px 4px;
  width: 3.4ch; padding: 0 0.12em; text-align: center; box-shadow: 0 2px 0 var(--line); margin: 0 0.06em;
}
#su-day.inline-num { width: 2.6ch; }
.inline-num:focus { outline: 3px solid var(--blue); outline-offset: 2px; }
.last-day { display: grid; gap: 2px; padding-top: 8px; }
.last-day b { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.05; }
.need { color: var(--red); font-weight: 600; }
.suggest { display: grid; gap: 4px; background: var(--surface); border-radius: 12px; padding: 14px; box-shadow: inset 0 0 0 2px var(--green); }
.suggest b { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1.05; }

/* Tasks with live numbers */
.habit-text { display: grid; gap: 1px; min-width: 0; }
.habit-sub { font-size: 12px; font-weight: 600; color: var(--muted); }
.habit.done .habit-sub { color: var(--green); }
.auto-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); vertical-align: 1px; }
.pick button[aria-pressed="true"] .auto-tag { background: color-mix(in srgb, var(--bg) 22%, transparent); color: var(--bg); }
.chart .b.met { fill: var(--green); }
.chart .range { fill: var(--green); opacity: 0.14; }

/* End of challenge */
.finish { background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 18px 16px; display: grid; gap: 12px; }
.finish .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.finish h2 { font-size: 34px; color: var(--bg); }
.finish-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 0; }
.finish-facts dt { font-size: 12px; color: color-mix(in srgb, var(--bg) 70%, transparent); }
.finish-facts dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.finish .btn { background: var(--bg); color: var(--ink); }
.finish .btn.secondary { background: transparent; color: var(--bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bg) 40%, transparent); }

/* Update banner */
.update { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 12px 14px; }
.update .btn { background: var(--bg); color: var(--ink); padding: 8px 14px; flex: none; }
.update-text { display: grid; gap: 1px; min-width: 0; }
.update-text small { font-size: 13px; opacity: 0.8; }

/* Share */
.share-qr { width: 168px; height: 168px; background: #FFFFFF; border-radius: 12px; padding: 10px; display: grid; place-items: center; }
.share-qr svg { width: 100%; height: 100%; display: block; }
.share-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.share-link { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; user-select: all; min-width: 0; }

/* First-time setup */
body.setup .nav, body.setup .top { display: none; }
.setup-wrap { display: grid; gap: 18px; padding-top: 8px; }
.setup-progress { display: flex; gap: 6px; }
.setup-progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--sunk); }
.setup-progress i.on { background: var(--red); }
.setup-hero { display: grid; gap: 14px; justify-items: start; padding-top: 24px; }
.setup-hero .plate { pointer-events: none; }
.setup-title { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.1; margin: 0; text-wrap: balance; }
.setup-lead { font-size: 16px; color: var(--muted); margin: 0; max-width: 34ch; }
.setup-actions { display: grid; gap: 8px; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
.pick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.big-field { font-family: var(--font-display); font-weight: 800; font-size: 40px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); width: 140px; }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 48px; }
.row:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--muted); }
.row-val { font-weight: 700; white-space: nowrap; }
.del { border: 0; background: none; color: var(--muted); font-size: 20px; width: 36px; height: 36px; border-radius: 50%; }
.del:hover { background: var(--sunk); }
.empty { font-size: 14px; color: var(--muted); margin: 0; }

/* Daily totals: each box is its own bar. Calories leads; protein sits under it, slimmer.
   The number is drawn twice: ink on the empty part, and a copy clipped to the fill in the
   color that reads on it, so it flips as the bar passes under it. The input itself is invisible
   except for its caret. */
.totals { display: grid; gap: 12px; }
.tot { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.tot-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.tot-head span:last-child { font-weight: 500; white-space: nowrap; }
.tot-box {
  --c: color-mix(in srgb, var(--green) calc(var(--g, 0) * 100%), var(--blue)); --h: 64px; --fs: 40px; --clip: inset(0 calc(100% - var(--p, 0) * 100%) 0 0);
  position: relative; display: block; height: var(--h); border-radius: 14px; overflow: hidden; background: var(--sunk);
}
.tot-box[data-s="met"] { --c: var(--green); }
.tot-box[data-s="over"] { --c: var(--red); }
.tot-box.pro { --c: var(--green); --h: 44px; --fs: 26px; border-radius: 11px; }
.tot-fill, .tot-num { position: absolute; inset: 0; pointer-events: none; }
.tot-fill { background: color-mix(in srgb, var(--c) calc(var(--fade-floor) + (100% - var(--fade-floor)) * var(--b, 1)), var(--sunk)); clip-path: var(--clip); transition: background-color 250ms ease, opacity 150ms ease; }
.tot-box:focus-within .tot-fill { opacity: 0.25; }
.tot-num, .big-input { font-family: var(--font-display); font-weight: 800; font-size: var(--fs); line-height: 1; padding: 0 14px; }
.tot-num { display: flex; align-items: center; color: var(--ink); white-space: nowrap; }
.tot-num.on { color: var(--on-color); clip-path: var(--clip); }
/* While you type, the plain number shows and the bar waits; it moves once you're done. */
.tot-box:focus-within .tot-num { visibility: hidden; }
.tot-box:focus-within .big-input { color: var(--ink); }
.tot-box:focus-within .big-input::placeholder { color: var(--muted); }
.tot-num.empty { color: var(--muted); opacity: 0.5; }
.big-input {
  position: relative; display: block; height: 100%; width: 100%; min-width: 0;
  border: 0; border-radius: inherit; background: none; color: transparent; caret-color: var(--ink);
}
.big-input::placeholder { color: transparent; }
.big-input:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.source { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.source .linkbtn { padding-left: 0; }
.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; }
.btn.secondary { background: var(--sunk); color: var(--ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }

/* Goals ladders: hardest step at the top, like climbing */
.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ladder li { display: flex; align-items: center; gap: 4px; }
.step {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 44px;
  padding: 8px 10px; border: 0; border-radius: 10px; background: none; text-align: left;
}
.mark {
  flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line);
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--on-color);
}

.step-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.step.done .mark { background: var(--green); border-color: var(--green); }
.step.done .step-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.step.next { background: var(--bg); box-shadow: inset 0 0 0 2px var(--red); }

.focus { margin: 0; font-size: 13px; color: var(--muted); }

/* Goals tab: summary, groups, collapsible rows */

.goal-head {

}

/* Three steps at a time: the one before, where you are, and the next one to tick. They slide left when you tick. */

  display: flex; align-items: center; gap: 7px; padding: 0 10px; border: 0; border-radius: 10px; text-align: left;

.gs .mark { width: 18px; height: 18px; font-size: 10px; border-width: 2px; transition: background-color 240ms ease, border-color 240ms ease; }

/* Stats */

}

/* Habits */

<script>
(function () {
  "use strict";

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
  const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  const todayISO = () => iso(new Date());
  const fmtDate = (s, opts) => parseISO(s).toLocaleDateString(undefined, opts || { weekday: "short", month: "short", day: "numeric" });
  const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const fmtWhen = (ms) => {
    const d = iso(new Date(ms));

  };
  const fmt = (n) => Math.round(n).toLocaleString();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const KG_TO_LB = 2.20462;

  // ---------- state ----------
  const LOCAL_KEY = "hundred-days-hard.v1";
  const DEFAULT_HABITS = [
    { id: "workout", name: "Workout" },
    { id: "protein", name: "Hit protein goal" },
    { id: "water", name: "Drink 3 L of water" },
    { id: "steps", name: "10,000 steps" },
    { id: "sleep", name: "Get 9 hours of sleep" },

  // Shipped defaults are generic: friends install this same app, so nothing personal lives in code.
  const TASK_PRESETS = [
    ...DEFAULT_HABITS,
    { id: "read", name: "Read 10 pages" },
    { id: "photo", name: "Progress photo" },
    { id: "diet", name: "Stick to the diet" },
    { id: "noalcohol", name: "No alcohol" },
    { id: "stretch", name: "Stretch 10 minutes" },
  ];
  const defaultSettings = () => ({
    startDate: iso(new Date()),
    calorieGoal: 2500,
    proteinGoal: 150,
    totalDays: 100,
    stepsTarget: 10000,
    sleepTarget: 9,
    unit: "lb",
    habits: DEFAULT_HABITS.map((h) => ({ ...h })),

  });
  // Ladders run easiest to hardest; the page shows the hardest step at the top.
  const ladder = (id, name, steps, focus) => ({
    id, name, focus: focus || "",
    steps: steps.map((st, i) => ({ id: "s" + i, text: typeof st === "string" ? st : st[0], done: Array.isArray(st), doneDay: null })),
  });
  const defaultGoals = () => ({ updatedAt: 0, list: [] });
  const GOAL_TEMPLATES = [
    ["Push-ups in one go", ["10", "20", "30", "40", "50"]],
    ["Pull-ups", ["1", "3", "5", "8", "10"]],
    ["Dips in one go", ["5", "10", "15", "20"]],
    ["Dead hang", ["0:30", "0:45", "1:00", "1:30"]],
    ["Plank", ["0:30", "1:00", "2:00", "3:00"]],
    ["Running", ["0.25 mi", "0.5 mi", "1 mi", "2 mi", "5K"]],
  ];
  const blankDay = () => ({ kcal: null, protein: null, kcalSrc: null, habits: {}, workout: null, weight: null, health: null, updatedAt: 0 });
  function normalizeDay(d) {
    const day = { ...blankDay(), ...d };
    // Older versions logged individual meals; fold them into the day's totals.
    if (day.kcal == null && Array.isArray(d.meals) && d.meals.length) {

      day.protein = d.meals.reduce((a, m) => a + (+m.protein || 0), 0);
    }

        exercises: d.exercises.map((e) => ({ id: e.id || uid(), name: e.name, weight: +e.weight || 0, reps: +e.reps || 0, sets: +e.sets || 1, unit: "lb" })) };
    }
    delete day.exercises;
    if (day.workout && Array.isArray(day.workout.exercises)) day.workout.exercises.forEach(ensureSets);

  }

  const state = { settings: defaultSettings(), days: {}, goals: defaultGoals() };
  let editingGoal = null, confirmDelete = null;
  let view = "today";
  let viewDate = todayISO();

  try {
    const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null");
    if (saved && saved.settings) {
      state.settings = { ...defaultSettings(), ...saved.settings };
      Object.keys(saved.days || {}).forEach((k) => (state.days[k] = normalizeDay(saved.days[k])));
      if (saved.goals && Array.isArray(saved.goals.list)) state.goals = saved.goals;
      if (state.settings.setupDone === undefined) state.settings.setupDone = true; // already using the app before setup existed
    }
  } catch (e) { /* storage unavailable */ }

  const S = () => state.settings;
  const dayNum = (s) => diffDays(S().startDate, s) + 1;
  const peekDay = (d) => state.days[d] || blankDay();
  const getDay = (d) => (state.days[d] = state.days[d] || blankDay());
  // Fat loss: land within 100 kcal either side of the goal. Muscle: reach at least the goal.
  const calAim = () => (S().calorieAim === "build" ? "build" : "lose");
  const calRange = () => [S().calorieGoal - 100, S().calorieGoal + 100];
  function calStatus(k) {
    const g = S().calorieGoal;
    if (calAim() === "build") return k >= g ? { state: "met", short: "Goal hit", left: 0 } : { state: "under", short: fmt(g - k) + " kcal to go", left: g - k };
    const [lo, hi] = calRange();
    if (k > hi) return { state: "over", short: fmt(k - hi) + " kcal over your range", left: 0 };
    if (k >= lo) return { state: "met", short: "In your range", left: 0 };

  }
  const calGoalText = () => (calAim() === "lose" ? fmt(calRange()[0]) + "–" + fmt(calRange()[1]) : "at least " + fmt(S().calorieGoal));
  const TOTAL = () => Math.max(1, Math.round(+S().totalDays) || 100);
  // A task counts from the day it was added, so adding one never breaks past days or a streak.
  const tasksFor = (date) => S().habits.filter((h) => !h.addedOn || h.addedOn <= date);
  const doneOn = (date) => { const day = state.days[date]; return day ? tasksFor(date).filter((h) => day.habits && day.habits[h.id]).length : 0; };
  const fracOn = (date) => { const n = tasksFor(date).length; return n ? doneOn(date) / n : 0; };
  const fullOn = (date) => { const n = tasksFor(date).length; return n > 0 && doneOn(date) === n; };
  // Tasks Samsung Health can tick by itself. Names follow the targets in Settings.
  const fmtSleep = (min) => Math.floor(min / 60) + " h " + String(Math.round(min % 60)).padStart(2, "0") + " m";
  // Workouts today. With a target of 1, either a Push/Pull/Legs saved here or a cardio session counts.
  // With a target of N (2 or more) it takes one Push/Pull/Legs saved here plus N-1 cardio sessions from

  // their own; their minutes are shown next to the workout saved here.
  const workoutsTarget = () => Math.max(1, Math.round(+S().workoutsTarget) || 1);
  function workoutParts(day) {

    const strength = ses.filter((x) => x.strength), cardio = ses.filter((x) => !x.strength && walkCounts(x));
    const app = day && day.workout && day.workout.saved ? 1 : 0, t = workoutsTarget();
    const count = t === 1 ? Math.min(1, app + cardio.length) : app + Math.min(cardio.length, t - 1);
    return { count, ses, strength, cardio, app };
  }
  // Walks count as cardio only from 1 mile. Without a recorded distance, about 2,000 steps make a mile.
  const walkMiles = (x) => (x.miles != null ? x.miles : x.steps ? x.steps / 2000 : null);
  const walkCounts = (x) => !x.walk || (walkMiles(x) || 0) >= 1;
  function workoutNames(day) {
    const p = workoutParts(day), names = [], t = workoutsTarget();
    if (p.app) names.push(typeName(day.workout.type) + " day" + (p.strength[0] ? " " + p.strength[0].min + " min" : ""));
    p.cardio.forEach((x) => names.push(x.name + " " + (x.walk ? (Math.round(walkMiles(x) * 10) / 10) + " mi" : x.min + " min")));
    if (t > 1 && p.count < t) {
      const cardioLeft = Math.max(0, t - 1 - p.cardio.length);
      const need = (p.app ? [] : ["Push, Pull or Legs"]).concat(cardioLeft ? [cardioLeft > 1 ? cardioLeft + " cardio" : "cardio"] : []);
      if (need.length) names.push("still need " + need.join(" + "));
    }
    return names;
  }
  const workoutRule = () => {
    const t = workoutsTarget();
    return t === 1 ? "Ticks itself when you save Push, Pull or Legs here, or Samsung Health records cardio."
      : t + " workouts means one Push, Pull or Legs saved here plus " + (t - 1) + " cardio session" + (t > 2 ? "s" : "") + " from Samsung Health (runs, rides, swims, sports, hikes, or walks of a mile or more).";
  };
  const METRICS = {
    steps: { label: (st) => (+st.stepsTarget).toLocaleString() + " steps", value: (d) => (d.health ? d.health.steps : null), target: (st) => st.stepsTarget, show: (v, st) => fmt(v) + " / " + fmt(st.stepsTarget) },
    sleep: { label: (st) => "Get " + st.sleepTarget + " hours of sleep", value: (d) => (d.health && d.health.sleepMin != null ? d.health.sleepMin / 60 : null), target: (st) => st.sleepTarget, show: (v) => fmtSleep(v * 60) + " last night" },
    workout: {

      value: (d) => workoutParts(d).count, target: () => workoutsTarget(),

    },
  };
  const taskName = (h) => (METRICS[h.id] ? METRICS[h.id].label(S()) : h.name);
  const AUTO_IDS = ["steps", "sleep"];
  const isLogged = (day) => !!day && (day.kcal != null || day.protein != null || !!day.workout || !!day.weight || Object.values(day.habits || {}).some(Boolean));
  const hasAnyData = () => Object.values(state.days).some(isLogged) || state.goals.updatedAt > 0;
  const docBody = (id) => (id === "settings" ? state.settings : id === "goals" ? state.goals : state.days[id]);

  // ---------- where data lives ----------

  const bridge = window.AndroidBridge || null;

      setSync("ok");

    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user, dl] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("downloads")]);

        }

        else if (/^\d{4}-\d\d-\d\d$/.test(doc.id) && !busy) state.days[doc.id] = normalizeDay(doc.data());
      });

        first = false;
        // Move anything saved in this browser before the account store existed.
        if (!gotSettings) save("settings", { keepStamp: true });
        if (!gotGoals) save("goals", { keepStamp: true });
        const remote = new Set(snap.docs.map((d) => d.id));
        Object.keys(state.days).forEach((d) => { if (!remote.has(d) && isLogged(state.days[d])) save(d, { keepStamp: true }); });
      }

      setupReady = true;
      persistLocal();
      render();
    }, () => { setupReady = true; setSync("err"); render(); });
  }

  // ---------- backup & restore ----------
  const exportData = () => JSON.stringify({ app: "100-days-hard", format: 1, exportedAt: new Date().toISOString(), settings: state.settings, goals: state.goals, days: state.days });
  const backupName = () => "100-days-hard-backup-" + todayISO() + ".json";

  let backupTimer = null, lastFileBackup = 0;

  }

    try { return JSON.parse(bridge.backupInfo() || "{}"); } catch (e) { return {}; }
  }

  function restoreFrom(text) {
    let b;

    if (!b || b.app !== "100-days-hard" || typeof b.days !== "object") { toast("That file isn't a 100 Days Hard backup"); return; }
    let restored = 0;
    if (b.settings && (!S().updatedAt || (b.settings.updatedAt || 0) > S().updatedAt)) {
      state.settings = { ...defaultSettings(), ...b.settings };
      save("settings", { keepStamp: true });
    }
    if (b.goals && Array.isArray(b.goals.list) && (b.goals.updatedAt || 0) > (state.goals.updatedAt || 0)) {
      state.goals = b.goals;
      save("goals", { keepStamp: true });
      restored++;
    }
    // Merge: keep whichever copy of each day was changed most recently.
    Object.keys(b.days).forEach((d) => {
      if (!/^\d{4}-\d\d-\d\d$/.test(d)) return;
      const incoming = normalizeDay(b.days[d]);
      const local = state.days[d];
      if (!isLogged(incoming)) return;
      if (!local || !isLogged(local) || (incoming.updatedAt || 0) > (local.updatedAt || 0)) {
        state.days[d] = incoming;
        save(d, { keepStamp: true });
        restored++;
      }
    });

  }

    if (bridge) { stampExport(); bridge.shareBackup(exportData()); return; }
    if (isWebApp) {

        const file = new File([data], backupName(), { type: "application/json" });

      return;
    }
    if (!downloads) return;
    try {
      await downloads.save({ filename: backupName(), data: exportData() });
      stampExport();
      toast("Backup saved");
    } catch (e) {
      if (e && e.code !== "declined") toast("Couldn't save the backup here. Try again from the Claude app or claude.ai.");
    }
  }

  // ---------- Samsung Health via Health Connect (installed app only) ----------
  let health = bridge && bridge.healthStatus ? bridge.healthStatus() : "unavailable"; // granted | not_granted | denied | unavailable
  let healthSyncedAt = 0, healthBusy = false;

    if (health !== "granted" || healthBusy) return;

    bridge.healthSync(from, t);

    healthSyncedAt = Date.now();
    Object.keys(res.days || {}).forEach((d) => {
      const h = res.days[d];
      const day = peekDay(d);
      let changed = false;
      const next = { ...day };
      if (day.kcalSrc !== "manual" && h.kcal != null) {
        const k = Math.round(h.kcal), p = h.protein != null ? Math.round(h.protein) : day.protein;
        if (k !== day.kcal || p !== day.protein) { next.kcal = k; next.protein = p; next.kcalSrc = "health"; changed = true; }

      if (!day.weight && h.weightKg) {

      }
      const hv = { ...(day.health || {}) };
      let hc = false;
      ["steps", "sleepMin", "bodyFat", "restHr", "hrv", "vo2", "sleepHr", "spo2", "bmr", "deepMin", "remMin", "lightMin", "burned", "active"].forEach((k) => { if (h[k] != null && h[k] !== hv[k]) { hv[k] = h[k]; hc = true; } });
      if (h.sessions && JSON.stringify(h.sessions) !== JSON.stringify(hv.sessions || [])) { hv.sessions = h.sessions; hc = true; }

    render();
  };

  // Tick steps, sleep and workouts when the number reaches the target. A tick the app made itself comes off again
  // if the number drops below the target (say the target goes up); a tick you made by hand always stays.
  function autoMetricHabits(day, date) {

      const m = METRICS[t.id];
      if (!m) return;

  // ---------- rendering ----------
  const main = document.getElementById("main");
  let deferred = false;

  function buzz(kind) {

  let foodAnim = null;
  const totNums = (v) => '<span class="tot-num num' + (v === "" ? " empty" : "") + '" aria-hidden="true">' + (v === "" ? "0" : esc(v)) + '</span><span class="tot-num on num" aria-hidden="true">' + esc(v) + "</span>";
  function foodBoxes(day) {
    const sh = foodShown[viewDate] || { kcal: day.kcal ?? null, protein: day.protein ?? null };
    const f = foodFill(sh), lose = calAim() === "lose", k = day.kcal ?? "", p = day.protein ?? "";
    const showK = sh.kcal == null ? "" : String(Math.round(sh.kcal)), showP = sh.protein == null ? "" : String(Math.round(sh.protein));
    return '<div class="totals">' +
      '<label class="tot" for="in-kcal"><span class="tot-head"><span>Calories</span><span class="num">' + (lose ? fmt(calRange()[0]) + "–" + fmt(calRange()[1]) : "of " + fmt(S().calorieGoal)) + "</span></span>" +
        '<span class="tot-box" id="kcal-box" data-s="' + f.kState + '" style="--p:' + f.kcal.toFixed(3) + ";--b:" + f.kBright.toFixed(3) + ";--g:" + f.kGreen.toFixed(3) + '"><i class="tot-fill"></i>' + totNums(showK) +
        '<input class="big-input num" id="in-kcal" type="number" inputmode="numeric" min="0" max="20000" placeholder="0" value="' + k + '"></span></label>' +
      '<label class="tot" for="in-protein"><span class="tot-head"><span>Protein</span><span class="num">of ' + fmt(S().proteinGoal) + " g</span></span>" +
        '<span class="tot-box pro" id="protein-box" style="--p:' + f.protein.toFixed(3) + ";--b:" + f.protein.toFixed(3) + '"><i class="tot-fill"></i>' + totNums(showP) +
        '<input class="big-input num" id="in-protein" type="number" inputmode="numeric" min="0" max="1000" placeholder="0" value="' + p + '"></span></label>' +
      "</div>";
  }

  // Paint the bars for some values, straight onto the page (no redraw).
  function paintFood(v) {
    const kb = document.getElementById("kcal-box"), pb = document.getElementById("protein-box");
    if (!kb || !pb) return;
    const f = foodFill(v);
    const set = (box, p, val, bright) => {
      box.style.setProperty("--p", p.toFixed(4)); box.style.setProperty("--b", bright.toFixed(3));
      const n = box.querySelectorAll(".tot-num"), txt = val == null ? "" : String(Math.round(val));
      n[0].textContent = txt || "0"; n[0].classList.toggle("empty", !txt); n[1].textContent = txt;
    };
    set(kb, f.kcal, v.kcal, f.kBright); set(pb, f.protein, v.protein, f.protein);
    kb.style.setProperty("--g", f.kGreen.toFixed(3));
    if (kb.dataset.s !== f.kState) kb.dataset.s = f.kState;
  }
  // After a redraw of Today: if the day's totals changed, count up (or down) to them over about 0.7 s,
  // with the bar and its color following the number.
  function animateFood() {
    const d = viewDate, day = peekDay(d), to = { kcal: day.kcal ?? null, protein: day.protein ?? null };
    const from = foodShown[d];
    if (!from || reduceMotion) { foodShown[d] = to; if (from) paintFood(to); return; }
    if (foodAnim && foodAnim.d === d && foodAnim.to.kcal === to.kcal && foodAnim.to.protein === to.protein) return; // already on its way
    if (from.kcal === to.kcal && from.protein === to.protein) return;
    if (foodAnim) cancelAnimationFrame(foodAnim.raf);
    const met = (v) => [v.kcal != null && calStatus(v.kcal).state === "met", v.protein != null && v.protein >= S().proteinGoal];
    const a = { d, to, from: { ...from }, t0: performance.now(), raf: 0, met: met(from) };
    const lerp = (x, y, e) => (x == null && y == null ? null : (x || 0) + ((y || 0) - (x || 0)) * e);
    const frame = (now) => {
      const t = Math.min(1, (now - a.t0) / 700), e = 1 - Math.pow(1 - t, 3);
      const v = t < 1 ? { kcal: lerp(a.from.kcal, a.to.kcal, e), protein: lerp(a.from.protein, a.to.protein, e) } : a.to;
      foodShown[d] = v;
      const m = met(v);
      if ((m[0] && !a.met[0]) || (m[1] && !a.met[1])) buzz("confirm"); // just hit a goal
      a.met = m;
      if (view === "today" && viewDate === d) paintFood(v);
      if (t < 1) a.raf = requestAnimationFrame(frame); else foodAnim = null;
    };
    foodAnim = a;
    a.raf = requestAnimationFrame(frame);
  }

  function sourceHTML(day, isToday) {
    if (health === "granted") {
      if (day.kcalSrc === "manual") return '<div class="source"><span>Typed in by you.</span><button class="linkbtn" data-action="use-health">Use Samsung Health numbers</button></div>';
      return '<div class="source"><span>' + (day.kcalSrc === "health" ? "From Samsung Health" : "Waiting for Samsung Health") + (healthSyncedAt ? " · checked " + fmtTime(healthSyncedAt) : "") + "</span></div>";
    }
    if (health === "not_granted" || health === "denied") return '<div class="source"><button class="linkbtn" data-action="health-connect">Fill these in automatically from Samsung Health</button></div>';
    return isToday ? '<div class="source"><span>Copy the day\'s totals from Samsung Health.</span></div>' : "";
  }

  function renderToday() {
    const t = todayISO();
    const isToday = viewDate === t;
    const day = peekDay(viewDate);
    const n = dayNum(viewDate);
    const unit = S().unit;

    const tasks = tasksFor(viewDate), missing = healthMissing();
    const needsPerm = health !== "unavailable" && bridge && tasks.some((h) => (AUTO_IDS.includes(h.id) && missing.includes(h.id)) || (h.id === "workout" && (missing.includes("workouts") || missing.includes("distance"))));
    const habits = tasks.length
      ? '<div class="list">' + tasks.map((h) => {
          const on = !!(day.habits && day.habits[h.id]);
          const m = METRICS[h.id], v = m ? m.value(day) : null, txt = m && v != null ? m.show(v, S(), day) : "";
          const sub = txt ? '<small class="habit-sub num">' + esc(txt) + "</small>" : "";
          return '<button class="habit' + (on ? " done" : "") + '" data-action="toggle-habit" data-id="' + h.id + '" aria-pressed="' + on + '">' +
            '<span class="check" aria-hidden="true">' + (on ? "✓" : "") + '</span><span class="habit-text"><span class="habit-name">' + esc(taskName(h)) + "</span>" + sub + "</span></button>";
        }).join("") + "</div>" +
        (needsPerm ? '<button class="linkbtn" data-action="health-connect">Let Samsung Health tick steps, sleep and workouts</button>' : "")
      : '<p class="empty">No daily tasks yet. Add them in Settings.</p>';

    const prevW = lastWeightBefore(viewDate);
    const wDelta = day.weight && prevW ? (day.weight - prevW.weight) : null;

    const restoreCard = !hasAnyData()
      ? '<div class="notice"><b>New here, or on a new phone?</b><span class="hint">If you\'ve tracked before, bring your history back from a backup file.</span><div class="btn-row"><button class="btn" data-action="restore">Restore from backup</button></div></div>'
      : "";

    return (
      '<div class="daybar">' +
        '<button class="iconbtn" data-action="prev-day" aria-label="Previous day"' + (n <= 1 ? " disabled" : "") + ">‹</button>" +
        '<span class="label">' + (n >= 1 && n <= TOTAL() ? "Day " + n + " of " + TOTAL() : n < 1 ? "Before the challenge" : "After the challenge") + "</span>" +
        (isToday ? '<button class="iconbtn" aria-label="Next day" disabled>›</button>' : '<button class="iconbtn" data-action="next-day" aria-label="Next day">›</button>') +
      "</div>" +
      (isToday && update ? '<div class="update"><span class="update-text"><b>Version ' + esc(update) + " is ready</b>" + (updateAbout ? "<small>" + esc(updateAbout) + "</small>" : "") + '</span><button class="btn" data-action="get-update">Update</button></div>' : "") +
      (isToday ? finishHTML() : "") +
      (isToday ? offerHTML() || workoutOfferHTML() : "") +
      (isToday ? streakHTML() : "") +
      '<p class="coach">' + coachLine(day, isToday) + "</p>" +
      restoreCard +

      '<section class="panel" aria-labelledby="h-cal">' +
        '<div class="panel-head"><h2 id="h-cal">Food</h2><span class="meta">' + (isToday ? "Today's totals" : "Day totals") + "</span></div>" +
        foodBoxes(day) +
        sourceHTML(day, isToday) +
      "</section>" +

      '<section class="panel" aria-labelledby="h-hab">' +
        '<div class="panel-head"><h2 id="h-hab">Daily tasks</h2><span class="meta num">' + doneOn(viewDate) + " / " + tasks.length + "</span></div>" + habits +
      "</section>" +

      workoutPanel(day) +

      '<section class="panel" aria-labelledby="h-w">' +
        '<div class="panel-head"><h2 id="h-w">Body weight</h2></div>' +
        '<div class="weight-row"><input class="field num" id="weight" type="number" inputmode="decimal" step="0.1" min="0" placeholder="' + (prevW ? prevW.weight : "0.0") + '" value="' + (day.weight ?? "") + '" aria-label="Body weight in ' + unit + '"><span class="hint">' + unit +
        (wDelta !== null ? " · " + (wDelta > 0 ? "+" : "") + wDelta.toFixed(1) + " since day " + dayNum(prevW.date) : prevW && !day.weight ? " · last " + prevW.weight + " on day " + dayNum(prevW.date) : "") + "</span></div>" +
      "</section>"
    );
  }

  // Goals are grouped automatically by name (Strength / Cardio / Body); "Group" in Edit overrides it.
  const GOAL_GROUPS = [["strength", "Strength"], ["cardio", "Cardio"], ["body", "Body"]];
  const groupOf = (g) => g.group || (/weight|fat|muscle|waist|bmi|lean/i.test(g.name) ? "body" : /run|mile|\bmi\b|\bkm\b|5k|10k|bike|biking|cycl|swim|row|cardio|sprint|walk|hike/i.test(g.name) ? "cardio" : "strength");
  let openGoal = null;
  function goalLadder(g) {
    const next = g.steps.findIndex((x) => !x.done), editing = editingGoal === g.id;
    const steps = g.steps.map((x, i) => ({ x, i })).reverse().map(({ x, i }) =>
      '<li><button class="step' + (x.done ? " done" : "") + (i === next ? " next" : "") + '" data-action="toggle-step" data-g="' + g.id + '" data-s="' + x.id + '" aria-pressed="' + x.done + '">' +
        '<span class="mark" aria-hidden="true">' + (x.done ? "✓" : "") + '</span><span class="step-text">' + esc(x.text) + "</span>" +
        (x.done && x.doneDay ? '<span class="step-meta num">Day ' + x.doneDay + "</span>" : "") +
      "</button>" +
      (editing ? '<button class="del" data-action="del-step" data-g="' + g.id + '" data-s="' + x.id + '" aria-label="Remove ' + esc(x.text) + '">×</button>' : "") + "</li>").join("");
    return '<div class="goal-open">' +
      (g.focus && !editing ? '<p class="focus">Focus: <b>' + esc(g.focus) + "</b></p>" : "") +
      (editing ? '<form class="inline" id="step-form-' + g.id + '" data-goal="' + g.id + '"><input class="field" id="step-in-' + g.id + '" placeholder="Add a harder step" maxlength="60" autocomplete="off"><button class="btn" type="submit">Add</button></form>' : "") +
      (g.steps.length ? '<ol class="ladder">' + steps + "</ol>" : '<p class="empty">No steps yet. Add your first one above, starting with the hardest.</p>') +
      (editing ? '<label class="form"><span class="hint">Focus note</span><input class="field" id="focus-' + g.id + '" data-goal="' + g.id + '" value="' + esc(g.focus) + '" placeholder="e.g. Keep elbows close" maxlength="80"></label>' +
        '<div class="form"><span class="hint">Group</span><span class="seg sm" role="group">' + GOAL_GROUPS.map(([k, name]) => '<button data-action="goal-group" data-g="' + g.id + '" data-v="' + k + '" aria-pressed="' + (groupOf(g) === k) + '">' + name + "</button>").join("") + "</span></div>" : "") +
      '<div class="goal-foot"><button class="linkbtn" data-action="edit-goal" data-g="' + g.id + '">' + (editing ? "Done editing" : "Edit") + "</button>" +
      (editing ? '<button class="btn danger" data-action="del-goal" data-g="' + g.id + '">' + (confirmDelete === g.id ? "Tap again to delete" : "Delete goal") + "</button>" : "") + "</div></div>";
  }
  // Three steps of a ladder side by side: the one before (grey), the one you're on (white), and the next one,
  // which you tap to tick. Five are drawn so a tick can slide them one place left (or back, on undo).
  const firstOpen = (g) => { const i = g.steps.findIndex((x) => !x.done); return i < 0 ? g.steps.length : i; };
  const gsRole = (i) => (i < 0 || i > 2 ? "off" : ["prev", "cur", "next"][i]);
  function goalStrip(g) {
    const c = firstOpen(g), n = g.steps.length, slots = [];
    for (let i = -1; i <= 3; i++) {
      const k = c - 2 + i, x = g.steps[k], role = gsRole(i);
      let cls = "", body = "";
      if (x) body = '<span class="mark" aria-hidden="true">' + (x.done ? "✓" : "") + '</span><span class="gs-t">' + esc(x.text) + "</span>";
      else if (k === n) { cls = " fin"; body = '<span class="mark" aria-hidden="true">✓</span><span class="gs-t">All done</span>'; }
      else if (k === -1) { cls = " start"; body = '<span class="gs-t">Start</span>'; }
      else cls = " blank";
      const tag = x && !x.done && i === 2 ? "button" : "span";
      slots.push("<" + tag + ' class="gs ' + (role === "off" ? (i < 0 ? "prev" : "next") + " off" : role) + cls + '" data-i="' + i + '" style="--i:' + i + '"' +
        (tag === "button" ? ' data-action="goal-tick" data-g="' + g.id + '" data-s="' + x.id + '" aria-label="Tick ' + esc(x.text) + '"' : ' aria-hidden="' + (role === "off") + '"') + ">" + body + "</" + tag + ">");
    }
    return '<div class="gstrip" id="gs-' + g.id + '">' + slots.join("") + "</div>";
  }
  // Slide a goal's strip one place: dir 1 after a tick, -1 after an undo. The next render draws the same end state.
  function slideStrip(g, dir) {
    const el = document.getElementById("gs-" + g.id);
    if (!el) return false;
    el.querySelectorAll(".gs").forEach((sl) => {
      const i = +sl.dataset.i - dir, role = gsRole(i);
      sl.dataset.i = i; sl.style.setProperty("--i", i);
      ["prev", "cur", "next", "off"].forEach((r) => sl.classList.remove(r));
      sl.classList.add(role === "off" ? (i < 0 ? "prev" : "next") : role);
      if (role === "off") sl.classList.add("off");
      const m = sl.querySelector(".mark");
      if (m && !sl.classList.contains("fin")) m.textContent = i <= 1 ? "✓" : "";
    });
    const bar = el.parentNode.querySelector(".goal-bar i"), n = g.steps.length;
    if (bar && n) bar.style.transform = "scaleX(" + (g.steps.filter((x) => x.done).length / n).toFixed(3) + ")";
    return true;
  }
  function goalRow(g) {
    const done = g.steps.filter((x) => x.done).length, n = g.steps.length, open = openGoal === g.id;
    const pct = n ? done / n : 0;
    return '<div class="goal' + (open ? " open" : "") + '"><div class="goal-row" data-action="open-goal" data-g="' + g.id + '">' +
      '<button class="goal-head" data-action="open-goal" data-g="' + g.id + '" aria-expanded="' + open + '"><span class="goal-name">' + esc(g.name) + "</span>" +
      '<span class="goal-count num">' + done + "/" + n + '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></button>' +
      (n ? goalStrip(g) : '<span class="goal-next">No steps yet</span>') +
      '<span class="goal-bar" role="img" aria-label="' + Math.round(pct * 100) + '% of steps reached"><i style="transform:scaleX(' + pct.toFixed(3) + ')"></i></span></div>' +
      (open ? goalLadder(g) : "") + "</div>";
  }
  let newGoalOpen = false;
  function renderGoals() {
    const list = state.goals.list;
    const total = list.reduce((a, g) => a + g.steps.length, 0);
    const reached = list.reduce((a, g) => a + g.steps.filter((x) => x.done).length, 0);
    const allDone = (g) => g.steps.length > 0 && g.steps.every((x) => x.done);
    const groups = GOAL_GROUPS.map(([k, name]) => {
      const gs = list.filter((g) => groupOf(g) === k).sort((a, b) => allDone(a) - allDone(b));
      if (!gs.length) return "";
      const d = gs.reduce((a, g) => a + g.steps.filter((x) => x.done).length, 0), t = gs.reduce((a, g) => a + g.steps.length, 0);
      return '<div class="goal-group-head"><span>' + name + '</span><span class="num">' + d + " / " + t + "</span></div>" + '<div class="goal-list">' + gs.map(goalRow).join("") + "</div>";
    }).join("");
    const templates = GOAL_TEMPLATES.filter(([name]) => !list.some((g) => g.name.toLowerCase() === name.toLowerCase()));
    const adder = (templates.length ? '<div class="pick">' + templates.map(([name]) => '<button data-action="add-template" data-name="' + esc(name) + '">+ ' + esc(name) + "</button>").join("") + "</div>" : "") +
      '<form class="inline" id="goal-form"><input class="field" id="new-goal" placeholder="e.g. Plank, bench press" maxlength="40" autocomplete="off"><button class="btn" type="submit">Add</button></form>';
    return '<section class="panel" aria-labelledby="h-gl"><div class="panel-head"><h2 id="h-gl">Goals</h2>' + (list.length ? '<span class="meta num">' + reached + " / " + total + " steps</span>" : "") + "</div>" +
      (list.length
        ? '<span class="goal-bar big" role="img" aria-label="' + Math.round(total ? (reached / total) * 100 : 0) + '% of all steps"><i style="transform:scaleX(' + (total ? reached / total : 0).toFixed(3) + ')"></i></span>' + groups +
          (newGoalOpen ? '<div class="goal-new">' + adder + "</div>" : "") +
          '<button class="linkbtn" data-action="new-goal-toggle">' + (newGoalOpen ? "Close" : "+ New goal") + "</button>"
        : '<p class="coach">Set goals as ladders: small steps up to something hard, like 10 push-ups in one go, then 20, then 50. Start from an idea below or make your own.</p>' + adder) +
      "</section>";
  }
  const findGoal = (id) => state.goals.list.find((g) => g.id === id);

  // One-time card for people who set up before steps and sleep could tick themselves.
  function offerHTML() {
    if (S().autoOffered || !bridge || health === "unavailable" || !S().setupDone) return "";
    const add = AUTO_IDS.filter((id) => !S().habits.some((h) => h.id === id));
    if (!add.length) return "";
    const names = add.map((id) => "<b>" + esc(METRICS[id].label(S())) + "</b>");
    return '<div class="notice"><b>New: tasks that tick themselves</b><span class="hint">Samsung Health can tick ' + names.join(" and ") + ' for you. They start counting today, so your streak is safe.</span>' +
      '<div class="btn-row"><button class="btn" data-action="offer-add">Add them</button><button class="btn secondary" data-action="offer-skip">No thanks</button></div></div>';
  }

  // One-time card: Samsung Health workouts now count toward the workout task.
  let woChoice = null;
  function workoutOfferHTML() {
    if (S().workoutOffered || !bridge || health === "unavailable" || !S().setupDone || !S().habits.some((h) => h.id === "workout")) return "";
    const n = woChoice || workoutsTarget();
    return '<div class="notice"><b>Workouts from Samsung Health now count</b><span class="hint">Cardio from Samsung Health (runs, rides, swims, sports, hikes, walks of a mile or more) now counts toward your workout task, alongside the Push, Pull or Legs you save here. With 2 a day, you need one of each. How many workouts a day?</span>' +
      '<div class="pick">' + [1, 2, 3].map((v) => '<button data-action="wo-n" data-v="' + v + '" aria-pressed="' + (n === v) + '">' + v + " a day</button>").join("") + "</div>" +
      '<div class="btn-row"><button class="btn" data-action="wo-on">Turn on</button><button class="btn secondary" data-action="wo-skip">No thanks</button></div></div>';
  }

  // ---------- end of the challenge ----------
  function roundStats() {
    const N = TOTAL(), start = S().startDate, end = addDays(start, N - 1);
    let perfect = 0, workouts = 0, best = 0, run = 0;
    for (let i = 0; i < N; i++) {
      const d = addDays(start, i);
      if (fullOn(d)) { perfect++; run++; best = Math.max(best, run); } else run = 0;
      const w = state.days[d] && state.days[d].workout;
      if (w && w.saved) workouts++;
    }
    const ws = Object.keys(state.days).filter((d) => d >= start && d <= end && state.days[d].weight).sort();
    const wChange = ws.length > 1 ? state.days[ws[ws.length - 1]].weight - state.days[ws[0]].weight : null;
    let top = null;
    strengthData().forEach((m) => {
      const pts = m.pts.filter((p) => p.date >= start && p.date <= end);
      if (pts.length < 2 || !(pts[0].score > 0)) return;
      const g = ((pts[pts.length - 1].score - pts[0].score) / pts[0].score) * 100;
      if (!top || g > top.g) top = { name: m.name, g };
    });
    return { N, perfect, workouts, best, wChange, top };
  }
  function finishHTML() {
    const t = todayISO(), n = dayNum(t), N = TOTAL();
    if (!(n > N || (n === N && fullOn(t))) || S().finishDismissed === S().startDate) return "";
    const st = roundStats();
    const facts = [
      ["Perfect days", st.perfect + " / " + N],
      ["Best streak", st.best + (st.best === 1 ? " day" : " days")],
      ["Workouts", st.workouts],
    ];
    if (st.wChange != null) facts.push(["Body weight", (st.wChange > 0 ? "+" : "") + (Math.round(st.wChange * 10) / 10) + " " + S().unit]);
    if (st.top && st.top.g > 0) facts.push(["Biggest gain", esc(st.top.name) + " +" + st.top.g.toFixed(0) + "%"]);
    return '<section class="finish" aria-labelledby="h-fin"><span class="eyebrow">Challenge complete</span><h2 id="h-fin">' + N + " days. Done.</h2>" +
      '<dl class="finish-facts">' + facts.map(([k, v]) => "<div><dt>" + k + '</dt><dd class="num">' + v + "</dd></div>").join("") + "</dl>" +
      '<div class="btn-row"><button class="btn" data-action="new-round">Start another round</button><button class="btn secondary" data-action="finish-dismiss">Not now</button></div></section>';
  }
  function openNewRound() {
    openSheet('<h2>Start another round</h2><p class="hint">Today becomes day 1. Your history, tasks, goals and workouts all stay.</p>' +
      '<div class="pick" id="round-len">' + [30, 75, 100].map((v) => '<button data-action="round-len" data-v="' + v + '" aria-pressed="' + (TOTAL() === v) + '">' + v + " days</button>").join("") + "</div>" +
      '<label class="form"><span class="hint">Or any number of days</span><input class="field num" id="round-custom" type="number" inputmode="numeric" min="1" max="1000" value="' + TOTAL() + '"></label>' +
      '<button class="btn wide" data-action="round-start">Start day 1</button>', null);
  }

  function lastWeightBefore(d) {
    const keys = Object.keys(state.days).filter((k) => k < d && state.days[k].weight).sort();
    const k = keys[keys.length - 1];
    return k ? { date: k, weight: state.days[k].weight } : null;
  }

  function renderProgress() {
    const t = todayISO(), tn = dayNum(t), N = TOTAL();
    let complete = 0, kcalSum = 0, kcalDays = 0, streak = 0;
    const cells = [];

  // One upbeat line over the chart: what you've gained, or your best to aim for.
  function strengthNote(m, bw, unit) {
    const all = m.pts, first = all[0], last = all[all.length - 1];
    const best = all.reduce((b, p) => (p.score > b.score ? p : b), first);
    const u = bw ? " reps" : " " + unit, gain = Math.round(last.score - first.score);
    const what = bw ? "reps" : "est. 1RM";
    let msg;
    if (all.length === 1) msg = "First one logged. Beat <b>" + Math.round(last.score) + u + "</b> next time.";
    else if (last.score >= best.score && gain > 0) msg = "<b>Best yet.</b> Up <b>" + gain + u + "</b> since day " + first.n + ".";
    else if (gain > 0) msg = "Up <b>" + gain + u + "</b> since day " + first.n + ". Best: " + Math.round(best.score) + u + ".";
    else msg = "Your best is <b>" + Math.round(best.score) + u + "</b> (day " + best.n + "). Go get it.";
    return '<p class="str-note"><span class="str-what">' + what + "</span>" + msg + "</p>";
  }
  function strengthChart(m) {
    const pts = m.pts.slice(-10), unit = S().unit, bw = pts.every((p) => p.w === 0);
    const W = 340, H = 180, L = 36, R = 16, T = 30, B = 22, pw = W - L - R, ph = H - T - B;
    const ys = pts.map((p) => p.score);
    // Round grid lines (50, 60, 70) instead of odd decimals.
    const dataLo = Math.min(...ys), dataHi = Math.max(...ys), span = Math.max(dataHi - dataLo, dataHi * 0.08, 2);
    const step = [1, 2, 5, 10, 20, 25, 50, 100].find((k) => span / k <= 3) || 100;
    const lo = Math.max(0, Math.floor((dataLo - span * 0.1) / step) * step), hi = Math.ceil((dataHi + span * 0.1) / step) * step;
    const x = (i) => L + (pts.length === 1 ? pw / 2 : (i / (pts.length - 1)) * pw);
    const y = (v) => T + ph * (1 - (v - lo) / (hi - lo));
    let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(m.name) + ' strength by session">';
    for (let v = lo; v <= hi + 0.001; v += step) s += '<line class="gridl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="num" x="' + (L - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + v + "</text>";
    // Line, dots and shading share one color per stretch: green going up or holding, red going down.
    const dir = (i) => (pts[i].score >= pts[i - 1].score * 0.9995 ? "up" : "down");
    const dotDir = (i) => (pts.length < 2 ? "up" : dir(Math.max(1, i)));
    if (pts.length > 1) {
      // Shade under the line: green where it rises or holds, red where it drops. Neighbouring segments
      // of the same color share one shape, so no seams show between them.
      const base = (T + ph).toFixed(1), top = Math.min(...ys.map(y)).toFixed(1);
      const grad = (k) => '<linearGradient id="sg-' + k + '" class="g-' + k + '" gradientUnits="userSpaceOnUse" x1="0" y1="' + top + '" x2="0" y2="' + base + '"><stop offset="0" stop-opacity="0.45"/><stop offset="1" stop-opacity="0.05"/></linearGradient>';
      s += "<defs>" + grad("up") + grad("down") + "</defs>";
      let lines = "";
      for (let i = 1; i < pts.length; ) {
        const k = dir(i), a = i - 1;
        while (i < pts.length && dir(i) === k) i++;
        const run = pts.slice(a, i).map((p, j) => x(a + j).toFixed(1) + "," + y(p.score).toFixed(1));
        s += '<polygon fill="url(#sg-' + k + ')" points="' + x(a).toFixed(1) + "," + base + " " + run.join(" ") + " " + x(i - 1).toFixed(1) + "," + base + '"/>';
        lines += '<polyline class="sline ' + k + '" points="' + run.join(" ") + '"/>';
      }
      s += lines;
    }
    pts.forEach((p, i) => {
      const cx = x(i).toFixed(1), cy = y(p.score);
      s += '<circle class="sdot ' + dotDir(i) + '" cx="' + cx + '" cy="' + cy.toFixed(1) + '" r="4"><title>Day ' + p.n + ": " + (p.w ? fmtW(p.w) + " " + unit + " × " : "") + p.r + " reps</title></circle>";
      if (pts.length <= 7 || i === 0 || i === pts.length - 1) {
        const anchor = i === 0 && pts.length > 1 ? "start" : i === pts.length - 1 && pts.length > 1 ? "end" : "middle";
        s += '<text class="slabel num" x="' + cx + '" y="' + (cy - 16).toFixed(1) + '" text-anchor="' + anchor + '">' + (bw ? p.r : fmtW(p.w)) + "</text>";
        s += '<text class="sreps num" x="' + cx + '" y="' + (cy - 7).toFixed(1) + '" text-anchor="' + anchor + '">' + (bw ? "reps" : "×" + p.r) + "</text>";
        s += '<text class="num" x="' + cx + '" y="' + (H - 6) + '" text-anchor="' + anchor + '">day ' + p.n + "</text>";
      }
    });
    s += "</svg>";
    const rows = m.pts.slice(-6).map((p, i, arr) => {
      const idx = m.pts.length - arr.length + i;
      const c = idx > 0 && m.pts[idx - 1].score > 0 ? ((p.score - m.pts[idx - 1].score) / m.pts[idx - 1].score) * 100 : null;
      return '<li><span>Day ' + p.n + " · " + (Object.keys(m.types).length > 1 ? typeName(p.t) + " · " : "") + (p.w ? fmtW(p.w) + " " + unit + " × " + p.r : p.r + " reps") + " · " + p.s + ' sets</span><span class="r num">' + (bw ? "" : "est. " + Math.round(p.score) + " ") + '<span class="chg ' + chgClass(c) + '">' + (c == null ? "First" : chgText(c)) + "</span></span></li>";
    }).reverse().join("");
    return '<div class="tick-detail" data-action="str-sel" data-k="' + esc(m.k) + '">' + strengthNote(m, bw, unit) + s + '<ul class="sessions">' + rows + "</ul></div>";
  }

  function renderStrength() {
    if (strType === undefined) { const last = lastSession(); strType = last && TYPES.some((t) => t.id === last.workout.type) ? last.workout.type : "push"; }
    const all = strengthData();
    const list = all.filter((m) => m.types[strType] != null).sort((a, b) => a.types[strType] - b.types[strType]);
    const changes = list.map((m) => pctChange(m.pts)).filter((c) => c != null);
    const avg = changes.length ? changes.reduce((a, c) => a + c, 0) / changes.length : null;
    const unit = S().unit;
    const rows = list.map((m) => {
      const last = m.pts[m.pts.length - 1], c = pctChange(m.pts), cls = chgClass(c), open = strSel === m.k;
      const also = Object.keys(m.types).filter((t) => t !== strType).map(typeName);
      const row = '<button class="tick" data-action="str-sel" data-k="' + esc(m.k) + '" aria-expanded="' + open + '">' +

        sparkline(m.pts, cls) +
        '<span class="tick-val num">' + (last.w > 0 ? fmtW(last.rawW) + " " + last.rawU : last.r + " reps") + "<small>" + (last.w > 0 ? "× " + last.r + " · " : "") + last.s + (last.s === 1 ? " set" : " sets") + "</small></span>" +

      return open ? '<div class="tick-focus ' + (cls === "down" ? "down" : "up") + '">' + row + strengthChart(m) + "</div>" : row;
    }).join("");
    const summary = avg == null ? "" : '<p class="hint">' + typeName(strType) + " strength is <b class=\"num\">" + (Math.abs(avg) < 0.05 ? "flat" : (avg > 0 ? "up " : "down ") + Math.abs(avg).toFixed(1) + "%") + "</b> since last " + typeName(strType).toLowerCase() + " day, across " + changes.length + " exercise" + (changes.length === 1 ? "" : "s") + ".</p>";
    return '<section class="panel" aria-labelledby="h-st"><div class="panel-head"><h2 id="h-st">Strength</h2>' +
      '<span class="seg sm" role="group" aria-label="Workout type">' + TYPES.map((t) => '<button data-action="str-type" data-type="' + t.id + '" aria-pressed="' + (strType === t.id) + '">' + t.name + "</button>").join("") + "</span></div>" +
      (!strType ? '<p class="hint">Tap Push, Pull or Legs to see each exercise.</p>'
        : summary + (list.length ? '<div class="tickers">' + rows + "</div>" : '<p class="empty">Save a ' + typeName(strType).toLowerCase() + " workout on the Today tab and its exercises show up here, with whether each one is going up or down.</p>")) +
    "</section>";
  }

  function backupSection() {
    let status, dot, buttons = "", how = "";
    if (mode === "apk") {
      const info = apkBackupInfo();
      const at = info.at || lastFileBackup;
      dot = at ? "ok" : "";
      status = at
        ? "Automatic backup is on. Every change is copied to <b>" + esc(info.path || "Download/100 Days Hard") + "</b> on this phone. Last copied " + fmtWhen(at) + "."
        : "Automatic backup is on. A backup file appears in <b>Download/100 Days Hard</b> as soon as you log something.";

      how = "<ol class=\"steps\"><li>The backup file updates by itself and stays on your phone even if you uninstall the app.</li><li>Once a week or so, tap <b>Send a copy</b> and pick Google Drive, so your history is safe if you lose the phone.</li><li>On a new phone or after reinstalling, tap <b>Restore from file</b> and pick the newest backup.</li></ol>";

      dot = sync === "ok" ? "ok" : sync === "err" ? "err" : "";
      status = sync === "err"

      const bk = backupState();
      dot = bk ? (bk.level === "ok" ? "ok" : bk.level === "bad" ? "err" : "") : "";

      buttons = '<button class="btn" data-action="save-backup">Save a backup file</button><button class="btn secondary" data-action="restore">Restore from file</button>';
      how = '<p class="hint">On iPhone, choose <b>Save to Files</b> and keep it in iCloud Drive.</p>';

      '<div class="sync"><span class="dot ' + dot + '"></span><span>' + status + "</span></div>" +

  // ---------- exercise sheet ----------
  const sheet = document.getElementById("sheet"), backdrop = document.getElementById("backdrop");
  function openSheet(html, focusId) {
    sheet.innerHTML = '<div class="sheet-inner"><div class="grab"></div>' + html + "</div>";
    sheet.hidden = backdrop.hidden = false;
    const f = focusId && document.getElementById(focusId);
    if (f) setTimeout(() => f.focus(), 60);
  }
  function closeSheet() { sheet.hidden = backdrop.hidden = true; sheet.innerHTML = ""; sheet.classList.remove("tall", "typing"); }

  // ---------- keyboard ----------
  // When the keyboard opens, the installed app's page gets shorter (on iPhone, the visual viewport does). While you
  // type in the workout sheet, the Save bar steps aside and the sheet scrolls so the whole card you're in (for a new
  // exercise: name, weight, reps and the Add button) sits just above the keyboard.
  let kbWidth = 0, kbFull = 0, fitT = null;
  const viewH = () => (window.visualViewport ? visualViewport.height : innerHeight);
  function fitTyping() {
    const a = document.activeElement;
    if (sheet.hidden || !a || a.tagName !== "INPUT" || !sheet.contains(a)) return;
    const card = a.closest(".ex") || a, vv = window.visualViewport, sr = sheet.getBoundingClientRect();
    const top = Math.max(sr.top, vv ? vv.offsetTop : 0) + 12, bot = Math.min(sr.bottom, vv ? vv.offsetTop + vv.height : innerHeight) - 12;
    const r = card.getBoundingClientRect(), f = a.getBoundingClientRect();
    let d = r.bottom > bot ? r.bottom - bot : r.top < top ? r.top - top : 0;
    d = Math.max(Math.min(d, f.top - top), f.bottom - bot); // the box you're typing in always stays in view
    if (Math.abs(d) > 2) sheet.scrollTo({ top: sheet.scrollTop + d, behavior: reduceMotion ? "auto" : "smooth" });
  }
  function onViewport() {
    const h = viewH();
    if (innerWidth !== kbWidth) { kbWidth = innerWidth; kbFull = h; }
    kbFull = Math.max(kbFull, h);
    const a = document.activeElement, typing = !!a && a.tagName === "INPUT" && kbFull - h > 120;
    document.body.classList.toggle("kb", typing);
    sheet.classList.toggle("typing", typing && sheet.contains(a));
    fitTyping();
    clearTimeout(fitT); fitT = setTimeout(fitTyping, 300); // again once the keyboard has settled
  }
  window.addEventListener("resize", onViewport);
  if (window.visualViewport) visualViewport.addEventListener("resize", onViewport);
  document.addEventListener("focusin", () => setTimeout(onViewport, 60));
  document.addEventListener("focusout", () => setTimeout(onViewport, 60));

  // ---------- workouts: Push / Pull / Legs ----------
  const TYPES = [{ id: "push", name: "Push" }, { id: "pull", name: "Pull" }, { id: "legs", name: "Legs" }];
  const typeName = (t) => (TYPES.find((x) => x.id === t) || { name: "Workout" }).name;
  const exKey = (name) => String(name).trim().toLowerCase();
  const isCable = (name) => /cable/i.test(name);
  const toUnit = (w, from, to) => (from === to ? w : from === "kg" ? w * KG_TO_LB : w / KG_TO_LB);
  const half = (n) => Math.round(n * 2) / 2;
  const fmtW = (n) => (Math.round(n * 10) / 10).toLocaleString();
  const stepFor = (unit) => (unit === "kg" ? 2.5 : 5);
  // Estimated one-rep max (Epley). Lets 50 x 7 be compared fairly with 45 x 12.
  const e1rm = (w, r) => (w > 0 ? w * (1 + r / 30) : r);

  // Every set is kept in setList. weight/reps/sets mirror the best set (and the count), so the strength
  // chart, "last time" and summaries keep working. Older workouts get one entry per set they recorded.
  function ensureSets(e) {
    if (!Array.isArray(e.setList) || !e.setList.length) e.setList = Array.from({ length: Math.max(1, Math.round(+e.sets) || 1) }, () => ({ w: +e.weight || 0, r: +e.reps || 0 }));
    return e.setList;
  }
  function syncEx(e) {
    const l = ensureSets(e);
    let best = l[0];
    l.forEach((x) => { if (e1rm(x.w, x.r) > e1rm(best.w, best.r)) best = x; });
    e.weight = best.w; e.reps = best.r; e.sets = l.length;
  }
  const setsText = (e) => { const l = ensureSets(e); return l.map((x) => (x.w > 0 ? fmtW(x.w) : "") + "×" + x.r).join(", ") + (l.some((x) => x.w > 0) ? " " + e.unit : ""); };
  const curSet = {}; // exercise id -> index of the set being edited (not saved)
  const curIdx = (e) => Math.min(curSet[e.id] || 0, ensureSets(e).length - 1);
  function savedSessions(type, before) {
    return Object.keys(state.days).sort().filter((d) => (!before || d < before) && state.days[d].workout && state.days[d].workout.saved && (!type || state.days[d].workout.type === type));
  }
  function lastSession(type, before) {
    const k = savedSessions(type, before).pop();
    return k ? { date: k, workout: state.days[k].workout } : null;
  }
  function lastExercise(name, before) {
    const ds = savedSessions(null, before);
    for (let i = ds.length - 1; i >= 0; i--) {
      const e = state.days[ds[i]].workout.exercises.find((x) => exKey(x.name) === exKey(name));
      if (e) return { date: ds[i], e };
    }
    return null;
  }


  function workoutPanel(day) {
    const w = day.workout;
    if (!w) return "";
    const list = w.exercises.length
      ? '<ul class="list">' + w.exercises.map((e) =>
          '<li class="row"><div class="row-main"><div class="row-title">' + esc(e.name) + '</div><div class="row-sub num">' + e.sets + (e.sets === 1 ? " set: " : " sets: ") + esc(setsText(e)) + "</div></div>" +
          '<div class="row-val num">' + (e.weight > 0 ? fmtW(e.weight) + " " + e.unit : "Bodyweight") + "</div></li>").join("") + "</ul>"
      : '<p class="empty">No exercises yet.</p>';
    const body = list + '<button class="btn wide' + (w.saved ? " secondary" : "") + '" data-action="open-workout">' + (w.saved ? "Edit workout" : "Continue workout") + "</button>";
    const status = '<span class="w-status ' + (w.saved ? "saved" : "draft") + '">' + (w.saved ? "Saved" : "In progress") + "</span>";
    return '<section class="panel" aria-labelledby="h-ex"><div class="panel-head"><h2 id="h-ex">' + typeName(w.type) + " day</h2>" + status + "</div>" + body + "</section>";
  }

  // The + in the corner of Today. With no workout on the day it opens Push / Pull / Legs; otherwise it opens that workout.
  const fabWrap = document.getElementById("fab-wrap"), fabBtn = document.getElementById("fab");
