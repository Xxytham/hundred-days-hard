<title>100 Days Hard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14181D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Header with a weight-plate day counter in the corner,
   stacked sections per tab, fixed bottom tab bar. Colors borrow from bumper plates
   (25 kg red, 20 kg blue, 15 kg yellow, 10 kg green). */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --sunk: #E2E6EB;
  --ink: #14181D;
  --muted: #5B6570;
  --line: #D2D8DF;
  --red: #CF2539;
  --blue: #1D5BB8;
  --yellow: #E1A006;
  --green: #2A8653;
  --on-color: #FFFFFF;
  --backdrop: rgba(20, 24, 29, 0.45);
  --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
  --radius: 14px;
  /* Motion: short, small, only on a tap, and only transform/opacity (see CLAUDE.md, Design) */
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t: 200ms;
  --fade-floor: 85%; /* how dim a food bar starts; it brightens to full color at the goal */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1215; --surface: #191E24; --sunk: #232A31; --ink: #E8ECF0; --muted: #96A0AB;
    --line: #2B333C; --red: #FF5263; --blue: #5E9CFF; --yellow: #FFC23A; --green: #4CC489;
    --on-color: #0F1215; --backdrop: rgba(0, 0, 0, 0.6); color-scheme: dark; --fade-floor: 55%;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1215; --surface: #191E24; --sunk: #232A31; --ink: #E8ECF0; --muted: #96A0AB;
  --line: #2B333C; --red: #FF5263; --blue: #5E9CFF; --yellow: #FFC23A; --green: #4CC489;
  --on-color: #0F1215; --backdrop: rgba(0, 0, 0, 0.6); color-scheme: dark; --fade-floor: 55%;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
  -webkit-tap-highlight-color: transparent;
  /* An app, not a page: no text selection or long-press menus, except where you type */
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
input, textarea, .share-link { -webkit-user-select: text; user-select: text; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
#main { width: 100%; min-width: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top-text { min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; margin: 2px 0 0; letter-spacing: 0.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; margin: 0; letter-spacing: 0.02em; text-transform: uppercase; }
/* Day counter: a gauge with a gap at the bottom where the settings gear sits */
.plate { flex: none; width: 64px; height: 64px; border: 0; padding: 0; background: none; border-radius: 50%; }
.gauge { width: 100%; height: 100%; display: block; overflow: visible; }
.g-track, .g-fill { fill: none; stroke-width: 4; stroke-linecap: round; }
.g-track { stroke: var(--sunk); }
.g-fill { stroke: var(--red); }
.g-day { font-family: var(--font-display); font-weight: 800; font-size: 22px; fill: var(--ink); }
.g-of { font-family: var(--font-body); font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; fill: var(--muted); }
.g-gear { fill: var(--muted); transition: fill 0.15s ease; }
.plate:hover .g-gear, .plate:focus-visible .g-gear { fill: var(--ink); }
.setup-hero .plate { width: 96px; height: 96px; }

.coach { font-size: 14px; color: var(--muted); margin: 0; }
.coach strong { color: var(--ink); font-weight: 600; }

/* Day switcher */
.daybar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daybar .label { font-weight: 600; font-size: 14px; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; font-size: 18px; line-height: 1;
}
.iconbtn:disabled { opacity: 0.35; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 600; font-size: 14px; padding: 6px 4px; }

/* Panels */
.panel { background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel-head .meta { font-size: 13px; color: var(--muted); }


/* Workout button: a + in the bottom corner of Today that opens Push / Pull / Legs */
.sbtn:active { transform: scale(0.97); }
body.fab-on { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 96px); }
.fab-wrap { display: none; }
body.fab-on .fab-wrap { display: block; }
body.kb .fab-wrap { display: none; }
.fab, .fab-menu { position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px), calc((100vw - 560px) / 2)); }
.fab {
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px);
  width: 58px; height: 58px; border: 0; border-radius: 50%; padding: 0;
  background: var(--red); color: var(--on-color); display: grid; place-items: center;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
}
.fab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; transition: transform var(--t) var(--ease); }
.fab:active { transform: scale(0.95); }
.fab-wrap.open .fab svg { transform: rotate(45deg); }
.fab-menu {
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 86px);
  display: grid; gap: 8px; justify-items: end; visibility: hidden; transition: visibility 0s linear 120ms;
}
.fab-wrap.open .fab-menu { visibility: visible; transition-delay: 0s; }
.fab-menu button {
  min-width: 196px; border: 0; border-radius: 14px; padding: 12px 16px; background: var(--ink); color: var(--bg);
  display: flex; align-items: baseline; justify-content: space-between; gap: 14px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
  opacity: 0; transform: translateY(10px) scale(0.96); transform-origin: right bottom;
  transition: opacity 120ms ease, transform 120ms ease;
}
.fab-menu b { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.fab-menu small { font-size: 12px; font-weight: 600; opacity: 0.75; }
.fab-wrap.open .fab-menu button { opacity: 1; transform: none; transition-duration: var(--t); transition-timing-function: var(--ease); }
.fab-wrap.open .fab-menu button:nth-child(2) { transition-delay: 30ms; }
.fab-wrap.open .fab-menu button:nth-child(1) { transition-delay: 60ms; }
.fab-scrim { position: fixed; inset: 0; z-index: 24; background: var(--backdrop); opacity: 0; pointer-events: none; transition: opacity 120ms ease; }
.fab-wrap.open .fab-scrim { opacity: 1; pointer-events: auto; transition-duration: var(--t); }
.w-status { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.w-status.saved { color: var(--green); }
.w-status.draft { color: var(--yellow); }

/* Workout sheet */
.sheet.tall { max-height: 94vh; }
.ex { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ex-name { font-weight: 700; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
/* Reorder / rename / remove: hold a row (or grab its dots) and drag; tap the name to rename */
.ex-edit {
  display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 0; background: var(--surface);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y;
  transition: transform 160ms var(--ease), box-shadow 160ms ease;
}
.grip { flex: none; width: 40px; height: 44px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; }
.grip svg { width: 10px; height: 18px; fill: currentColor; }
.ex-rename {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 4px;
  text-align: left; font-weight: 700; font-size: 16px; overflow-wrap: anywhere;
}
.ex-rename svg { flex: none; width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex-edit.lifted { transition: none; position: relative; z-index: 3; scale: 1.02; border-color: var(--muted); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35); }
.ex-edit.renaming { padding: 8px; }
.ex-ask { display: grid; gap: 10px; }
.ex-ask p { margin: 0; display: grid; gap: 2px; }
.ex-ask .btn-row { align-items: center; }
.sbtn { height: 44px; border-radius: 10px; border: 0; background: var(--sunk); font-size: 22px; font-weight: 700; line-height: 1; }
.sval {
  width: 100%; min-width: 0; text-align: center; border: 0; background: none; padding: 4px 0;
  font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1;
}
.ex-sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.seg.sm button { padding: 4px 10px; font-size: 13px; }
/* Workout: groups of one-line exercises; the one you're doing opens, with its sets and big steppers. Dashed = not started. */
.wg { display: grid; gap: 8px; }
.wg-head { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.wg-head h3, .ex-ghead { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.wg-head .meta { font-size: 12px; color: var(--muted); }
.wg-head .linkbtn { margin-left: auto; }
.exr {
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%;
  padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: none; text-align: left; color: var(--ink);
}
.exr-name { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.exr-sub { font-size: 12px; color: var(--muted); text-align: right; }
.exr.plan .exr-name { color: color-mix(in srgb, var(--ink) 78%, var(--muted)); }
.mk {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none;
  border: 1.5px dashed var(--muted); color: var(--muted); font-size: 12px; font-weight: 700;
}
.mk svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.mk.done { border: 0; background: var(--green); color: var(--on-color); }
/* The open exercise: outlined, lifted and spaced off its neighbours, so where it starts and ends is obvious */
.ex.open {
  gap: 10px; padding: 14px; margin: 8px 0; border-radius: 16px;
  border: 2px solid color-mix(in srgb, var(--ink) 55%, transparent);
  background: color-mix(in srgb, var(--ink) 4%, var(--surface));
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
}
.ex.open .ex-head { gap: 10px; }
.ex.open .ex-head .ex-name { flex: 1; border: 0; background: none; padding: 2px 0; text-align: left; color: var(--ink); font-size: 18px; }
.ex-close { flex: none; width: 40px; height: 36px; margin: -4px -6px -4px 0; border: 0; border-radius: 10px; background: var(--sunk); color: var(--ink); display: grid; place-items: center; }
.ex-close svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ex-tools { display: flex; align-items: center; gap: 6px; flex: none; }
.ex-last { margin: -4px 0 0; font-size: 13px; color: var(--muted); }
.try {
  display: grid; gap: 2px; justify-items: start; text-align: left; padding: 8px 12px; border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--green) 45%, transparent); background: color-mix(in srgb, var(--green) 10%, transparent); color: var(--ink);
}
.try b { color: var(--green); font-size: 14px; }
.try span { font-size: 12px; color: var(--muted); }
.sets { display: grid; }
.set-row {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%;
  padding: 10px 2px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; color: var(--ink); font-weight: 600; font-size: 16px;
}
.sets > :first-child { border-top: 0; }
.set-row small { font-size: 12px; color: var(--muted); font-weight: 600; }
.set-k { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: var(--on-color); font-size: 12px; font-weight: 800; }
.set-edit svg { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.set-cur { display: grid; gap: 8px; padding: 10px 0 2px; border-top: 1px solid var(--line); }
.set-top { display: flex; align-items: center; gap: 10px; }
.set-n { font-family: var(--font-display); font-size: 17px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; }
.set-top .set-del { margin-left: auto; color: var(--muted); font-size: 13px; }
.srow { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 8px; align-items: center; }
.srow .sbtn { height: 52px; font-size: 24px; color: var(--ink); }
.sbox { position: relative; display: block; height: 52px; border-radius: 10px; background: var(--bg); }
.sbox .sval { width: 100%; height: 100%; padding: 0 48px; text-align: center; font-size: 30px; border-radius: 10px; color: var(--ink); }
.sbox .sval::placeholder { color: var(--muted); opacity: 0.6; }
.sbox .u { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 600; color: var(--muted); pointer-events: none; }
.foot-row { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; }
.foot-row .btn { padding: 14px 12px; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.go { background: var(--green); color: var(--on-color); }
.btn.go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.wedit { display: grid; gap: 6px; }
.ex-ghead { padding: 10px 2px 2px; transition: transform 160ms var(--ease); }
.sbtn:disabled { opacity: 0.35; }
.sheet-foot { display: grid; gap: 8px; position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding-block: 10px 6px; }
.sheet.typing .sheet-foot { display: none; }

.three { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
.three label { min-width: 0; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.form label > .seg { justify-self: start; }

/* Strength tickers */
.tickers { display: grid; }
.tick {
  display: grid; grid-template-columns: minmax(0, 1fr) 56px auto 64px; align-items: center; gap: 10px;
  width: 100%; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left;
}
.tickers > :first-child { border-top: 0; }
.tick-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.tick-name small, .tick-val small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.tick-val { text-align: right; font-weight: 700; white-space: nowrap; }
.chg { justify-self: end; font-size: 12px; font-weight: 700; padding: 4px 6px; border-radius: 6px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chg.up { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.chg.down { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.spark { width: 56px; height: 22px; display: block; }
.spark polyline { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.spark.up polyline { stroke: var(--green); }
.spark.down polyline { stroke: var(--red); }
.tick-detail { display: grid; gap: 10px; padding-bottom: 12px; }
/* The open exercise: outlined and softly tinted in its direction's color */
.tick-focus {
  --fc: var(--green); margin: 4px -10px; padding: 0 10px; border-radius: 14px;
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--fc) 75%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--fc) 15%, transparent), color-mix(in srgb, var(--fc) 4%, transparent) 70%);
  animation: focus-in var(--t) var(--ease);
}
.tick-focus.down { --fc: var(--red); }
.tick-focus .tick { border-top: 0; }
.tick-focus + .tick { border-top: 0; }
.tick-group {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 0 6px; border-top: 1px solid var(--line);
  font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
.tickers > .tick-group:first-child { padding-top: 4px; }
.tick-group .chg { font-family: var(--font-body); letter-spacing: 0; text-transform: none; }
.tick-group + .tick, .tick-group + .tick-focus { border-top: 0; }
@keyframes focus-in { from { opacity: 0.4; } to { opacity: 1; } }
.chart .slabel { fill: var(--ink); font-weight: 700; font-size: 10px; }
.chart .sreps { fill: var(--muted); font-size: 9px; }
.chart .sline { fill: none; stroke: var(--green); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .sline.down { stroke: var(--red); }
.chart .sdot { fill: var(--surface); stroke: var(--green); stroke-width: 2.5; }
.chart .sdot.down { stroke: var(--red); }
.str-note { margin: 0; font-size: 14px; color: var(--muted); }
.str-note b { color: var(--ink); }
.str-what { display: inline-block; margin-right: 8px; padding: 2px 6px; border-radius: 5px; background: var(--sunk); color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.chart .g-up stop { stop-color: var(--green); }
.chart .g-down stop { stop-color: var(--red); }
.sessions { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.sessions li { display: flex; justify-content: space-between; gap: 8px; }
.sessions .r { color: var(--muted); }
@media (max-width: 360px) { .tick { grid-template-columns: minmax(0, 1fr) auto 60px; } .tick .spark { display: none; } }

/* Streak strip */
.streak { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.streak-num { display: flex; align-items: baseline; gap: 6px; }
.streak-num b { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 0.9; color: var(--red); }
.streak-num span { font-family: var(--font-display); font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.week { display: flex; gap: 6px; }
.week span { display: grid; justify-items: center; gap: 3px; font-size: 10px; font-weight: 700; color: var(--muted); }
.week i { width: 18px; height: 18px; border-radius: 5px; background: var(--sunk); display: block; }
.week i.full { background: var(--red); }
.week i.partial { background: color-mix(in srgb, var(--blue) 55%, var(--sunk)); }
.week i.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--ink); }

/* Backup status dot by the date */
.eyebrow { display: flex; align-items: center; gap: 8px; }
.bk-dot { width: 22px; height: 22px; margin: -6px 0; padding: 0; border: 0; background: none; display: grid; place-items: center; flex: none; }
.bk-dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.bk-dot.ok::before { background: var(--green); }
.bk-dot.warn::before { background: var(--yellow); }
.bk-dot.bad::before { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent); }

.inline-num {
  font: inherit; color: var(--red); background: var(--surface); border: 0; border-bottom: 4px solid var(--red); border-radius: 10px 10px 4px 4px;
  width: 3.4ch; padding: 0 0.12em; text-align: center; box-shadow: 0 2px 0 var(--line); margin: 0 0.06em;
}
#su-day.inline-num { width: 2.6ch; }
.inline-num:focus { outline: 3px solid var(--blue); outline-offset: 2px; }
.last-day { display: grid; gap: 2px; padding-top: 8px; }
.last-day b { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.05; }
.need { color: var(--red); font-weight: 600; }
.suggest { display: grid; gap: 4px; background: var(--surface); border-radius: 12px; padding: 14px; box-shadow: inset 0 0 0 2px var(--green); }
.suggest b { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1.05; }

/* Tasks with live numbers */
.habit-text { display: grid; gap: 1px; min-width: 0; }
.habit-sub { font-size: 12px; font-weight: 600; color: var(--muted); }
.habit.done .habit-sub { color: var(--green); }
.auto-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); vertical-align: 1px; }
.pick button[aria-pressed="true"] .auto-tag { background: color-mix(in srgb, var(--bg) 22%, transparent); color: var(--bg); }
.chart .b.met { fill: var(--green); }
.chart .range { fill: var(--green); opacity: 0.14; }

/* End of challenge */
.finish { background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 18px 16px; display: grid; gap: 12px; }
.finish .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.finish h2 { font-size: 34px; color: var(--bg); }
.finish-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 0; }
.finish-facts dt { font-size: 12px; color: color-mix(in srgb, var(--bg) 70%, transparent); }
.finish-facts dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.finish .btn { background: var(--bg); color: var(--ink); }
.finish .btn.secondary { background: transparent; color: var(--bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bg) 40%, transparent); }

/* Update banner */
.update { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 12px 14px; }
.update .btn { background: var(--bg); color: var(--ink); padding: 8px 14px; flex: none; }
.update-text { display: grid; gap: 1px; min-width: 0; }
.update-text small { font-size: 13px; opacity: 0.8; }
.update-bar { display: block; height: 4px; margin-top: 6px; border-radius: 2px; background: color-mix(in srgb, var(--bg) 25%, transparent); overflow: hidden; width: 100%; }
.update-bar i { display: block; height: 100%; background: var(--green); transform-origin: left center; transition: transform 200ms linear; }
.update-text { flex: 1; }

/* Share */
.share-qr { width: 168px; height: 168px; background: #FFFFFF; border-radius: 12px; padding: 10px; display: grid; place-items: center; }
.share-qr svg { width: 100%; height: 100%; display: block; }
.share-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.share-link { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; user-select: all; min-width: 0; }

/* First-time setup */
body.setup .nav, body.setup .top { display: none; }
.setup-wrap { display: grid; gap: 18px; padding-top: 8px; }
.setup-progress { display: flex; gap: 6px; }
.setup-progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--sunk); }
.setup-progress i.on { background: var(--red); }
.setup-hero { display: grid; gap: 14px; justify-items: start; padding-top: 24px; }
.setup-hero .plate { pointer-events: none; }
.setup-title { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.1; margin: 0; text-wrap: balance; }
.setup-lead { font-size: 16px; color: var(--muted); margin: 0; max-width: 34ch; }
.setup-actions { display: grid; gap: 8px; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
.pick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 48px; }
.row:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--muted); }
.row-val { font-weight: 700; white-space: nowrap; }
.del { border: 0; background: none; color: var(--muted); font-size: 20px; width: 36px; height: 36px; border-radius: 50%; }
.del:hover { background: var(--sunk); }
.empty { font-size: 14px; color: var(--muted); margin: 0; }

/* Daily totals: each box is its own bar. Calories leads; protein sits under it, slimmer.
   The number is drawn twice: ink on the empty part, and a copy clipped to the fill in the
   color that reads on it, so it flips as the bar passes under it. The input itself is invisible
   except for its caret. */
.totals { display: grid; gap: 12px; }
.tot { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.tot-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.tot-head span:last-child { font-weight: 500; white-space: nowrap; }
.tot-box {
  --c: color-mix(in srgb, var(--green) calc(var(--g, 0) * 100%), var(--blue)); --h: 64px; --fs: 40px; --clip: inset(0 calc(100% - var(--p, 0) * 100%) 0 0);
  position: relative; display: block; height: var(--h); border-radius: 14px; overflow: hidden; background: var(--sunk);
}
.tot-box[data-s="met"] { --c: var(--green); }
.tot-box[data-s="over"] { --c: var(--red); }
.tot-box.pro { --c: var(--green); --h: 44px; --fs: 26px; border-radius: 11px; }
.tot-fill, .tot-num { position: absolute; inset: 0; pointer-events: none; }
.tot-fill { background: color-mix(in srgb, var(--c) calc(var(--fade-floor) + (100% - var(--fade-floor)) * var(--b, 1)), var(--sunk)); clip-path: var(--clip); transition: background-color 250ms ease, opacity 150ms ease; }
.tot-box:focus-within .tot-fill { opacity: 0.25; }
.tot-num, .big-input { font-family: var(--font-display); font-weight: 800; font-size: var(--fs); line-height: 1; padding: 0 14px; }
.tot-num { display: flex; align-items: center; color: var(--ink); white-space: nowrap; }
.tot-num.on { color: var(--on-color); clip-path: var(--clip); }
/* While you type, the plain number shows and the bar waits; it moves once you're done. */
.tot-box:focus-within .tot-num { visibility: hidden; }
.tot-box:focus-within .big-input { color: var(--ink); }
.tot-box:focus-within .big-input::placeholder { color: var(--muted); }
.tot-num.empty { color: var(--muted); opacity: 0.5; }
.big-input {
  position: relative; display: block; height: 100%; width: 100%; min-width: 0;
  border: 0; border-radius: inherit; background: none; color: transparent; caret-color: var(--ink);
}
.big-input::placeholder { color: transparent; }
.big-input:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.source { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.source .linkbtn { padding-left: 0; }
.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; }
.btn.secondary { background: var(--sunk); color: var(--ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.steps b, .sync b { color: var(--ink); }

/* Goals ladders: hardest step at the top, like climbing */
.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ladder li { display: flex; align-items: center; gap: 4px; }
.step {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 44px;
  padding: 8px 10px; border: 0; border-radius: 10px; background: none; text-align: left;
}
.mark {
  flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line);
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--on-color);
}
.step-text { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.step-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.step.done .mark { background: var(--green); border-color: var(--green); }
.step.done .step-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.step.next { background: var(--bg); box-shadow: inset 0 0 0 2px var(--red); }
.step.next .mark { border-color: var(--red); }
.focus { margin: 0; font-size: 13px; color: var(--muted); }
.focus b { color: var(--ink); }
.goal-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn.danger { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1px var(--line); }

/* Goals tab: summary, groups, collapsible rows */
.goal-list { display: grid; }
.goal { border-top: 1px solid var(--line); }
.goal:first-child { border-top: 0; }
.goal-row { display: grid; gap: 8px; padding: 12px 0; }
.goal-head {
  width: 100%; border: 0; background: none; text-align: left; padding: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center;
}
.goal-name { font-weight: 700; overflow-wrap: anywhere; }
.goal-next { font-size: 13px; color: var(--muted); }
/* Three steps at a time: the one before, where you are, and the next one to tick. They slide left when you tick. */
.gstrip { position: relative; height: 46px; overflow: hidden; }
.gs {
  position: absolute; left: 0; top: 0; height: 100%; width: calc((100% - 16px) / 3);
  transform: translateX(calc(var(--i) * (100% + 8px))); transition: transform 240ms var(--ease), opacity 240ms var(--ease);
  display: flex; align-items: center; gap: 7px; padding: 0 10px; border: 0; border-radius: 10px; text-align: left;
  font-size: 14px; line-height: 1.15; background: var(--bg); color: var(--muted);
}
.gs.off { opacity: 0; }
.gs.blank { background: none; }
.gs-t { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.gs .mark { width: 18px; height: 18px; font-size: 10px; border-width: 2px; transition: background-color 240ms ease, border-color 240ms ease; }
.gs.prev .mark { background: var(--line); border-color: var(--line); }
.gs.cur { color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 1px var(--line); }
.gs.cur .mark { background: var(--green); border-color: var(--green); }
.gs.next { background: none; color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.gs.next .mark { border-color: var(--red); }
.gs.fin { background: none; color: var(--green); font-weight: 700; }
.gs.fin .mark { background: var(--green); border-color: var(--green); }
.gs.start { background: none; box-shadow: none; color: var(--muted); font-weight: 600; font-style: italic; }
.goal-count { font-weight: 700; display: flex; align-items: center; gap: 6px; color: var(--muted); }
.chev { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; transition: transform 0.15s ease; }
.goal.open .chev { transform: rotate(180deg); }
.goal-bar { grid-column: 1 / -1; display: block; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.goal-bar i { display: block; height: 100%; background: var(--green); transform-origin: left center; transition: transform 240ms var(--ease); }
.goal-bar.big { height: 10px; border-radius: 5px; }
.goal-open { display: grid; gap: 12px; padding-bottom: 14px; }
.goal-group-head { display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.goal-row { cursor: pointer; }
.goal-new { display: grid; gap: 12px; }
/* Stats */
.big-stat { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big-stat b { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 0.9; }
.big-stat b small { font-size: 18px; font-weight: 700; margin-left: 2px; color: var(--muted); }
.big-stat span { font-size: 13px; font-weight: 600; color: var(--muted); }
.big-stat.sm b { font-size: 30px; }
.big-stat .up, .big-stat b.up { color: var(--green); }
.big-stat .down, .big-stat b.down { color: var(--red); }
.body-name { font-weight: 700; }
/* Coach note under the streak */
/* Coach: a card with a soft green-to-blue edge and glow, a small avatar, and the note with its numbers in bold */
.coach-card {
  position: relative; display: grid; gap: 10px; padding: 14px 16px 16px; border-radius: 18px; border: 1px solid transparent;
  background:
    radial-gradient(120% 100% at 0% 0%, color-mix(in srgb, var(--green) 13%, transparent), transparent 62%) padding-box,
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(135deg, color-mix(in srgb, var(--green) 75%, transparent), color-mix(in srgb, var(--blue) 50%, transparent) 50%, var(--line)) border-box;
}
.coach-head { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.coach-av {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--on-color);
  background: linear-gradient(135deg, var(--green), color-mix(in srgb, var(--green) 45%, var(--blue)));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 16%, transparent);
}
.coach-av svg { width: 17px; height: 17px; fill: currentColor; }
.coach-who { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
.coach-who b { font-size: 15px; font-weight: 700; }
.coach-who small { font-size: 12px; color: var(--muted); }
.coach-card.busy .coach-who small { color: var(--green); }
.coach-body { min-width: 0; } /* lets the one-line minimized note cut off with "…" instead of widening the page */
.coach-text { margin: 0; font-size: 16px; line-height: 1.55; }
.coach-text b { font-weight: 700; color: var(--ink); }
.coach-text.muted, .coach-status { color: var(--muted); }
.coach-text.muted b { color: inherit; }
.coach-status { margin: 6px 0 0; font-size: 13px; }
/* While it writes (usually a second or two): a barbell with three red 45s a side. They slide on from the ends one at a
   time (innermost first), sit for a moment, then slide off (outermost first). Only transform and opacity move. */
.coach-load { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 4px 0; }
.bb { position: relative; flex: none; width: 116px; height: 44px; }
.bb-shaft { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: color-mix(in srgb, var(--muted) 60%, transparent); }
.bb i {
  position: absolute; top: 50%; width: 8px; height: 40px; margin-top: -20px; border-radius: 2px; opacity: 0;
  background: var(--red); box-shadow: inset -2px 0 0 color-mix(in srgb, #000 22%, transparent);
  animation: 2.8s cubic-bezier(0.45, 0, 0.25, 1) infinite both;
}
.bb i.l { left: calc(34px - var(--k) * 9px); --dx: calc(-20px - (2 - var(--k)) * 9px); }
.bb i.r { right: calc(34px - var(--k) * 9px); --dx: calc(20px + (2 - var(--k)) * 9px); box-shadow: inset 2px 0 0 color-mix(in srgb, #000 22%, transparent); }
.bb i[style*="--k:0"] { animation-name: bb-0; }
.bb i[style*="--k:1"] { animation-name: bb-1; }
.bb i[style*="--k:2"] { animation-name: bb-2; }
@keyframes bb-0 { 0% { opacity: 0; transform: translateX(var(--dx)); } 18%, 76% { opacity: 1; transform: none; } 92%, 100% { opacity: 0; transform: translateX(var(--dx)); } }
@keyframes bb-1 { 0%, 9% { opacity: 0; transform: translateX(var(--dx)); } 27%, 67% { opacity: 1; transform: none; } 83%, 100% { opacity: 0; transform: translateX(var(--dx)); } }
@keyframes bb-2 { 0%, 18% { opacity: 0; transform: translateX(var(--dx)); } 36%, 58% { opacity: 1; transform: none; } 74%, 100% { opacity: 0; transform: translateX(var(--dx)); } }
.load-cap { font-size: 14px; color: var(--muted); transition: opacity 180ms ease; }
.load-cap.out { opacity: 0; }
.coach-actions { margin-top: 12px; }
.coach-actions .btn { padding: 11px 20px; }
/* A soft fade when the card changes (hello → loading → note); the typing itself is the transition into the note */
.coach-body.enter > * { animation: coach-in 260ms var(--ease) both; }
@keyframes coach-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .bb i { animation: none; opacity: 1; } .coach-body.enter > * { animation: none; } .load-cap { transition: none; } }
.coach-card { position: relative; }
.coach-dots { border: 0; background: none; width: 40px; height: 32px; margin: -4px -10px -4px 0; display: grid; place-items: center; color: var(--muted); border-radius: 8px; }
.coach-dots svg { width: 18px; height: 18px; fill: currentColor; }
.coach-menu {
  position: absolute; right: 10px; top: 46px; z-index: 5; display: grid; min-width: 190px; padding: 6px; border-radius: 12px;
  background: var(--surface); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3), inset 0 0 0 1px var(--line);
  opacity: 0; transform: translateY(-6px) scale(0.97); transform-origin: top right; visibility: hidden;
  transition: opacity 120ms ease, transform 120ms var(--ease), visibility 0s linear 120ms;
}
.coach-card.menu-open .coach-menu { opacity: 1; transform: none; visibility: visible; transition: opacity var(--t) ease, transform var(--t) var(--ease); }
.coach-menu button { border: 0; background: none; text-align: left; padding: 11px 12px; border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
.coach-menu button.danger { color: var(--red); }
.coach-card.min { padding-block: 10px 12px; gap: 6px; }
.coach-card.min .coach-av { width: 24px; height: 24px; box-shadow: none; }
.coach-card.min .coach-av svg { width: 14px; height: 14px; }
.coach-mini { display: block; width: 100%; border: 0; background: none; padding: 0; text-align: left; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coach-mini.muted { color: var(--muted); }
.coach-head .linkbtn { padding: 2px 0; font-size: 13px; }
.stat-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.stat-tabs::-webkit-scrollbar { display: none; }
.stat-tabs button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; color: var(--muted); }
.stat-tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.body-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.body-tile {
  display: grid; gap: 2px; align-content: start; text-align: left; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--bg);
  font-size: 12px; color: var(--muted);
}
.body-tile .body-name { font-size: 13px; color: var(--ink); }
.body-tile b { font-family: var(--font-display); font-size: 26px; font-weight: 800; line-height: 1.05; color: var(--ink); }
.body-tile b small { font-size: 14px; color: var(--muted); margin-left: 2px; }
.body-tile .up { color: var(--green); } .body-tile .down { color: var(--red); }
.body-tile.open { --fc: var(--green); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--fc) 75%, transparent); background: color-mix(in srgb, var(--fc) 12%, var(--bg)); }
.body-tile.open.down { --fc: var(--red); }
.body-detail { margin: 0; padding: 12px; display: grid; gap: 6px; }
.body-grid > .body-detail { grid-column: 1 / -1; min-width: 0; }
.food-split { margin: 0 0 10px; }
.food-split b { color: var(--ink); }
.mini-stats { display: flex; gap: 8px; }
.mini-stats span { flex: 1; min-width: 0; background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: grid; }
.mini-stats b { font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1; color: var(--ink); }
.chart .mline { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .mline.up { stroke: var(--green); } .chart .mline.down { stroke: var(--red); }
.chart .mline.thin { stroke-width: 1.6; opacity: 0.9; }
.chart .mline.t-push, .leg-push i { stroke: var(--red); background: var(--red); }
.chart .mline.t-pull, .leg-pull i { stroke: var(--blue); background: var(--blue); }
.chart .mline.t-legs, .leg-legs i { stroke: var(--yellow); background: var(--yellow); }
.chart .mdot { fill: var(--surface); stroke-width: 2.5; stroke: var(--ink); }
.chart .mdot.up { stroke: var(--green); } .chart .mdot.down { stroke: var(--red); }
.chart .gridl.zero { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.chart-legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
.chart-legend b { color: var(--ink); }
.leg-all i { background: var(--ink); height: 4px; }
@media (prefers-reduced-motion: reduce) {
  .tick-focus { animation: none; }
  .ptr.busy .spin { animation-duration: 2.4s; }
  .ex-edit, .ex-ghead, .coach-menu, .chev, .g-gear, .gs, .gs .mark, .goal-bar i, .tot-fill, .tot-num, .fab svg, .fab-menu, .fab-menu button, .fab-scrim { transition: none !important; }
}

/* Habits */
.habit { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 52px; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.habit:first-child { border-top: 0; }
.check {
  flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line);
  display: grid; place-items: center; color: var(--on-color); font-size: 16px; font-weight: 800;
  transition: background 0.15s ease, border-color 0.15s ease;
}

<script>
(function () {
  "use strict";

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
  const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  const todayISO = () => iso(new Date());
  const fmtDate = (s, opts) => parseISO(s).toLocaleDateString(undefined, opts || { weekday: "short", month: "short", day: "numeric" });
  const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const fmtWhen = (ms) => {
    const d = iso(new Date(ms));
    return d === todayISO() ? "today at " + fmtTime(ms) : d === addDays(todayISO(), -1) ? "yesterday at " + fmtTime(ms) : fmtDate(d) + " at " + fmtTime(ms);
  };
  const fmt = (n) => Math.round(n).toLocaleString();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const KG_TO_LB = 2.20462;

  // ---------- state ----------
  const LOCAL_KEY = "hundred-days-hard.v1";
  const DEFAULT_HABITS = [
    { id: "workout", name: "Workout" },
    { id: "protein", name: "Hit protein goal" },
    { id: "water", name: "Drink 3 L of water" },
    { id: "steps", name: "10,000 steps" },
    { id: "sleep", name: "Get 9 hours of sleep" },
  ];
  // Shipped defaults are generic: friends install this same app, so nothing personal lives in code.
  const TASK_PRESETS = [
    ...DEFAULT_HABITS,
    { id: "read", name: "Read 10 pages" },
    { id: "photo", name: "Progress photo" },
    { id: "diet", name: "Stick to the diet" },
    { id: "noalcohol", name: "No alcohol" },
    { id: "stretch", name: "Stretch 10 minutes" },
  ];
  const defaultSettings = () => ({
    startDate: iso(new Date()),
    calorieGoal: 2500,
    proteinGoal: 150,
    totalDays: 100,
    stepsTarget: 10000,
    sleepTarget: 9,
    unit: "lb",
    habits: DEFAULT_HABITS.map((h) => ({ ...h })),
    updatedAt: 0,
  });
  // Ladders run easiest to hardest; the page shows the hardest step at the top.
  const ladder = (id, name, steps, focus) => ({
    id, name, focus: focus || "",
    steps: steps.map((st, i) => ({ id: "s" + i, text: typeof st === "string" ? st : st[0], done: Array.isArray(st), doneDay: null })),
  });
  const defaultGoals = () => ({ updatedAt: 0, list: [] });
  const GOAL_TEMPLATES = [
    ["Push-ups in one go", ["10", "20", "30", "40", "50"]],
    ["Pull-ups", ["1", "3", "5", "8", "10"]],
    ["Dips in one go", ["5", "10", "15", "20"]],
    ["Dead hang", ["0:30", "0:45", "1:00", "1:30"]],
    ["Plank", ["0:30", "1:00", "2:00", "3:00"]],
    ["Running", ["0.25 mi", "0.5 mi", "1 mi", "2 mi", "5K"]],
  ];
  const blankDay = () => ({ kcal: null, protein: null, kcalSrc: null, habits: {}, workout: null, weight: null, health: null, updatedAt: 0 });
  function normalizeDay(d) {
    const day = { ...blankDay(), ...d };
    // Older versions logged individual meals; fold them into the day's totals.
    if (day.kcal == null && Array.isArray(d.meals) && d.meals.length) {
      day.kcal = d.meals.reduce((a, m) => a + (+m.kcal || 0), 0);
      day.protein = d.meals.reduce((a, m) => a + (+m.protein || 0), 0);
    }
    delete day.meals;
    // Single exercise lists from v0.1/v0.2 become a saved workout.
    if (!day.workout && Array.isArray(d.exercises) && d.exercises.length) {
      day.workout = { type: "other", saved: true, savedAt: d.updatedAt || null,
        exercises: d.exercises.map((e) => ({ id: e.id || uid(), name: e.name, weight: +e.weight || 0, reps: +e.reps || 0, sets: +e.sets || 1, unit: "lb" })) };
    }
    delete day.exercises;
    if (day.workout && Array.isArray(day.workout.exercises)) day.workout.exercises.forEach(ensureSets);
    if (day.workout && !day.workout.saved && Array.isArray(day.workout.exercises)) day.workout.exercises.forEach(prepDraftEx);
    return day;
  }

  const state = { settings: defaultSettings(), days: {}, goals: defaultGoals() };
  let editingGoal = null, confirmDelete = null;
  let view = "today";
  let viewDate = todayISO();

  try {
    const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null");
    if (saved && saved.settings) {
      state.settings = { ...defaultSettings(), ...saved.settings };
      Object.keys(saved.days || {}).forEach((k) => (state.days[k] = normalizeDay(saved.days[k])));
      if (saved.goals && Array.isArray(saved.goals.list)) state.goals = saved.goals;
      if (state.settings.setupDone === undefined) state.settings.setupDone = true; // already using the app before setup existed
    }
  } catch (e) { /* storage unavailable */ }

  const S = () => state.settings;
  const dayNum = (s) => diffDays(S().startDate, s) + 1;
  const peekDay = (d) => state.days[d] || blankDay();
  const getDay = (d) => (state.days[d] = state.days[d] || blankDay());
  // Targets you change apply from today on; past days keep the ones they had. settings.targetLog holds a snapshot of
  // the targets from each day they changed ("0000-00-00" = before the first change); the settings themselves are today's.
  const TARGET_KEYS = ["calorieGoal", "calorieAim", "proteinGoal", "stepsTarget", "sleepTarget", "workoutsTarget"];
  function TG(date) {
    const log = S().targetLog;
    if (!date || !Array.isArray(log) || !log.length || date >= todayISO()) return S();
    let t = null;
    for (const x of log) { if (x.from <= date) t = x; else break; }
    if (!t) return S();
    const out = { ...S() };
    TARGET_KEYS.forEach((k) => { if (t[k] !== undefined) out[k] = t[k]; });
    return out;
  }
  function setTargets(changes) {
    const s = S(), t = todayISO(), snap = () => { const o = {}; TARGET_KEYS.forEach((k) => (o[k] = s[k])); return o; };
    if (!Array.isArray(s.targetLog) || !s.targetLog.length) s.targetLog = [{ from: "0000-00-00", ...snap() }];
    Object.assign(s, changes);
    const last = s.targetLog[s.targetLog.length - 1];
    if (last.from === t) Object.assign(last, snap()); else s.targetLog.push({ from: t, ...snap() });
    save("settings");
  }
  // Fat loss: land within 100 kcal either side of the goal. Muscle: reach at least the goal. (Each for a given day.)
  const calAim = (date) => (TG(date).calorieAim === "build" ? "build" : "lose");
  const calRange = (date) => [TG(date).calorieGoal - 100, TG(date).calorieGoal + 100];
  function calStatus(k, date) {
    const g = TG(date).calorieGoal;
    if (calAim(date) === "build") return k >= g ? { state: "met", short: "Goal hit", left: 0 } : { state: "under", short: fmt(g - k) + " kcal to go", left: g - k };
    const [lo, hi] = calRange(date);
    if (k > hi) return { state: "over", short: fmt(k - hi) + " kcal over your range", left: 0 };
    if (k >= lo) return { state: "met", short: "In your range", left: 0 };
    return { state: "under", short: fmt(lo - k) + " kcal until your range", left: lo - k };
  }
  const calGoalText = () => (calAim() === "lose" ? fmt(calRange()[0]) + "–" + fmt(calRange()[1]) : "at least " + fmt(S().calorieGoal));
  const TOTAL = () => Math.max(1, Math.round(+S().totalDays) || 100);
  // A task counts from the day it was added until the day it was removed (removedOn; off = earlier gaps if it was
  // removed and added back), so changing your tasks never changes past days or a streak.
  const taskOn = (h, date) => (!h.addedOn || h.addedOn <= date) && (!h.removedOn || date < h.removedOn) && !(h.off || []).some(([a, b]) => date >= a && date < b);
  const tasksFor = (date) => S().habits.filter((h) => taskOn(h, date));
  const activeTasks = () => S().habits.filter((h) => !h.removedOn);
  function addTask(id, name) {
    const t = todayISO(), h = S().habits.find((x) => x.id === id);
    if (!h) { S().habits = S().habits.concat({ id, name, addedOn: t }); return; }
    if (h.removedOn) { if (h.removedOn < t) h.off = (h.off || []).concat([[h.removedOn, t]]); delete h.removedOn; h.name = name; }
  }
  function removeTask(id) {
    const t = todayISO(), h = S().habits.find((x) => x.id === id);
    if (!h) return;
    if (h.addedOn === t && !(h.off || []).length) S().habits = S().habits.filter((x) => x !== h); // added today: no past to keep
    else h.removedOn = t;
  }
  const doneOn = (date) => { const day = state.days[date]; return day ? tasksFor(date).filter((h) => day.habits && day.habits[h.id]).length : 0; };
  const fracOn = (date) => { const n = tasksFor(date).length; return n ? doneOn(date) / n : 0; };
  const fullOn = (date) => { const n = tasksFor(date).length; return n > 0 && doneOn(date) === n; };
  // Tasks Samsung Health can tick by itself. Names follow the targets in Settings.
  const fmtSleep = (min) => Math.floor(min / 60) + " h " + String(Math.round(min % 60)).padStart(2, "0") + " m";
  // Workouts today. With a target of 1, either a Push/Pull/Legs saved here or a cardio session counts.
  // With a target of N (2 or more) it takes one Push/Pull/Legs saved here plus N-1 cardio sessions from
  // Samsung Health. Lifting sessions logged in Samsung Health ("Other workout" and the like) never count on
  // their own; their minutes are shown next to the workout saved here.
  const workoutsTarget = (st) => Math.max(1, Math.round(+(st || S()).workoutsTarget) || 1);
  function workoutParts(day, st) {
    const ses = ((day && day.health && day.health.sessions) || []).filter((x) => x.min >= 10);
    const strength = ses.filter((x) => x.strength), cardio = ses.filter((x) => !x.strength && walkCounts(x));
    const app = day && day.workout && day.workout.saved ? 1 : 0, t = workoutsTarget(st);
    const count = t === 1 ? Math.min(1, app + cardio.length) : app + Math.min(cardio.length, t - 1);
    return { count, ses, strength, cardio, app };
  }
  // Walks count as cardio only from 1 mile. Without a recorded distance, about 2,000 steps make a mile.
  const walkMiles = (x) => (x.miles != null ? x.miles : x.steps ? x.steps / 2000 : null);
  const walkCounts = (x) => !x.walk || (walkMiles(x) || 0) >= 1;
  function workoutNames(day, st) {
    const p = workoutParts(day, st), names = [], t = workoutsTarget(st);
    if (p.app) names.push(typeName(day.workout.type) + " day" + (p.strength[0] ? " " + p.strength[0].min + " min" : ""));
    p.cardio.forEach((x) => names.push(x.name + " " + (x.walk ? (Math.round(walkMiles(x) * 10) / 10) + " mi" : x.min + " min")));
    if (t > 1 && p.count < t) {
      const cardioLeft = Math.max(0, t - 1 - p.cardio.length);
      const need = (p.app ? [] : ["Push, Pull or Legs"]).concat(cardioLeft ? [cardioLeft > 1 ? cardioLeft + " cardio" : "cardio"] : []);
      if (need.length) names.push("still need " + need.join(" + "));
    }
    return names;
  }
  const workoutRule = () => {
    const t = workoutsTarget();
    return t === 1 ? "Ticks itself when you save Push, Pull or Legs here, or Samsung Health records cardio."
      : t + " workouts means one Push, Pull or Legs saved here plus " + (t - 1) + " cardio session" + (t > 2 ? "s" : "") + " from Samsung Health (runs, rides, swims, sports, hikes, or walks of a mile or more).";
  };
  const METRICS = {
    steps: { label: (st) => (+st.stepsTarget).toLocaleString() + " steps", value: (d) => (d.health ? d.health.steps : null), target: (st) => st.stepsTarget, show: (v, st) => fmt(v) + " / " + fmt(st.stepsTarget) },
    sleep: { label: (st) => "Get " + st.sleepTarget + " hours of sleep", value: (d) => (d.health && d.health.sleepMin != null ? d.health.sleepMin / 60 : null), target: (st) => st.sleepTarget, show: (v) => fmtSleep(v * 60) + " last night" },
    workout: {
      label: (st) => (workoutsTarget(st) > 1 ? workoutsTarget(st) + " workouts" : "Workout"),
      value: (d, st) => workoutParts(d, st).count, target: (st) => workoutsTarget(st),
      show: (v, st, d) => { const n = workoutNames(d, st), t = workoutsTarget(st); return (t > 1 ? v + " / " + t + (n.length ? " · " : "") : "") + n.join(", "); },
    },
  };
  const taskName = (h, st) => (METRICS[h.id] ? METRICS[h.id].label(st || S()) : h.name);
  const AUTO_IDS = ["steps", "sleep"];
  const isLogged = (day) => !!day && (day.kcal != null || day.protein != null || !!day.workout || !!day.weight || Object.values(day.habits || {}).some(Boolean));
  const hasAnyData = () => Object.values(state.days).some(isLogged) || state.goals.updatedAt > 0;
  const docBody = (id) => (id === "settings" ? state.settings : id === "goals" ? state.goals : state.days[id]);

  // ---------- where data lives ----------
  // "claude": opened from the Claude link, saved to the account.
  // "apk": the installed Android app, saved on the phone with an automatic backup file.
  // "browser": anywhere else, saved in this browser only.
  const bridge = window.AndroidBridge || null;
  let mode = bridge ? "apk" : "browser";
  let col = null;
  let sync = "local"; // local | ok | err
  let downloads = null;
  // Opened from the public web address (iPhone home-screen app), not inside Claude or the Android app.

  const metNow = (t) => {

  let cheered = null; // set at startup, from what's already met

  function save(id, opts) {

  async function flush(id) {

  function setSync(s) { if (sync !== s) { sync = s; if (view === "settings") render(); } }

  async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") return;

    col = db.collection("data/users/" + id);

    let first = true;
    col.onSnapshot((snap) => {
      let gotSettings = false, gotGoals = false;
      snap.docs.forEach((doc) => {
        const busy = pending[doc.id] || inflight[doc.id];

        }

        else if (/^\d{4}-\d\d-\d\d$/.test(doc.id) && !busy) state.days[doc.id] = normalizeDay(doc.data());

        // Move anything saved in this browser before the account store existed.
        if (!gotSettings) save("settings", { keepStamp: true });
        if (!gotGoals) save("goals", { keepStamp: true });
        const remote = new Set(snap.docs.map((d) => d.id));
        Object.keys(state.days).forEach((d) => { if (!remote.has(d) && isLogged(state.days[d])) save(d, { keepStamp: true }); });
      }
      sync = "ok";
      setupReady = true;
      regroupOnce(); othersOnce();
      persistLocal();
      render();
    }, () => { setupReady = true; setSync("err"); render(); });
  }

  // ---------- backup & restore ----------

  const backupName = () => "100-days-hard-backup-" + todayISO() + ".json";

  let backupTimer = null, lastFileBackup = 0;
  function scheduleFileBackup() {

  function apkBackupInfo() {

  function restoreFrom(text) {
    let b;
    try { b = JSON.parse(text); } catch (e) { toast("That file isn't a 100 Days Hard backup"); return; }
    if (!b || b.app !== "100-days-hard" || typeof b.days !== "object") { toast("That file isn't a 100 Days Hard backup"); return; }
    let restored = 0;
    if (b.settings && (!S().updatedAt || (b.settings.updatedAt || 0) > S().updatedAt)) {
      state.settings = { ...defaultSettings(), ...b.settings };
      save("settings", { keepStamp: true });
    }
    if (b.goals && Array.isArray(b.goals.list) && (b.goals.updatedAt || 0) > (state.goals.updatedAt || 0)) {
      state.goals = b.goals;
      save("goals", { keepStamp: true });
      restored++;
    }
    // Merge: keep whichever copy of each day was changed most recently.
    Object.keys(b.days).forEach((d) => {
      if (!/^\d{4}-\d\d-\d\d$/.test(d)) return;
      const incoming = normalizeDay(b.days[d]);
      const local = state.days[d];
      if (!isLogged(incoming)) return;

  function stampExport() { S().lastExport = Date.now(); save("settings"); render(); }
  async function saveBackupFile() {

  // ---------- Samsung Health via Health Connect (installed app only) ----------

  // Two levels: "today" (food totals, weight, steps, sleep, workouts: what Today, its tasks and the goal alerts use)

  function healthSync(scope) {
    scope = scope || (view === "stats" ? "stats" : "today");
    if (health !== "granted") return;
    if (healthBusy) { if (scope === "stats" || !healthNext) healthNext = scope; return; }
    if (scope === "stats" && Date.now() - statsSyncedAt < 15 * 60000) scope = "today";
    healthBusy = true; healthScope = scope;
    // The whole challenge every few hours (and on first open); just the last few days in between. Each level keeps its own clock.
    const t = todayISO(), key = "hundred-days-hard.fullSync" + (scope === "stats" ? ".stats" : "");

    try { full = Date.now() - (+localStorage.getItem(key) || 0) > 4 * 3600000 || localStorage.getItem(key + ".from") !== S().startDate; } catch (e) { /* ignore */ }

  // Goal notifications are on unless turned off; Android asks for permission once.

  // Tick steps, sleep and workouts when the number reaches the target. A tick the app made itself comes off again
  // if the number drops below the target (say the target goes up); a tick you made by hand always stays.
  function autoMetricHabits(day, date) {
    let changed = false;
    const st = TG(date); // that day's targets, so changing a target today never changes past days
    tasksFor(date).forEach((t) => {
      const m = METRICS[t.id];
      if (!m) return;
      const v = m.value(day, st), met = v != null && v >= m.target(st), on = !!(day.habits && day.habits[t.id]);
      const auto = !!(day.autoTicks && day.autoTicks[t.id]);
      if (met && !on) { day.habits = { ...day.habits, [t.id]: true }; day.autoTicks = { ...day.autoTicks, [t.id]: true }; changed = true; }
      else if (!met && on && auto) { day.habits = { ...day.habits, [t.id]: false }; day.autoTicks = { ...day.autoTicks, [t.id]: false }; changed = true; }
    });
    return changed;
  }
  // Re-check recent days after tasks or targets change, so numbers already synced count right away.
  function reTick() {
    for (let i = 0; i < 3; i++) {
      const d = addDays(todayISO(), -i), day = state.days[d];
      if (day && autoMetricHabits(day, d)) save(d);
    }
  }
  function healthMissing() {
    try { return bridge && bridge.healthMissing ? JSON.parse(bridge.healthMissing()) : []; } catch (e) { return []; }
  }
  function autoProteinHabit(day, date) {
    if (day.protein != null && day.protein >= TG(date).proteinGoal && tasksFor(date).some((h) => h.id === "protein")) {
      day.habits = { ...day.habits, protein: true };
    }
  }

  // ---------- rendering ----------
  const main = document.getElementById("main");
  let deferred = false;
  // A light buzz: "tick" for small things, "confirm" for something done, "start"/"end" around a drag.
  function buzz(kind) {
    try {
      if (bridge && bridge.haptic) bridge.haptic(kind);
      else if (navigator.vibrate) navigator.vibrate(kind === "confirm" ? 14 : 6);
    } catch (e) { /* no haptics here */ }

  // When the page last scrolled. A tap that lands right after (say, to stop a fling) never ticks a goal step.
  let lastScroll = 0;

  function render(force) {

    const title = { today: viewDate === t ? "Today" : "Day " + dayNum(viewDate), stats: "Stats", progress: "Progress", goals: "Goals", settings: "Settings" }[view];
    document.getElementById("hdr-title").textContent = title;

  // A new tab slides in from the side it sits on (a plain fade when coming from Settings).
  function slideIn(dir) {
    if (reduceMotion || !main.animate) return;
    main.animate([{ opacity: 0.35, transform: "translateX(" + dir * 14 + "px)" }, { opacity: 1, transform: "none" }], { duration: 200, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" });
  }

  // ---------- coach: Gemini Nano on the phone (installed app, where available) ----------
  // The app works out every number; the model only turns them into a few plain sentences.
  const COACH_KEY = "hundred-days-hard.coach";
  let aiState = "none", coachBusy = false, coachErr = false, coachFacts = "";
  const coachSaved = () => { try { return JSON.parse(localStorage.getItem(COACH_KEY) || "null"); } catch (e) { return null; } };
  function coachCheck() {
    if (!bridge || !bridge.aiStatus) return;
    if (aiState === "none") aiState = "checking";
    try { bridge.aiStatus(); } catch (e) { aiState = "unavailable"; }
  }
  window.__aiStatus = function (st) {
    const was = aiState;
    aiState = st;
    if (st === "available") coachWrite(false);
    if (was !== st && (view === "today" || view === "stats")) render();
  };
  // Gemini Nano takes one request at a time: the coach's note and exercise sorting queue up, and each answer
  // (through window.__aiResult) goes back to whoever asked.
  const aiQueue = [];
  let aiCur = null;
  function aiAsk(prompt, cb, onText) { aiQueue.push({ prompt, cb, onText }); aiNext(); }
  function aiNext() {
    if (aiCur || !aiQueue.length) return;
    aiCur = aiQueue.shift();
    try { bridge.aiGenerate(aiCur.prompt); } catch (e) { const c = aiCur; aiCur = null; c.cb({ ok: false }); aiNext(); }
  }
  window.__aiResult = function (res) { const c = aiCur; aiCur = null; if (c) c.cb(res || { ok: false }); aiNext(); };
  window.__aiChunk = function (text) { if (aiCur && aiCur.onText) aiCur.onText(String(text || "")); }; // the reply so far, as it's written
  // Small models sometimes add markdown or a label; keep plain sentences only.
  const coachClean = (t) => String(t).replace(/[*#_`]+/g, "").replace(/^\s*(coach|summary|note)\s*:\s*/i, "").replace(/\s*—\s*/g, ", ").replace(/,\s*([.,!?])/g, "$1").replace(/\s+/g, " ").trim();
  // The note's numbers in bold, so it reads at a glance. Split first, then escape, so apostrophes stay intact.
  const coachRich = (t) => String(t).split(/(\d+(?:[.,]\d+)*(?:\s?(?:lb|kg|kcal|calories|reps|sets|days|nights|steps|bpm|min|h|g|%)(?![a-z]))?)/i)
    .map((x, i) => (i % 2 ? "<b>" + esc(x) + "</b>" : esc(x))).join("");
  // While Gemini Nano writes, its words appear as they come (the placeholder shows only until the first ones arrive).
  // The note inks in character by character at a steady pace, speeding up when the model gets ahead; the newest few
  // characters are still fading in. A redraw mid-note picks up where it was (typer survives renders).
  // Each coach card has its own (Today's note, and the note under a Stats section); paused() skips painting while minimized.
  function makeTyper(id, paused) {
    const ty = { target: "", shown: 0, raf: 0, last: 0, done: null };
    const finish = () => { if (ty.done && ty.shown >= ty.target.length) { const f = ty.done; ty.done = null; f(); } };
    const frame = (now) => {
      const dt = Math.min(64, now - ty.last), back = ty.target.length - ty.shown;
      ty.last = now;
      ty.shown = Math.min(ty.target.length, ty.shown + (Math.max(55, back * 4) * dt) / 1000);
      ty.paint();
      if (ty.shown < ty.target.length) ty.raf = requestAnimationFrame(frame);
      else { ty.raf = 0; finish(); }
    };
    ty.to = (text, onDone) => {
      ty.target = text || "";
      if (onDone) ty.done = onDone;
      if (reduceMotion) { ty.shown = ty.target.length; ty.paint(); finish(); return; }
      if (!ty.raf) { ty.last = performance.now(); ty.raf = requestAnimationFrame(frame); }
    };
    ty.html = () => {
      const t = ty.target, n = Math.floor(ty.shown), cut = Math.max(0, n - 6);
      let tail = "";
      for (let i = cut; i < n; i++) tail += '<span style="opacity:' + (1 - (i - cut + 1) / 8).toFixed(2) + '">' + esc(t[i]) + "</span>";
      return '<p class="coach-text">' + coachRich(t.slice(0, cut)) + tail + "</p>";
    };
    ty.paint = () => {
      if (paused()) return; // minimized mid-note: it carries on writing out of sight
      const el = document.getElementById(id);
      if (el && ty.target) el.innerHTML = ty.html();
    };
    ty.reset = () => { cancelAnimationFrame(ty.raf); ty.target = ""; ty.shown = 0; ty.raf = 0; ty.done = null; };

  // Goals are grouped automatically by name (Strength / Cardio / Body); "Group" in Edit overrides it.
  const GOAL_GROUPS = [["strength", "Strength"], ["cardio", "Cardio"], ["body", "Body"]];
  const groupOf = (g) => g.group || (/weight|fat|muscle|waist|bmi|lean/i.test(g.name) ? "body" : /run|mile|\bmi\b|\bkm\b|5k|10k|bike|biking|cycl|swim|row|cardio|sprint|walk|hike/i.test(g.name) ? "cardio" : "strength");
  let openGoal = null;
  function goalLadder(g) {

  // Three steps of a ladder side by side: the one before (grey), the one you're on (white), and the next one,

  const gsRole = (i) => (i < 0 || i > 2 ? "off" : ["prev", "cur", "next"][i]);
  function goalStrip(g) {
    const c = firstOpen(g), n = g.steps.length, slots = [];
    for (let i = -1; i <= 3; i++) {

      (list.length

  // ---------- end of the challenge ----------

    let perfect = 0, workouts = 0, best = 0, run = 0;
    for (let i = 0; i < N; i++) {

      const w = state.days[d] && state.days[d].workout;

    }
    const ws = Object.keys(state.days).filter((d) => d >= start && d <= end && state.days[d].weight).sort();
    const wChange = ws.length > 1 ? state.days[ws[ws.length - 1]].weight - state.days[ws[0]].weight : null;
    let top = null;
    strengthData().forEach((m) => {
      const pts = m.pts.filter((p) => p.date >= start && p.date <= end);
      if (pts.length < 2 || !(pts[0].score > 0)) return;
      const g = ((pts[pts.length - 1].score - pts[0].score) / pts[0].score) * 100;

  function renderProgress() {

  // ---------- Stats: charts of how you're changing ----------

  function strengthTrend() {
    const first = {}, latest = {}, types = {}, series = { all: [], push: [], pull: [], legs: [] };
    savedSessions().forEach((d) => {

  const signed = (v, dec, unit) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(dec) + (unit || "");
  // A line over time with shading, colored by whether it moved the good way (green) or not (red).
  function lineChart(lines, opts) {
    const all = lines.flatMap((l) => l.pts);
    if (!all.length) return "";
    const W = 340, H = opts.h || 150, L = 34, R = 12, T = 12, B = 22, pw = W - L - R, ph = H - T - B;
    let lo = Math.min(...all.map((p) => p.v)), hi = Math.max(...all.map((p) => p.v));

    lo = Math.floor((lo - span * 0.08) / step) * step; hi = Math.ceil((hi + span * 0.08) / step) * step;
    const n0 = Math.min(...all.map((p) => p.n)), n1 = Math.max(...all.map((p) => p.n));
    const x = (n) => L + (n1 === n0 ? pw / 2 : ((n - n0) / (n1 - n0)) * pw), y = (v) => T + ph * (1 - (v - lo) / (hi - lo));
    let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(opts.label) + '">';

    const gid = "lg" + uid();
    lines.forEach((l, li) => {
      if (!l.pts.length) return;
      const path = l.pts.map((p, i) => (i ? "L" : "M") + x(p.n).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
      if (l.fill && l.pts.length > 1) {
        s += '<defs><linearGradient id="' + gid + li + '" class="g-' + l.cls + '" gradientUnits="userSpaceOnUse" x1="0" y1="' + Math.min(...l.pts.map((p) => y(p.v))).toFixed(1) + '" x2="0" y2="' + (T + ph) + '"><stop offset="0" stop-opacity="0.4"/><stop offset="1" stop-opacity="0.04"/></linearGradient></defs>';

      const last = l.pts[l.pts.length - 1];

    });
    s += '<text x="' + L + '" y="' + (H - 6) + '">day ' + n0 + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">day ' + n1 + "</text></svg>";

  function strengthStats() {
    const sr = strengthTrend(), all = sr.all;

  // Each exercise shows under one day type: the home of its group (push-ups under Push even when done on a pull day,
  // abs under Pull). Its group: the one your plans and workouts agree on; when they differ, the one its name points to,
  // else the latest; with nothing saved, a guess from the name; with no guess, the day type it's done on most.
  // Where an exercise lives in Progress: the group it's been logged in on a day of its own kind counts most (pull-ups
  // under Back on a pull day), then what its name says, then wherever else it's been put. So pull-ups done on a push
  // day still list under Pull, and abs (whose home is Pull) never list under Push.
  function homeOf(m) {
    const native = [];
    Object.entries(m.groups).forEach(([t, g]) => { if (validGroup(g) && GROUP_HOME[g] === t) native.push(g); });
    Object.keys(GROUPS).forEach((t) => { const p = (storedPlan(t) || []).find((x) => exKey(x.name) === m.k && !x.off); if (p && validGroup(p.group) && GROUP_HOME[p.group] === t) native.push(p.group); });
    const nat = [...new Set(native)], guess = guessAny(m.name);
    let g = nat.length === 1 ? nat[0] : nat.length ? (nat.includes(guess) ? guess : nat.includes(m.lastGroup) ? m.lastGroup : nat[0]) : guess;
    if (g == null) {
      const cands = [];
      Object.keys(GROUPS).forEach((t) => { const p = (storedPlan(t) || []).find((x) => exKey(x.name) === m.k); if (p && validGroup(p.group)) cands.push(p.group); });
      Object.values(m.groups).forEach((x) => cands.push(x));
      const uniq = [...new Set(cands.filter(validGroup))];
      g = uniq.length === 1 ? uniq[0] : uniq.length ? (validGroup(m.lastGroup) ? m.lastGroup : uniq[0]) : null;
    }
    if (g == null) {

      const t = Object.keys(n).filter((x) => TYPES.some((y) => y.id === x)).sort((a, b) => n[b] - n[a])[0] || "push";
      g = groupsFor(t)[0];

  // ---------- keyboard ----------

  // type in the workout sheet, the Save bar steps aside and the sheet scrolls so the whole card you're in (for a new

  // ---------- workouts: Push / Pull / Legs ----------
  const TYPES = [{ id: "push", name: "Push" }, { id: "pull", name: "Pull" }, { id: "legs", name: "Legs" }];
  const typeName = (t) => (TYPES.find((x) => x.id === t) || { name: "Workout" }).name;
  const exKey = (name) => String(name).trim().toLowerCase();
  const isCable = (name) => /cable/i.test(name);
  const toUnit = (w, from, to) => (from === to ? w : from === "kg" ? w * KG_TO_LB : w / KG_TO_LB);
  const half = (n) => Math.round(n * 2) / 2;
  const fmtW = (n) => (Math.round(n * 10) / 10).toLocaleString();
  const stepFor = (unit) => (unit === "kg" ? 2.5 : 5);
  // Estimated one-rep max (Epley). Lets 50 x 7 be compared fairly with 45 x 12.
  const e1rm = (w, r) => (w > 0 ? w * (1 + r / 30) : r);

  // Every set is kept in setList. weight/reps/sets mirror the best set (and the count), so the strength
  // chart, "last time" and summaries keep working. Older workouts get one entry per set they recorded.
  // While a workout is in progress, sets copied from your plan carry done: false until you log them; a set
  // without the flag (every saved workout, and anything from before plans) counts as done.
  function ensureSets(e) {
    if (!Array.isArray(e.setList) || !e.setList.length) e.setList = Array.from({ length: Math.max(1, Math.round(+e.sets) || 1) }, () => ({ w: +e.weight || 0, r: +e.reps || 0 }));
    return e.setList;
  }
  const isDone = (x) => x.done !== false;
  // A workout in progress: each exercise keeps last time's sets as hints (e.last) and, in setList, only the sets you've
  // done today. Until you start it, setList is one placeholder (done: false) holding the first set's numbers. Drafts from
  // before v0.20 kept last time's sets as planned rows; this turns them into the same shape. (A function declaration,
  // not a const, because loading saved days runs it before the rest of the script.)
  function prepDraftEx(e) {
    const l = ensureSets(e);
    if (!Array.isArray(e.last)) e.last = l.map((x) => ({ w: +x.w || 0, r: +x.r || 0 }));
    const done = l.filter((x) => x.done !== false);
    e.setList = done.length ? done : [{ w: +l[0].w || 0, r: +l[0].r || 0, done: false }];
  }
  const doneSets = (e) => ensureSets(e).filter(isDone);
  function syncEx(e) {
    const all = ensureSets(e), d = all.filter(isDone), l = d.length ? d : all;
    let best = l[0];
    l.forEach((x) => { if (e1rm(x.w, x.r) > e1rm(best.w, best.r)) best = x; });
    e.weight = best.w; e.reps = best.r; e.sets = l.length;
  }
  const setsText = (e) => { const d = doneSets(e), l = d.length ? d : ensureSets(e); return l.map((x) => (x.w > 0 ? fmtW(x.w) : "") + "×" + x.r).join(", ") + (l.some((x) => x.w > 0) ? " " + e.unit : ""); };
  const setTxt = (x) => (x.w > 0 ? fmtW(x.w) + "×" + x.r : x.r + " reps");
  const curSet = {}; // exercise id -> index of the set being edited (not saved); unset = the latest set
  function curIdx(e) {
    const n = ensureSets(e).length;
    return curSet[e.id] != null && curSet[e.id] < n ? curSet[e.id] : n - 1;
  }
  function savedSessions(type, before) {
    return Object.keys(state.days).sort().filter((d) => (!before || d < before) && state.days[d].workout && state.days[d].workout.saved && (!type || state.days[d].workout.type === type));
  }
  function lastSession(type, before) {
